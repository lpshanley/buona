[package]
name = "buona"
version = "0.2.0"
edition = "2024"
description = "The Good CLI — making life easier when managing complex workspace and build tasks"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4.5.58", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
dialoguer = "0.12"
console = "0.16"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
hex = "0.4"

[dev-dependencies]
tempfile = "3"

# cargo-release configuration
[package.metadata.release]
allow-branch = ["main"]
publish = false
push = true
push-remote = "origin"
tag-prefix = ""
tag-name = "v{{version}}"
tag-message = "Release v{{version}}"
pre-release-commit-message = "chore: bump version to v{{version}}"
pre-release-hook = ["just", "pre-release"]
