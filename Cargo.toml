[package]
name = "buona"
version = "0.1.0"
edition = "2024"
description = "The Good CLI — making life easier when managing complex workspace and build tasks"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4.5.58", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
dialoguer = "0.11"
console = "0.15"

[dev-dependencies]
tempfile = "3"
