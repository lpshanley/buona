"test\", \"lint\").\n    pub(crate) command: String,\n    /// Additional arguments passed through to the underlying tool (after `--`).\n    pub(crate) args: Vec\u003cString\u003e,\n}\n\n/// Execute the run command.\npub(crate) fn execute(options: RunOptions) -\u003e Result\u003c()\u003e {\n    let s = Styles::default();\n\n    let command_name = \u0026options.command;\n    let extra_args = \u0026options.args;\n\n    // 2. Resolve workspace + package\n    let cwd = env::current_dir().context(\"could not determine current directory\")?;\n    let ws_root = workspace::find_workspace_root(\u0026cwd).map_err(|_| {\n        RunError::NotInWorkspace(\n            \"not inside a buona workspace (no buona.workspace.json found)\\n  \\\n             Run this command from within a workspace.\"\n                .to_string(),\n        )\n    })?;\n\n    let pkg_dir = resolve_package_dir(\u0026cwd, \u0026ws_root)?;\n    let pkg_name = pkg_dir\n        .file_name()\n        .unwrap_or_default()\n        .to_string_lossy()\n        .to_string();\n\n    // 3. Load per-package config (buona.json)\n    let package_config = load_package_config(\u0026pkg_dir)\n        .map_err(|e| RunError::ConfigError(format!(\"{e}\")))?;\n\n    // Extract hook-related fields before moving config into ResolveInput\n    let hooks_dir = package_config\n        .as_ref()\n        .map(|c| c.hooks_dir.clone())\n        .unwrap_or_else(|| \".buona/hooks\".to_string());\n    let explicit_hooks = package_config\n        .as_ref()\n        .map(|c| c.hooks.clone())\n        .unwrap_or_default();\n\n    // 4. Resolve the execution plan\n    let input = ResolveInput {\n        package_dir: pkg_dir.clone(),\n        command: command_name.clone(),\n        extra_args: extra_args.to_vec(),\n        cli_system: options.system,\n        package_config,\n    };\n\n    let plan = resolve_plan(\u0026input)?;\n\n    // 5. Resolve hooks (only for standard commands, not proxied ones)\n    let hook_resolution = if plan.kind != PlanKind::Proxy {\n        let hooks_dir_path = pkg_dir.join(\u0026hooks_dir);\n        let convention_hooks = hooks::scan_hooks_dir(\u0026hooks_dir_path);\n\n        let hook_input = hooks::HookResolveInput {\n            command: command_name.clone(),\n            package_dir: pkg_dir,\n            explicit_hooks,\n            convention_hooks,\n        };\n        Some(hooks::resolve_hooks(\u0026hook_input)?)\n    } else {\n        None\n    };\n\n    // Print warnings from hook resolution\n    if let Some(ref resolution) = hook_resolution {\n        for warning in \u0026resolution.warnings {\n            eprintln!(\n                \"  {} hook \\\"{}\\\": {}\",\n                s.yellow.apply_to(\"warning:\"),\n                warning.hook_name,\n                warning.message,\n            );\n        }\n    }\n\n    // 6. Print resolution info\n    print_plan_info(\u0026s, \u0026pkg_name, \u0026plan, options.verbose);\n\n    if options.verbose {\n        if let Some(ref resolution) = hook_resolution {\n            print_hook_info(\u0026s, resolution);\n        }\n    }\n\n    // 7. Execute or dry-run\n    if options.dry_run {\n        print_dry_run_hooks(\u0026s, \u0026hook_resolution);\n        println!(\n            \"  {} (dry run — not executing)\",\n            s.dim.apply_to(\"---\")\n        );\n        println!();\n        return Ok(());\n    }\n\n    execute_with_hooks(\u0026plan, hook_resolution)\n}\n\n/// Print the auto-detected build system and all marker files found.\npub(crate) fn detect() -\u003e Result\u003c()\u003e {\n    let s = Styles::default();\n\n    let cwd = env::current_dir().context(\"could not determine current directory\")?;\n    let ws_root = workspace::find_workspace_root(\u0026cwd).map_err(|_| {\n        RunError::NotInWorkspace(\n            \"not inside a buona workspace (no buona.workspace.json found)\\n  \\\n             Run this command from within a workspace.\"\n                .to_string(),\n        )\n    })?;\n\n    let pkg_dir = resolve_package_dir(\u0026cwd, \u0026ws_root)?;\n    let pkg_name = pkg_dir\n        .file_name()\n        .unwrap_or_default()\n        .to_string_lossy()\n        .to_string();\n\n    let detections = detect_all_systems(\u0026pkg_dir);\n\n    println!();\n    if detections.is_empty() {\n        println!(\n            \"  {} No build system detected in {}\",\n            s.dim.apply_to(\"—\"),\n            s.cyan.apply_to(\u0026pkg_name),\n        );\n    } else {\n        let winner = \u0026detections[0];\n        println!(\n            \"  {} {} (via {})\",\n            s.green.apply_to(\"detected:\"),\n            s.bold.apply_to(winner.system.to_string()),\n            s.dim.apply_to(\u0026winner.marker),\n        );\n\n        if detections.len() \u003e 1 {\n            println!();\n            println!(\n                \"  {}\",\n                s.dim.apply_to(\"Other marker files found:\")\n            );\n            for d in \u0026detections[1..] {\n                println!(\n                    \"  {}  {} (via {})\",\n                    s.dim.apply_to(\"·\"),\n                    d.system,\n                    s.dim.apply_to(\u0026d.marker),\n                );\n            }\n        }\n    }\n    println!();\n\n    Ok(())\n}\n\n/// Determine the package root directory from the current working directory.\n///\n/// Finds which `src/\u003cname\u003e/` directory the cwd is inside. Returns the package\n/// directory (e.g., `ws_root/src/my-pkg`).\nfn resolve_package_dir(cwd: \u0026Path, ws_root: \u0026Path) -\u003e Result\u003cPathBuf, RunError\u003e {\n    let src_dir = ws_root.join(\"src\");\n\n    if let Ok(relative) = cwd.strip_prefix(\u0026src_dir) {\n        // The first component of the relative path is the package name\n        if let Some(pkg_component) = relative.components().next() {\n            let pkg_name = pkg_component.as_os_str().to_string_lossy();\n            let pkg_dir = src_dir.join(pkg_name.as_ref());\n            if pkg_dir.is_dir() {\n                return Ok(pkg_dir);\n            }\n        }\n    }\n\n    Err(RunError::NoPackageResolved(\n        \"could not determine which package you are in.\\n  \\\n         Run this command from within a package directory (under src/).\"\n            .to_string(),\n    ))\n}\n\nfn print_plan_info(s: \u0026Styles, pkg_name: \u0026str, plan: \u0026ExecutionPlan, verbose: bool) {\n    println!();\n    println!(\n        \"  {} {} in {}\",\n        s.dim.apply_to(\"→\"),\n        s.bold.apply_to(\u0026plan.display),\n        s.cyan.apply_to(pkg_name),\n    );\n\n    if verbose {\n        println!(\n            \"  {}  system: {}\",\n            s.dim.apply_to(\"│\"),\n            plan.system\n        );\n        println!(\n            \"  {}  kind: {:?}\",\n            s.dim.apply_to(\"│\"),\n            plan.kind\n        );\n        println!(\n            \"  {}  cwd: {}\",\n            s.dim.apply_to(\"│\"),\n            plan.cwd.display()\n        );\n    }\n    println!();\n}\n\nfn execute_with_hooks(\n    plan: \u0026ExecutionPlan,\n    hook_resolution: Option\u003cHookResolution\u003e,\n) -\u003e Result\u003c()\u003e {\n    let (pre_hook, post_hook) = match hook_resolution {\n        Some(res) =\u003e (res.pre_hook, res.post_hook),\n        None =\u003e (None, None),\n    };\n\n    // 1. Run pre-hook if present\n    if let Some(ref hook) = pre_hook {\n        let status = execute_hook(hook)?;\n        if !status.success() {\n            std::process::exit(status.code().unwrap_or(1));\n        }\n    }\n\n    // 2. Run main command\n    let status = Command::new(\u0026plan.program)\n        .args(\u0026plan.args)\n        .current_dir(\u0026plan.cwd)\n        .status()\n        .with_context(|| {\n            format!(\n                \"failed to execute {} — is it installed and on your PATH?\",\n                plan.program\n            )\n        })?;\n\n    if !status.success() {\n        std::process::exit(status.code().unwrap_or(1));\n    }\n\n    // 3. Run post-hook if present\n    if let Some(ref hook) = post_hook {\n        let status = execute_hook(hook)?;\n        if !status.success() {\n            std::process::exit(status.code().unwrap_or(1));\n        }\n    }\n\n    Ok(())\n}\n\nfn execute_hook(hook: \u0026ResolvedHook) -\u003e Result\u003cstd::process::ExitStatus\u003e {\n    let s = Styles::default();\n    println!(\n        \"  {} {}\",\n        s.dim.apply_to(\"[hook]\"),\n        s.dim.apply_to(\u0026hook.display),\n    );\n    println!();\n\n    Command::new(\u0026hook.program)\n        .args(\u0026hook.args)\n        .current_dir(\u0026hook.cwd)\n        .status()\n        .with_context(|| {\n            format!(\n                \"failed to execute hook \\\"{}\\\" ({}) — is it installed and on your PATH?\",\n                hook.name, hook.program\n            )\n        })\n}\n\nfn print_hook_info(s: \u0026Styles, resolution: \u0026HookResolution) {\n    let has_hooks = resolution.pre_hook.is_some() || resolution.post_hook.is_some();\n    if !has_hooks {\n        return;\n    }\n    println!(\"  {}  hooks:\", s.dim.apply_to(\"│\"));\n    if let Some(ref hook) = resolution.pre_hook {\n        let source_label = match hook.source {\n            HookSource::Explicit =\u003e \"explicit\",\n            HookSource::Convention =\u003e \"convention\",\n        };\n        println!(\n            \"  {}    {}: {} ({})\",\n            s.dim.apply_to(\"│\"),\n            hook.name,\n            hook.display,\n            s.dim.apply_to(source_label),\n        );\n    }\n    if let Some(ref hook) = resolution.post_hook {\n        let source_label = match hook.source {\n            HookSource::Explicit =\u003e \"explicit\",\n            HookSource::Convention =\u003e \"convention\",\n        };\n        println!(\n            \"  {}    {}: {} ({})\",\n            s.dim.apply_to(\"│\"),\n            hook.name,\n            hook.display,\n            s.dim.apply_to(source_label),\n        );\n    }\n    println!();\n}\n\nfn print_dry_run_hooks(s: \u0026Styles, resolution: \u0026Option\u003cHookResolution\u003e) {\n    if let Some(res) = resolution {\n        if let Some(hook) = \u0026res.pre_hook {\n            println!(\n                \"  {} {}: {}\",\n                s.dim.apply_to(\"[hook]\"),\n                s.bold.apply_to(\u0026hook.name),\n                hook.display,\n            );\n        }\n        if let Some(hook) = \u0026res.post_hook {\n            println!(\n                \"  {} {}: {}\",\n                s.dim.apply_to(\"[hook]\"),\n                s.bold.apply_to(\u0026hook.name),\n                hook.display,\n            );\n        }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use std::fs;\n    use tempfile::TempDir;\n\n    /// Helper: create a workspace with a package.\n    fn setup_workspace_with_package(ws_dir: \u0026Path, ws_name: \u0026str, pkg_name: \u0026str) -\u003e PathBuf {\n        fs::create_dir_all(ws_dir.join(\"src\").join(pkg_name)).unwrap();\n        let json = serde_json::json!({ \"name\": ws_name });\n        fs::write(\n            ws_dir.join(\"buona.workspace.json\"),\n            serde_json::to_string_pretty(\u0026json).unwrap(),\n        )\n        .unwrap();\n        ws_dir.join(\"src\").join(pkg_name)\n    }\n\n    // ── resolve_package_dir tests ────────────────────────────────\n\n    #[test]\n    fn resolve_from_package_root() {\n        let dir = TempDir::new().unwrap();\n        let pkg_dir = setup_workspace_with_package(dir.path(), \"test-ws\", \"my-pkg\");\n\n        let result = resolve_package_dir(\u0026pkg_dir, dir.path()).unwrap();\n        assert_eq!(result, pkg_dir);\n    }\n\n    #[test]\n    fn resolve_from_deep_inside_package() {\n        let dir = TempDir::new().unwrap();\n        let pkg_dir = setup_workspace_with_package(dir.path(), \"test-ws\", \"my-pkg\");\n\n        let deep = pkg_dir.join(\"src\").join(\"nested\");\n        fs::create_dir_all(\u0026deep).unwrap();\n\n        let result = resolve_package_dir(\u0026deep, dir.path()).unwrap();\n        assert_eq!(result, pkg_dir);\n    }\n\n    #[test]\n    fn resolve_fails_at_workspace_root() {\n        let dir = TempDir::new().unwrap();\n        setup_workspace_with_package(dir.path(), \"test-ws\", \"my-pkg\");\n\n        let result = resolve_package_dir(dir.path(), dir.path());\n        assert!(result.is_err());\n    }\n\n    #[test]\n    fn resolve_fails_at_src_dir() {\n        let dir = TempDir::new().unwrap();\n        setup_workspace_with_package(dir.path(), \"test-ws\", \"my-pkg\");\n\n        let src = dir.path().join(\"src\");\n        let result = resolve_package_dir(\u0026src, dir.path());\n        assert!(result.is_err());\n    }\n\n    #[test]\n    fn resolve_with_multiple_packages() {\n        let dir = TempDir::new().unwrap();\n        setup_workspace_with_package(dir.path(), \"test-ws\", \"pkg-a\");\n        fs::create_dir_all(dir.path().join(\"src\").join(\"pkg-b\")).unwrap();\n\n        let result_a = resolve_package_dir(\n            \u0026dir.path().join(\"src\").join(\"pkg-a\"),\n            dir.path(),\n        )\n        .unwrap();\n        let result_b = resolve_package_dir(\n            \u0026dir.path().join(\"src\").join(\"pkg-b\"),\n            dir.path(),\n        )\n        .unwrap();\n\n        assert_eq!(\n            result_a.file_name().unwrap().to_string_lossy(),\n            \"pkg-a\"\n        );\n        assert_eq!(\n            result_b.file_name().unwrap().to_string_lossy(),\n            \"pkg-b\"\n        );\n    }\n}\n","traces":[{"line":32,"address":[],"length":0,"stats":{"Line":0}},{"line":33,"address":[],"length":0,"stats":{"Line":0}},{"line":35,"address":[],"length":0,"stats":{"Line":0}},{"line":36,"address":[],"length":0,"stats":{"Line":0}},{"line":39,"address":[],"length":0,"stats":{"Line":0}},{"line":40,"address":[],"length":0,"stats":{"Line":0}},{"line":41,"address":[],"length":0,"stats":{"Line":0}},{"line":42,"address":[] stats":{"Line":0}},{"line":316,"address":[],"length":0,"stats":{"Line":0}},{"line":317,"address":[],"length":0,"stats":{"Line":0}},{"line":318,"address":[],"length":0,"stats":{"Line":0}},{"line":320,"address":[],"length":0,"stats":{"Line":0}},{"line":322,"address":[],"length":0,"stats":{"Line":0}},{"line":325,"address":[],"length":0,"stats":{"Line":0}},{"line":328,"address":[],"length":0,"stats":{"Line":0}},{"line":329,"address":[],"length":0,"stats":{"Line":0}},{"line":330,"address":[],"length":0,"stats":{"Line":0}},{"line":331,"address":[],"length":0,"stats":{"Line":0}},{"line":333,"address":[],"length":0,"stats":{"Line":0}},{"line":335,"address":[],"length":0,"stats":{"Line":0}},{"line":338,"address":[],"length":0,"stats":{"Line":0}},{"line":341,"address":[],"length":0,"stats":{"Line":0}},{"line":344,"address":[],"length":0,"stats":{"Line":0}},{"line":345,"address":[],"length":0,"stats":{"Line":0}},{"line":346,"address":[],"length":0,"stats":{"Line":0}},{"line":347,"address":[],"length":0,"stats":{"Line":0}},{"line":348,"address":[],"length":0,"stats":{"Line":0}},{"line":349,"address":[],"length":0,"stats":{"Line":0}},{"line":350,"address":[],"length":0,"stats":{"Line":0}},{"line":351,"address":[],"length":0,"stats":{"Line":0}},{"line":354,"address":[],"length":0,"stats":{"Line":0}},{"line":355,"address":[],"length":0,"stats":{"Line":0}},{"line":356,"address":[],"length":0,"stats":{"Line":0}},{"line":357,"address":[],"length":0,"stats":{"Line":0}},{"line":358,"address":[],"length":0,"stats":{"Line":0}},{"line":359,"address":[],"length":0,"stats":{"Line":0}}],"covered":12,"coverable":179},{"path":["/","Users","lpshanley","workplace","buona","src","buona","src","run","resolve.rs"],"content":"//! Pure resolution logic for the `buona run` command.\n//!\n//! The [`resolve_plan()`] function is the core of the run feature. It takes\n//! structured inputs and produces an [`ExecutionPlan`] without performing any\n//! filesystem or process operations, making it independently testable.\n\nuse std::path::PathBuf;\n\nuse super::config::BuonaRunConfig;\nuse super::detect::detect_build_system;\nuse super::error::RunError;\nuse super::systems::{proxy_command, standard_mapping};\nuse super::types::*;\n\n/// Inputs to plan resolution.\npub(super) struct ResolveInput {\n    /// The package directory (cwd for execution).\n    pub(super) package_dir: PathBuf,\n    /// The command the user typed (first token after `--`).\n    pub(super) command: String,\n    /// Additional args the user typed (tokens after the command).\n    pub(super) extra_args: Vec\u003cString\u003e,\n    /// CLI `--system` override (if provided).\n    pub(super) cli_system: Option\u003cString\u003e,\n    /// Per-package `buona.json` config (if present).\n    pub(super) package_config: Option\u003cBuonaRunConfig\u003e,\n}\n\n/// Resolve an execution plan from inputs.\n///\n/// This is the core pure function that drives the entire run feature.\npub(super) fn resolve_plan(input: \u0026ResolveInput) -\u003e Result\u003cExecutionPlan, RunError\u003e {\n    let command_name = \u0026input.command;\n\n    // 1. Check for exec override in buona.json commands\n    if let Some(ref config) = input.package_config {\n        if let Some(cmd_config) = config.commands.get(command_name) {\n            if let Some(ref exec) = cmd_config.exec {\n                if exec.is_empty() {\n                    return Err(RunError::ConfigError(format!(\n                        \"\\\"exec\\\" for command \\\"{command_name}\\\" in buona.json is empty\"\n                    )));\n                }\n                let program = exec[0].clone();\n                let mut args: Vec\u003cString\u003e = exec[1..].to_vec();\n                args.extend(input.extra_args.iter().cloned());\n\n                // Resolve system for display (best-effort)\n                let system = resolve_effective_system(\n                    cmd_config.system,\n                    input.package_config.as_ref(),\n                    input.cli_system.as_deref(),\n                    \u0026input.package_dir,\n                )\n                .unwrap_or(BuildSystem::Make); // fallback for display only\n\n                let display = format_display(\u0026program, \u0026args);\n                return Ok(ExecutionPlan {\n                    cwd: input.package_dir.clone(),\n                    system,\n                    kind: PlanKind::ExecOverride,\n                    program,\n                    args,\n                    display,\n                });\n            }\n        }\n    }\n\n    // 2. Determine effective build system via precedence chain\n    let per_command_system = input\n        .package_config\n        .as_ref()\n        .and_then(|c| c.commands.get(command_name))\n        .and_then(|c| c.system);\n\n    let system = resolve_effective_system(\n        per_command_system,\n        input.package_config.as_ref(),\n        input.cli_system.as_deref(),\n        \u0026input.package_dir,\n    )?;\n\n    // 3. Check if command is a standard command\n    if let Some(std_cmd) = StandardCommand::parse(command_name) {\n        if let Some((program, args)) =\n            standard_mapping(system, std_cmd, \u0026input.extra_args, Some(\u0026input.package_dir))\n        {\n            let display = format_display(\u0026program, \u0026args);\n            return Ok(ExecutionPlan {\n                cwd: input.package_dir.clone(),\n                system,\n                kind: PlanKind::Standard,\n                program,\n                args,\n                display,\n            });\n        }\n        // Standard command but no mapping for this system\n        return Err(RunError::StandardNotMapped {\n            command: command_name.clone(),\n            system: system.to_string(),\n        });\n    }\n\n    // 4. Non-standard command → proxy\n    let (program, args) =\n        proxy_command(system, command_name, \u0026input.extra_args, Some(\u0026input.package_dir));\n    let display = format_display(\u0026program, \u0026args);\n    Ok(ExecutionPlan {\n        cwd: input.package_dir.clone(),\n        system,\n        kind: PlanKind::Proxy,\n        program,\n        args,\n        display,\n    })\n}\n\n/// Resolve the effective build system from the precedence chain:\n///\n/// 1. Per-command override in buona.json\n/// 2. Global system in buona.json (if not \"auto\")\n/// 3. CLI `--system` (if not \"auto\")\n/// 4. Auto-detection from marker files\nfn resolve_effective_system(\n    per_command: Option\u003cBuildSystem\u003e,\n    package_config: Option\u003c\u0026BuonaRunConfig\u003e,\n    cli_system: Option\u003c\u0026str\u003e,\n    package_dir: \u0026std::path::Path,\n) -\u003e Result\u003cBuildSystem, RunError\u003e {\n    // 1. Per-command override\n    if let Some(system) = per_command {\n        return Ok(system);\n    }\n\n    // 2. Global system in buona.json (if not \"auto\")\n    if let Some(config) = package_config {\n        if config.system != \"auto\" {\n            return parse_system_name(\u0026config.system);\n        }\n    }\n\n    // 3. CLI --system\n    if let Some(name) = cli_system {\n        if name != \"auto\" {\n            return parse_system_name(name);\n        }\n    }\n\n    // 4. Auto-detect\n    detect_build_system(package_dir).ok_or_else(|| {\n        RunError::NoPackageResolved(format!(\n            \"could not auto-detect build system in {}\\n  \\\n             Use --system to specify one, or add a buona.json with a \\\"system\\\" field.\",\n            package_dir.display()\n        ))\n    })\n}\n\n/// Parse a system name string into a [`BuildSystem`] enum.\nfn parse_system_name(name: \u0026str) -\u003e Result\u003cBuildSystem, RunError\u003e {\n    serde_json::from_value(serde_json::Value::String(name.to_string()))\n        .map_err(|_| RunError::UnknownSystem(name.to_string()))\n}\n\n/// Format a display string from program and args.\nfn format_display(program: \u0026str, args: \u0026[String]) -\u003e String {\n    let mut parts = vec![program.to_string()];\n    parts.extend(args.iter().cloned());\n    parts.join(\" \")\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use std::collections::HashMap;\n    use tempfile::TempDir;\n\n    fn input_with_system(cmd: \u0026str, system: BuildSystem) -\u003e (TempDir, ResolveInput) {\n        let dir = TempDir::new().unwrap();\n        // Create marker file for the system\n        match system {\n            BuildSystem::Cargo =\u003e {\n                std::fs::write(dir.path().join(\"Cargo.toml\"), \"[package]\").unwrap();\n            }\n            BuildSystem::Npm =\u003e {\n                std::fs::write(dir.path().join(\"package.json\"), \"{}\").unwrap();\n            }\n            _ =\u003e {}\n        }\n        let input = ResolveInput {\n            package_dir: dir.path().to_path_buf(),\n            command: cmd.to_string(),\n            extra_args: vec![],\n            cli_system: None,\n            package_config: None,\n        };\n        (dir, input)\n    }\n\n    // ── standard command resolution ──────────────────────────────\n\n    #[test]\n    fn resolves_cargo_test() {\n        let (_dir, input) = input_with_system(\"test\", BuildSystem::Cargo);\n        let plan = resolve_plan(\u0026input).unwrap();\n        assert_eq!(plan.program, \"cargo\");\n        assert_eq!(plan.args, vec![\"test\"]);\n        assert_eq!(plan.kind, PlanKind::Standard);\n        assert_eq!(plan.system, BuildSystem::Cargo);\n    }\n\n    #[test]\n    fn resolves_cargo_test_with_extra_args() {\n        let dir = TempDir::new().unwrap();\n        std::fs::write(dir.path().join(\"Cargo.toml\"), \"[package]\").unwrap();\n        let input = ResolveInput {\n            package_dir: dir.path().to_path_buf(),\n            command: \"test\".to_string(),\n            extra_args: vec![\"--nocapture\".to_string()],\n            cli_system: None,\n            package_config: None,\n        };\n        let plan = resolve_plan(\u0026input).unwrap();\n        assert_eq!(plan.program, \"cargo\");\n        assert_eq!(plan.args, vec![\"test\", \"--\", \"--nocapture\"]);\n    }\n\n    #[test]\n    fn resolves_npm_build() {\n        let (_dir, input) = input_with_system(\"build\", BuildSystem::Npm);\n        let plan = resolve_plan(\u0026input).unwrap();\n        assert_eq!(plan.program, \"npm\");\n        assert_eq!(plan.args, vec![\"run\", \"build\"]);\n        assert_eq!(plan.kind, PlanKind::Standard);\n    }\n\n    // ── proxy command resolution ─────────────────────────────────\n\n    #[test]\n    fn resolves_proxy_for_unknown_command() {\n        let dir = TempDir::new().unwrap();\n        std::fs::write(dir.path().join(\"Cargo.toml\"), \"[package]\").unwrap();\n        let input = ResolveInput {\n            package_dir: dir.path().to_path_buf(),\n            command: \"asm\".to_string(),\n            extra_args: vec![],\n            cli_system: None,\n            package_config: None,\n        };\n        let plan = resolve_plan(\u0026input).unwrap();\n        assert_eq!(plan.program, \"cargo\");\n        assert_eq!(plan.args, vec![\"asm\"]);\n        assert_eq!(plan.kind, PlanKind::Proxy);\n    }\n\n    #[test]\n    fn resolves_npm_proxy_with_run() {\n        let dir = TempDir::new().unwrap();\n        std::fs::write(dir.path().join(\"package.json\"), \"{}\").unwrap();\n        let input = ResolveInput {\n            package_dir: dir.path().to_path_buf(),\n            command: \"my-script\".to_string(),\n            extra_args: vec![],\n            cli_system: None,\n            package_config: None,\n        };\n        let plan = resolve_plan(\u0026input).unwrap();\n        assert_eq!(plan.program, \"npm\");\n        assert_eq!(plan.args, vec![\"run\", \"my-script\"]);\n        assert_eq!(plan.kind, PlanKind::Proxy);\n    }\n\n    // ── CLI --system override ────────────────────────────────────\n\n    #[test]\n    fn cli_system_override() {\n        let dir = TempDir::new().unwrap();\n        // No marker files — rely on CLI override\n        let input = ResolveInput {\n            package_dir: dir.path().to_path_buf(),\n            command: \"test\".to_string(),\n            extra_args: vec![],\n            cli_system: Some(\"cargo\".to_string()),\n            package_config: None,\n        };\n        let plan = resolve_plan(\u0026input).unwrap();\n        assert_eq!(plan.system, BuildSystem::Cargo);\n        assert_eq!(plan.program, \"cargo\");\n    }\n\n    #[test]\n    fn unknown_cli_system_returns_error() {\n        let dir = TempDir::new().unwrap();\n        let input = ResolveInput {\n            package_dir: dir.path().to_path_buf(),\n            command: \"test\".to_string(),\n            extra_args: vec![],\n            cli_system: Some(\"foobar\".to_string()),\n            package_config: None,\n        };\n        let result = resolve_plan(\u0026input);\n        assert!(result.is_err());\n        match result.unwrap_err() {\n            RunError::UnknownSystem(name) =\u003e assert_eq!(name, \"foobar\"),\n            other =\u003e panic!(\"expected UnknownSystem, got: {other}\"),\n        }\n    }\n\n    // ── buona.json config overrides ──────────────────────────────\n\n    #[test]\n    fn config_global_system_override() {\n        let dir = TempDir::new().unwrap();\n        // No marker files — rely on config\n        let config = BuonaRunConfig {\n            system: \"npm\".to_string(),\n            commands: HashMap::new(),\n            hooks_dir: \".buona/hooks\".to_string(),\n            hooks: HashMap::new(),\n        };\n        let input = ResolveInput {\n            package_dir: dir.path().to_path_buf(),\n            command: \"test\".to_string(),\n            extra_args: vec![],\n            cli_system: None,\n            package_config: Some(config),\n        };\n        let plan = resolve_plan(\u0026input).unwrap();\n        assert_eq!(plan.system, BuildSystem::Npm);\n        assert_eq!(plan.program, \"npm\");\n    }\n\n    #[test]\n    fn config_per_command_system_override() {\n        let dir = TempDir::new().unwrap();\n        std::fs::write(dir.path().join(\"Cargo.toml\"), \"[package]\").unwrap();\n\n        let mut commands = HashMap::new();\n        commands.insert(\n            \"build\".to_string(),\n            super::super::config::CommandConfig {\n                system: Some(BuildSystem::Make),\n                exec: None,\n            },\n        );\n        let config = BuonaRunConfig {\n            system: \"auto\".to_string(),\n            commands,\n            hooks_dir: \".buona/hooks\".to_string(),\n            hooks: HashMap::new(),\n        };\n        let input = ResolveInput {\n            package_dir: dir.path().to_path_buf(),\n            command: \"build\".to_string(),\n            extra_args: vec![],\n            cli_system: None,\n            package_config: Some(config),\n        };\n        let plan = resolve_plan(\u0026input).unwrap();\n        assert_eq!(plan.system, BuildSystem::Make);\n        assert_eq!(plan.program, \"make\");\n        assert!(plan.args.is_empty());\n    }\n\n    #[test]\n    fn config_exec_override() {\n        let dir = TempDir::new().unwrap();\n        std::fs::write(dir.path().join(\"Cargo.toml\"), \"[package]\").unwrap();\n\n        let mut commands = HashMap::new();\n        commands.insert(\n            \"test\".to_string(),\n            super::super::config::CommandConfig {\n                system: None,\n                exec: Some(vec![\n                    \"pnpm\".to_string(),\n                    \"run\".to_string(),\n                    \"custom-test\".to_string(),\n                ]),\n            },\n        );\n        let config = BuonaRunConfig {\n            system: \"auto\".to_string(),\n            commands,\n            hooks_dir: \".buona/hooks\".to_string(),\n            hooks: HashMap::new(),\n        };\n        let input = ResolveInput {\n            package_dir: dir.path().to_path_buf(),\n            command: \"test\".to_string(),\n            extra_args: vec![],\n            cli_system: None,\n            package_config: Some(config),\n        };\n        let plan = resolve_plan(\u0026input).unwrap();\n        assert_eq!(plan.kind, PlanKind::ExecOverride);\n        assert_eq!(plan.program, \"pnpm\");\n        assert_eq!(plan.args, vec![\"run\", \"custom-test\"]);\n    }\n\n    #[test]\n    fn empty_exec_override_returns_error() {\n        let dir = TempDir::new().unwrap();\n        let mut commands = HashMap::new();\n        commands.insert(\n            \"test\".to_string(),\n            super::super::config::CommandConfig {\n                system: None,\n                exec: Some(vec![]),\n            },\n        );\n        let config = BuonaRunConfig {\n            system: \"auto\".to_string(),\n            commands,\n            hooks_dir: \".buona/hooks\".to_string(),\n            hooks: HashMap::new(),\n        };\n        let input = ResolveInput {\n            package_dir: dir.path().to_path_buf(),\n            command: \"test\".to_string(),\n            extra_args: vec![],\n            cli_system: None,\n            package_config: Some(config),\n        };\n        let result = resolve_plan(\u0026input);\n        assert!(result.is_err());\n        match result.unwrap_err() {\n            RunError::ConfigError(msg) =\u003e assert!(msg.contains(\"empty\")),\n            other =\u003e panic!(\"expected ConfigError, got: {other}\"),\n        }\n    }\n\n    // ── precedence tests ─────────────────────────────────────────\n\n    #[test]\n    fn per_command_config_beats_global_config() {\n        let dir = TempDir::new().unwrap();\n        let mut commands = HashMap::new();\n        commands.insert(\n            \"build\".to_string(),\n            super::super::config::CommandConfig {\n                system: Some(BuildSystem::Make),\n                exec: None,\n            },\n        );\n        let config = BuonaRunConfig {\n            system: \"cargo\".to_string(), // global says cargo\n            commands,                     // but build says make\n            hooks_dir: \".buona/hooks\".to_string(),\n            hooks: HashMap::new(),\n        };\n        let input = ResolveInput {\n            package_dir: dir.path().to_path_buf(),\n            command: \"build\".to_string(),\n            extra_args: vec![],\n            cli_system: None,\n            package_config: Some(config),\n        };\n        let plan = resolve_plan(\u0026input).unwrap();\n        assert_eq!(plan.system, BuildSystem::Make);\n    }\n\n    #[test]\n    fn global_config_beats_cli_system() {\n        let dir = TempDir::new().unwrap();\n        let config = BuonaRunConfig {\n            system: \"npm\".to_string(),\n            commands: HashMap::new(),\n            hooks_dir: \".buona/hooks\".to_string(),\n            hooks: HashMap::new(),\n        };\n        let input = ResolveInput {\n            package_dir: dir.path().to_path_buf(),\n            command: \"test\".to_string(),\n            extra_args: vec![],\n            cli_system: Some(\"cargo\".to_string()), // CLI says cargo\n            package_config: Some(config),           // config says npm\n        };\n        let plan = resolve_plan(\u0026input).unwrap();\n        assert_eq!(plan.system, BuildSystem::Npm); // config wins\n    }\n\n    #[test]\n    fn cli_system_beats_auto_detect() {\n        let dir = TempDir::new().unwrap();\n        std::fs::write(dir.path().join(\"Cargo.toml\"), \"[package]\").unwrap();\n\n        let input = ResolveInput {\n            package_dir: dir.path().to_path_buf(),\n            command: \"test\".to_string(),\n            extra_args: vec![],\n            cli_system: Some(\"npm\".to_string()), // CLI says npm\n            package_config: None,\n        };\n        let plan = resolve_plan(\u0026input).unwrap();\n        assert_eq!(plan.system, BuildSystem::Npm); // CLI wins over Cargo.toml\n    }\n\n    // ── standard not mapped ──────────────────────────────────────\n\n    #[test]\n    fn standard_not_mapped_returns_error() {\n        let dir = TempDir::new().unwrap();\n        let input = ResolveInput {\n            package_dir: dir.path().to_path_buf(),\n            command: \"dev\".to_string(),\n            extra_args: vec![],\n            cli_system: Some(\"cargo\".to_string()),\n            package_config: None,\n        };\n        let result = resolve_plan(\u0026input);\n        assert!(result.is_err());\n        match result.unwrap_err() {\n            RunError::StandardNotMapped { command, system } =\u003e {\n                assert_eq!(command, \"dev\");\n                assert_eq!(system, \"cargo\");\n            }\n            other =\u003e panic!(\"expected StandardNotMapped, got: {other}\"),\n        }\n    }\n\n    // ── no system detectable ─────────────────────────────────────\n\n    #[test]\n    fn no_system_detectable_returns_error() {\n        let dir = TempDir::new().unwrap();\n        let input = ResolveInput {\n            package_dir: dir.path().to_path_buf(),\n            command: \"test\".to_string(),\n            extra_args: vec![],\n            cli_system: None,\n            package_config: None,\n        };\n        let result = resolve_plan(\u0026input);\n        assert!(result.is_err());\n    }\n\n    // ── display format ───────────────────────────────────────────\n\n    #[test]\n    fn display_format() {\n        let display = format_display(\"cargo\", \u0026[\"test\".to_string(), \"--\".to_string(), \"--nocapture\".to_string()]);\n        assert_eq!(display, \"cargo test -- --nocapture\");\n    }\n}\n","traces":[{"line":32,"address":[],"length":0,"stats":{"Line":16}},{"line":33,"address":[],"length":0,"stats":{"Line":32}},{"line":36,"address":[],"length":0,"stats":{"Line":22}},{"line":37,"address":[],"length":0,"stats":{"Line":16}},{"line":38,"address":[],"length":0,"stats":{"Line":6}},{"line":39,"address":[],"length":0,"stats":{"Line":4}},{"line":40,"address":[],"length":0 lace","buona","src","buona","src","run","systems.rs"],"content":"//! Build system definitions: marker files, standard command mappings, and proxy behavior.\n\nuse std::path::Path;\n\nuse super::types::{BuildSystem, StandardCommand};\n\n/// Marker files used to auto-detect a build system.\n///\n/// Returns `(marker_filename, build_system)` pairs ordered by priority.\n/// Earlier entries take precedence when multiple markers exist.\npub(super) fn marker_files() -\u003e \u0026'static [(\u0026'static str, BuildSystem)] {\n    \u0026[\n        (\"Cargo.toml\", BuildSystem::Cargo),\n        (\"go.mod\", BuildSystem::Go),\n        (\"bun.lock\", BuildSystem::Bun),\n        (\"bun.lockb\", BuildSystem::Bun),\n        (\"pnpm-lock.yaml\", BuildSystem::Pnpm),\n        (\"yarn.lock\", BuildSystem::Yarn),\n        (\"package-lock.json\", BuildSystem::Npm),\n        (\"package.json\", BuildSystem::Npm),\n        (\"build.gradle.kts\", BuildSystem::Gradle),\n        (\"build.gradle\", BuildSystem::Gradle),\n        (\"pom.xml\", BuildSystem::Maven),\n        (\"pyproject.toml\", BuildSystem::Uv),\n        (\"Makefile\", BuildSystem::Make),\n    ]\n}\n\n/// For `pyproject.toml`, distinguish between uv and poetry by checking content.\npub(super) fn refine_python_system(pyproject_content: \u0026str) -\u003e BuildSystem {\n    if pyproject_content.contains(\"[tool.poetry]\") {\n        BuildSystem::Poetry\n    } else {\n        BuildSystem::Uv\n    }\n}\n\n/// Detect the gradle program to use, preferring `./gradlew` if present.\nfn detect_gradle_program(dir: Option\u003c\u0026Path\u003e) -\u003e String {\n    if let Some(d) = dir {\n        if d.join(\"gradlew\").exists() {\n            return \"./gradlew\".to_string();\n        }\n    }\n    \"gradle\".to_string()\n}\n\n/// Detect the maven program to use, preferring `./mvnw` if present.\nfn detect_maven_program(dir: Option\u003c\u0026Path\u003e) -\u003e String {\n    if let Some(d) = dir {\n        if d.join(\"mvnw\").exists() {\n            return \"./mvnw\".to_string();\n        }\n    }\n    \"mvn\".to_string()\n}\n\n/// Map a standard command to `(program, args)` for a given build system.\n///\n/// Returns `None` if the standard command has no mapping for this system.\n/// The `package_dir` is needed for Gradle/Maven to detect wrapper scripts.\npub(super) fn standard_mapping(\n    system: BuildSystem,\n    cmd: StandardCommand,\n    extra_args: \u0026[String],\n    package_dir: Option\u003c\u0026Path\u003e,\n) -\u003e Option\u003c(String, Vec\u003cString\u003e)\u003e {\n    let (program, base_args): (\u0026str, Vec\u003c\u0026str\u003e) = match (system, cmd) {\n        // ── Cargo ────────────────────────────────────\n        (BuildSystem::Cargo, StandardCommand::Install) =\u003e (\"cargo\", vec![\"build\"]),\n        (BuildSystem::Cargo, StandardCommand::Build) =\u003e (\"cargo\", vec![\"build\"]),\n        (BuildSystem::Cargo, StandardCommand::Run) =\u003e (\"cargo\", vec![\"run\"]),\n        (BuildSystem::Cargo, StandardCommand::Test) =\u003e (\"cargo\", vec![\"test\"]),\n        (BuildSystem::Cargo, StandardCommand::Lint) =\u003e (\"cargo\", vec![\"clippy\"]),\n        (BuildSystem::Cargo, StandardCommand::Fmt) =\u003e (\"cargo\", vec![\"fmt\"]),\n        (BuildSystem::Cargo, StandardCommand::Clean) =\u003e (\"cargo\", vec![\"clean\"]),\n        (BuildSystem::Cargo, StandardCommand::Publish) =\u003e (\"cargo\", vec![\"publish\"]),\n        (BuildSystem::Cargo, StandardCommand::Bench) =\u003e (\"cargo\", vec![\"bench\"]),\n        (BuildSystem::Cargo, StandardCommand::Doc) =\u003e (\"cargo\", vec![\"doc\"]),\n        (BuildSystem::Cargo, StandardCommand::Dev) =\u003e return None,\n\n        // ── Go ───────────────────────────────────────\n        (BuildSystem::Go, StandardCommand::Install) =\u003e (\"go\", vec![\"mod\", \"download\"]),\n        (BuildSystem::Go, StandardCommand::Build) =\u003e (\"go\", vec![\"build\", \"./...\"]),\n        (BuildSystem::Go, StandardCommand::Run) =\u003e (\"go\", vec![\"run\", \".\"]),\n        (BuildSystem::Go, StandardCommand::Test) =\u003e (\"go\", vec![\"test\", \"./...\"]),\n        (BuildSystem::Go, StandardCommand::Lint) =\u003e (\"golangci-lint\", vec![\"run\"]),\n        (BuildSystem::Go, StandardCommand::Fmt) =\u003e (\"gofmt\", vec![\"-w\", \".\"]),\n        (BuildSystem::Go, StandardCommand::Clean) =\u003e (\"go\", vec![\"clean\"]),\n        (BuildSystem::Go, StandardCommand::Doc) =\u003e (\"go\", vec![\"doc\", \"./...\"]),\n        (BuildSystem::Go, _) =\u003e return None,\n\n        // ── npm ──────────────────────────────────────\n        (BuildSystem::Npm, StandardCommand::Install) =\u003e (\"npm\", vec![\"install\"]),\n        (BuildSystem::Npm, StandardCommand::Build) =\u003e (\"npm\", vec![\"run\", \"build\"]),\n        (BuildSystem::Npm, StandardCommand::Run) =\u003e (\"npm\", vec![\"start\"]),\n        (BuildSystem::Npm, StandardCommand::Test) =\u003e (\"npm\", vec![\"test\"]),\n        (BuildSystem::Npm, StandardCommand::Lint) =\u003e (\"npm\", vec![\"run\", \"lint\"]),\n        (BuildSystem::Npm, StandardCommand::Fmt) =\u003e (\"npm\", vec![\"run\", \"fmt\"]),\n        (BuildSystem::Npm, StandardCommand::Clean) =\u003e (\"npm\", vec![\"run\", \"clean\"]),\n        (BuildSystem::Npm, StandardCommand::Publish) =\u003e (\"npm\", vec![\"publish\"]),\n        (BuildSystem::Npm, StandardCommand::Dev) =\u003e (\"npm\", vec![\"run\", \"dev\"]),\n        (BuildSystem::Npm, _) =\u003e return None,\n\n        // ── pnpm ─────────────────────────────────────\n        (BuildSystem::Pnpm, StandardCommand::Install) =\u003e (\"pnpm\", vec![\"install\"]),\n        (BuildSystem::Pnpm, StandardCommand::Build) =\u003e (\"pnpm\", vec![\"build\"]),\n        (BuildSystem::Pnpm, StandardCommand::Run) =\u003e (\"pnpm\", vec![\"start\"]),\n        (BuildSystem::Pnpm, StandardCommand::Test) =\u003e (\"pnpm\", vec![\"test\"]),\n        (BuildSystem::Pnpm, StandardCommand::Lint) =\u003e (\"pnpm\", vec![\"lint\"]),\n        (BuildSystem::Pnpm, StandardCommand::Fmt) =\u003e (\"pnpm\", vec![\"fmt\"]),\n        (BuildSystem::Pnpm, StandardCommand::Clean) =\u003e (\"pnpm\", vec![\"clean\"]),\n        (BuildSystem::Pnpm, StandardCommand::Publish) =\u003e (\"pnpm\", vec![\"publish\"]),\n        (BuildSystem::Pnpm, StandardCommand::Dev) =\u003e (\"pnpm\", vec![\"dev\"]),\n        (BuildSystem::Pnpm, _) =\u003e return None,\n\n        // ── yarn ─────────────────────────────────────\n        (BuildSystem::Yarn, StandardCommand::Install) =\u003e (\"yarn\", vec![\"install\"]),\n        (BuildSystem::Yarn, StandardCommand::Build) =\u003e (\"yarn\", vec![\"build\"]),\n        (BuildSystem::Yarn, StandardCommand::Run) =\u003e (\"yarn\", vec![\"start\"]),\n        (BuildSystem::Yarn, StandardCommand::Test) =\u003e (\"yarn\", vec![\"test\"]),\n        (BuildSystem::Yarn, StandardCommand::Lint) =\u003e (\"yarn\", vec![\"lint\"]),\n        (BuildSystem::Yarn, StandardCommand::Fmt) =\u003e (\"yarn\", vec![\"fmt\"]),\n        (BuildSystem::Yarn, StandardCommand::Clean) =\u003e (\"yarn\", vec![\"clean\"]),\n        (BuildSystem::Yarn, StandardCommand::Publish) =\u003e (\"yarn\", vec![\"publish\"]),\n        (BuildSystem::Yarn, StandardCommand::Dev) =\u003e (\"yarn\", vec![\"dev\"]),\n        (BuildSystem::Yarn, _) =\u003e return None,\n\n        // ── bun ──────────────────────────────────────\n        (BuildSystem::Bun, StandardCommand::Install) =\u003e (\"bun\", vec![\"install\"]),\n        (BuildSystem::Bun, StandardCommand::Build) =\u003e (\"bun\", vec![\"run\", \"build\"]),\n        (BuildSystem::Bun, StandardCommand::Run) =\u003e (\"bun\", vec![\"start\"]),\n        (BuildSystem::Bun, StandardCommand::Test) =\u003e (\"bun\", vec![\"test\"]),\n        (BuildSystem::Bun, StandardCommand::Lint) =\u003e (\"bun\", vec![\"run\", \"lint\"]),\n        (BuildSystem::Bun, StandardCommand::Fmt) =\u003e (\"bun\", vec![\"run\", \"fmt\"]),\n        (BuildSystem::Bun, StandardCommand::Clean) =\u003e (\"bun\", vec![\"run\", \"clean\"]),\n        (BuildSystem::Bun, StandardCommand::Publish) =\u003e (\"bun\", vec![\"publish\"]),\n        (BuildSystem::Bun, StandardCommand::Dev) =\u003e (\"bun\", vec![\"run\", \"dev\"]),\n        (BuildSystem::Bun, _) =\u003e return None,\n\n        // ── uv ───────────────────────────────────────\n        (BuildSystem::Uv, StandardCommand::Install) =\u003e (\"uv\", vec![\"sync\"]),\n        (BuildSystem::Uv, StandardCommand::Build) =\u003e (\"uv\", vec![\"build\"]),\n        (BuildSystem::Uv, StandardCommand::Run) =\u003e (\"uv\", vec![\"run\", \"python\", \"-m\"]),\n        (BuildSystem::Uv, StandardCommand::Test) =\u003e (\"uv\", vec![\"run\", \"pytest\"]),\n        (BuildSystem::Uv, StandardCommand::Lint) =\u003e (\"uv\", vec![\"run\", \"ruff\", \"check\", \".\"]),\n        (BuildSystem::Uv, StandardCommand::Fmt) =\u003e (\"uv\", vec![\"run\", \"ruff\", \"format\", \".\"]),\n        (BuildSystem::Uv, StandardCommand::Publish) =\u003e (\"uv\", vec![\"publish\"]),\n        (BuildSystem::Uv, _) =\u003e return None,\n\n        // ── poetry ───────────────────────────────────\n        (BuildSystem::Poetry, StandardCommand::Install) =\u003e (\"poetry\", vec![\"install\"]),\n        (BuildSystem::Poetry, StandardCommand::Build) =\u003e (\"poetry\", vec![\"build\"]),\n        (BuildSystem::Poetry, StandardCommand::Run) =\u003e (\"poetry\", vec![\"run\", \"python\", \"-m\"]),\n        (BuildSystem::Poetry, StandardCommand::Test) =\u003e (\"poetry\", vec![\"run\", \"pytest\"]),\n        (BuildSystem::Poetry, StandardCommand::Lint) =\u003e {\n            (\"poetry\", vec![\"run\", \"ruff\", \"check\", \".\"])\n        }\n        (BuildSystem::Poetry, StandardCommand::Fmt) =\u003e {\n            (\"poetry\", vec![\"run\", \"ruff\", \"format\", \".\"])\n        }\n        (BuildSystem::Poetry, StandardCommand::Publish) =\u003e (\"poetry\", vec![\"publish\"]),\n        (BuildSystem::Poetry, _) =\u003e return None,\n\n        // ── make ─────────────────────────────────────\n        (BuildSystem::Make, StandardCommand::Build) =\u003e (\"make\", vec![]),\n        (BuildSystem::Make, StandardCommand::Test) =\u003e (\"make\", vec![\"test\"]),\n        (BuildSystem::Make, StandardCommand::Clean) =\u003e (\"make\", vec![\"clean\"]),\n        (BuildSystem::Make, StandardCommand::Install) =\u003e (\"make\", vec![\"install\"]),\n        (BuildSystem::Make, _) =\u003e return None,\n\n        // ── gradle ───────────────────────────────────\n        (BuildSystem::Gradle, StandardCommand::Build) =\u003e return Some(gradle_mapping(\"build\", extra_args, package_dir)),\n        (BuildSystem::Gradle, StandardCommand::Test) =\u003e return Some(gradle_mapping(\"test\", extra_args, package_dir)),\n        (BuildSystem::Gradle, StandardCommand::Clean) =\u003e return Some(gradle_mapping(\"clean\", extra_args, package_dir)),\n        (BuildSystem::Gradle, StandardCommand::Install) =\u003e return Some(gradle_mapping(\"assemble\", extra_args, package_dir)),\n        (BuildSystem::Gradle, StandardCommand::Lint) =\u003e return Some(gradle_mapping(\"check\", extra_args, package_dir)),\n        (BuildSystem::Gradle, StandardCommand::Publish) =\u003e return Some(gradle_mapping(\"publish\", extra_args, package_dir)),\n        (BuildSystem::Gradle, StandardCommand::Doc) =\u003e return Some(gradle_mapping(\"javadoc\", extra_args, package_dir)),\n        (BuildSystem::Gradle, _) =\u003e return None,\n\n        // ── maven ────────────────────────────────────\n        (BuildSystem::Maven, StandardCommand::Build) =\u003e return Some(maven_mapping(\"compile\", extra_args, package_dir)),\n        (BuildSystem::Maven, StandardCommand::Test) =\u003e return Some(maven_mapping(\"test\", extra_args, package_dir)),\n        (BuildSystem::Maven, StandardCommand::Clean) =\u003e return Some(maven_mapping(\"clean\", extra_args, package_dir)),\n        (BuildSystem::Maven, StandardCommand::Install) =\u003e return Some(maven_mapping(\"install\", extra_args, package_dir)),\n        (BuildSystem::Maven, StandardCommand::Publish) =\u003e return Some(maven_mapping(\"deploy\", extra_args, package_dir)),\n        (BuildSystem::Maven, StandardCommand::Doc) =\u003e return Some(maven_mapping(\"javadoc:javadoc\", extra_args, package_dir)),\n        (BuildSystem::Maven, _) =\u003e return None,\n    };\n\n    let mut args: Vec\u003cString\u003e = base_args.into_iter().map(String::from).collect();\n    if !extra_args.is_empty() {\n        // For cargo/go, insert -- before extra args for standard commands\n        if matches!(system, BuildSystem::Cargo | BuildSystem::Go) {\n            args.push(\"--\".to_string());\n        }\n        args.extend(extra_args.iter().cloned());\n    }\n    Some((program.to_string(), args))\n}\n\n/// Build a gradle standard command mapping with wrapper detection.\nfn gradle_mapping(\n    task: \u0026str,\n    extra_args: \u0026[String],\n    package_dir: Option\u003c\u0026Path\u003e,\n) -\u003e (String, Vec\u003cString\u003e) {\n    let program = detect_gradle_program(package_dir);\n    let mut args = vec![task.to_string()];\n    args.extend(extra_args.iter().cloned());\n    (program, args)\n}\n\n/// Build a maven standard command mapping with wrapper detection.\nfn maven_mapping(\n    goal: \u0026str,\n    extra_args: \u0026[String],\n    package_dir: Option\u003c\u0026Path\u003e,\n) -\u003e (String, Vec\u003cString\u003e) {\n    let program = detect_maven_program(package_dir);\n    let mut args = vec![goal.to_string()];\n    args.extend(extra_args.iter().cloned());\n    (program, args)\n}\n\n/// Build a proxy command for an unrecognized command name.\n///\n/// Returns `(program, args)`. The `package_dir` is needed for Gradle/Maven wrapper detection.\npub(super) fn proxy_command(\n    system: BuildSystem,\n    command: \u0026str,\n    extra_args: \u0026[String],\n    package_dir: Option\u003c\u0026Path\u003e,\n) -\u003e (String, Vec\u003cString\u003e) {\n    let (program, mut args) = match system {\n        // npm: builtins pass through directly, else \"npm run \u003ccmd\u003e\"\n        BuildSystem::Npm =\u003e {\n            if is_npm_builtin(command) {\n                (\"npm\".to_string(), vec![command.to_string()])\n            } else {\n                (\n                    \"npm\".to_string(),\n                    vec![\"run\".to_string(), command.to_string()],\n                )\n            }\n        }\n        // bun: builtins pass through, else \"bun run \u003ccmd\u003e\"\n        BuildSystem::Bun =\u003e {\n            if is_bun_builtin(command) {\n                (\"bun\".to_string(), vec![command.to_string()])\n            } else {\n                (\n                    \"bun\".to_string(),\n                    vec![\"run\".to_string(), command.to_string()],\n                )\n            }\n        }\n        // pnpm/yarn: always \"\u003ctool\u003e \u003ccmd\u003e\"\n        BuildSystem::Pnpm =\u003e (\"pnpm\".to_string(), vec![command.to_string()]),\n        BuildSystem::Yarn =\u003e (\"yarn\".to_string(), vec![command.to_string()]),\n        // Non-JS systems: \"\u003ctool\u003e \u003ccmd\u003e\"\n        BuildSystem::Cargo =\u003e (\"cargo\".to_string(), vec![command.to_string()]),\n        BuildSystem::Go =\u003e (\"go\".to_string(), vec![command.to_string()]),\n        BuildSystem::Uv =\u003e (\n            \"uv\".to_string(),\n            vec![\"run\".to_string(), command.to_string()],\n        ),\n        BuildSystem::Poetry =\u003e (\n            \"poetry\".to_string(),\n            vec![\"run\".to_string(), command.to_string()],\n        ),\n        BuildSystem::Make =\u003e (\"make\".to_string(), vec![command.to_string()]),\n        BuildSystem::Gradle =\u003e {\n            let program = detect_gradle_program(package_dir);\n            (program, vec![command.to_string()])\n        }\n        BuildSystem::Maven =\u003e {\n            let program = detect_maven_program(package_dir);\n            (program, vec![command.to_string()])\n        }\n    };\n    args.extend(extra_args.iter().cloned());\n    (program, args)\n}\n\nfn is_npm_builtin(cmd: \u0026str) -\u003e bool {\n    matches!(\n        cmd,\n        \"install\"\n            | \"ci\"\n            | \"test\"\n            | \"start\"\n            | \"stop\"\n            | \"restart\"\n            | \"publish\"\n            | \"pack\"\n            | \"init\"\n            | \"version\"\n            | \"uninstall\"\n            | \"update\"\n            | \"outdated\"\n            | \"ls\"\n            | \"link\"\n            | \"audit\"\n    )\n}\n\nfn is_bun_builtin(cmd: \u0026str) -\u003e bool {\n    matches!(\n        cmd,\n        \"install\"\n            | \"add\"\n            | \"remove\"\n            | \"update\"\n            | \"link\"\n            | \"test\"\n            | \"init\"\n            | \"create\"\n            | \"upgrade\"\n            | \"pm\"\n    )\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    // ── standard_mapping tests ───────────────────────────────────\n\n    #[test]\n    fn cargo_test_mapping() {\n        let (prog, args) = standard_mapping(\n            BuildSystem::Cargo,\n            StandardCommand::Test,\n            \u0026[],\n            None,\n        )\n        .unwrap();\n        assert_eq!(prog, \"cargo\");\n        assert_eq!(args, vec![\"test\"]);\n    }\n\n    #[test]\n    fn cargo_test_with_extra_args() {\n        let extra = vec![\"--nocapture\".to_string()];\n        let (prog, args) = standard_mapping(\n            BuildSystem::Cargo,\n            StandardCommand::Test,\n            \u0026extra,\n            None,\n        )\n        .unwrap();\n        assert_eq!(prog, \"cargo\");\n        assert_eq!(args, vec![\"test\", \"--\", \"--nocapture\"]);\n    }\n\n    #[test]\n    fn cargo_lint_maps_to_clippy() {\n        let (prog, args) = standard_mapping(\n            BuildSystem::Cargo,\n            StandardCommand::Lint,\n            \u0026[],\n            None,\n        )\n        .un
