<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <style>:root {
  --color: black;
  --bg: white;
  --head-bg: white;
  --link: #338;

  --blue: #ccf;
  --red: #fcc;
  --yellow: #ffc;
  --green: #cfc;
}

[data-theme='dark'] {
  --color: white;
  --bg: black;
  --head-bg: #333;
  --link: #aaf;

  --blue: #225;
  --red: #522;
  --yellow: #552;
  --green: #252;
}

html,
body {
  margin: 0;
  padding: 0;
  color: var(--color);
  background: var(--bg);
}

.app {
  margin: 10px;
  padding: 0;
}

.files-list {
  margin: 10px 0 0;
  width: 100%;
  border-collapse: collapse;
}
.files-list__head {
  border: 1px solid #999;
}
.files-list__head > tr > th {
  padding: 10px;
  border: 1px solid #999;
  text-align: left;
  font-weight: normal;
  background: var(--head-bg);
}
.files-list__body {
}
.files-list__file {
  cursor: pointer;
}
.files-list__file:hover {
  background: var(--blue);
}
.files-list__file > td {
  padding: 10px;
  border: 1px solid #999;
}
.files-list__file > td:first-child::before {
  content: '\01F4C4';
  margin-right: 1em;
}
.files-list__file_low {
  background: var(--red);
}
.files-list__file_medium {
  background: var(--yellow);
}
.files-list__file_high {
  background: var(--green);
}
.files-list__file_folder > td:first-child::before {
  content: '\01F4C1';
  margin-right: 1em;
}

.file-header {
  border: 1px solid #999;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  background: var(--bg);
}

.file-header__back {
  margin: 10px;
  cursor: pointer;
  flex-shrink: 0;
  flex-grow: 0;
  text-decoration: underline;
  color: var(--link);
}

.file-header__name {
  margin: 10px;
  flex-shrink: 2;
  flex-grow: 2;
}

.file-header__stat {
  margin: 10px;
  flex-shrink: 0;
  flex-grow: 0;
}

.file-content {
  margin: 10px 0 0;
  border: 1px solid #999;
  padding: 10px;
  counter-reset: line;
  display: flex;
  flex-direction: column;
}

.code-line::before {
  content: counter(line);
  margin-right: 72px;
}
.code-line {
  margin: 0;
  height: 1em;
  counter-increment: line;

  position: absolute;
  padding: 0 0.3em 0.3em 0.3em;
  display: inherit;
  width: 100%;
}
.code-line_covered {
  background: var(--green);
}
.code-line_uncovered {
  background: var(--red);
}

.code-text-container {
  position: relative;
  height: 1em;
  padding: 0.3em 0;
}

.cover-indicator {
  display: flex;
  width: 100%;
  position: absolute;
  justify-content: end;
  height: 1em;
  align-items: center;
  padding: 0 0.3em 0.3em 0.3em;
}

.cover-indicator.check-cover::after {
  content: "\2713";
  font-weight: bold;
  background-color: var(--green);
  height: 1em;
}

.cover-indicator.no-cover::after {
  content: "\2716";
  font-weight: bold;
  background-color: var(--red);
  height: 1em;
}

.stat-line-hit {
  max-width: 48px;
  overflow: hidden;
  font-weight: bold;
  margin-right: 4px;
  background-color: var(--green);
  position: relative;
  top: 0.1em;
}

#theme-toggle-label {
  margin-left: 1ch;
}
</style>
</head>

Ssh, GitProtocol::Https];\n}\n\nimpl fmt::Display for GitProtocol {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter\u003c'_\u003e) -\u003e fmt::Result {\n        match self {\n            GitProtocol::Ssh =\u003e write!(f, \"SSH\"),\n            GitProtocol::Https =\u003e write!(f, \"HTTPS\"),\n        }\n    }\n}\n\n/// Default git settings (host, organization, protocol).\n#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]\npub(crate) struct GitConfig {\n    /// The git host (e.g. \"github.com\" or a GitHub Enterprise host).\n    #[serde(default = \"default_git_host\")]\n    pub(crate) host: String,\n\n    /// The default organization on the host (e.g. \"my-org\").\n    #[serde(default)]\n    pub(crate) organization: String,\n\n    /// The protocol used to clone/push (SSH or HTTPS).\n    #[serde(default)]\n    pub(crate) protocol: GitProtocol,\n}\n\nfn default_git_host() -\u003e String {\n    \"github.com\".to_string()\n}\n\nimpl Default for GitConfig {\n    fn default() -\u003e Self {\n        Self {\n            host: default_git_host(),\n            organization: String::new(),\n            protocol: GitProtocol::default(),\n        }\n    }\n}\n\n#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]\npub(crate) struct BuonaConfig {\n    pub(crate) workspace_dir: String,\n\n    /// The user's preferred IDE.\n    #[serde(default)]\n    pub(crate) ide: Ide,\n\n    /// Default git settings.\n    #[serde(default)]\n    pub(crate) git: GitConfig,\n}\n\nimpl Default for BuonaConfig {\n    fn default() -\u003e Self {\n        Self {\n            workspace_dir: \"~/workspace\".to_string(),\n            ide: Ide::default(),\n            git: GitConfig::default(),\n        }\n    }\n}\n\n/// Expand a leading `~` to the user's home directory.\npub(crate) fn expand_tilde(path: \u0026str) -\u003e Result\u003cPathBuf\u003e {\n    if let Some(rest) = path.strip_prefix(\"~/\") {\n        let home = dirs::home_dir().context(\"could not determine home directory\")?;\n        Ok(home.join(rest))\n    } else if path == \"~\" {\n        dirs::home_dir().context(\"could not determine home directory\")\n    } else {\n        Ok(PathBuf::from(path))\n    }\n}\n\n/// Resolve the workspace directory from the config, expanding `~`.\npub(crate) fn workspace_dir() -\u003e Result\u003cPathBuf\u003e {\n    let cfg = load_config()?;\n    expand_tilde(\u0026cfg.workspace_dir)\n}\n\n/// Returns the buona config directory: ~/.config/buona/\npub(crate) fn config_dir() -\u003e Result\u003cPathBuf\u003e {\n    let dir = dirs::config_dir().context(\"could not determine config directory\")?;\n    Ok(dir.join(\"buona\"))\n}\n\n/// Returns the path to the config file: ~/.config/buona/config.json\npub(crate) fn config_file_path() -\u003e Result\u003cPathBuf\u003e {\n    Ok(config_dir()?.join(\"config.json\"))\n}\n\n/// Load the config from disk. If the file doesn't exist, returns the default config.\npub(crate) fn load_config() -\u003e Result\u003cBuonaConfig\u003e {\n    let path = config_file_path()?;\n    if path.exists() {\n        let contents = fs::read_to_string(\u0026path)\n            .with_context(|| format!(\"could not read config file: {}\", path.display()))?;\n        let config: BuonaConfig = serde_json::from_str(\u0026contents)\n            .with_context(|| format!(\"could not parse config file: {}\", path.display()))?;\n        Ok(config)\n    } else {\n        Ok(BuonaConfig::default())\n    }\n}\n\n/// Save the config to disk, creating parent directories if needed.\npub(crate) fn save_config(config: \u0026BuonaConfig) -\u003e Result\u003c()\u003e {\n    let path = config_file_path()?;\n    if let Some(parent) = path.parent() {\n        fs::create_dir_all(parent)\n            .with_context(|| format!(\"could not create config directory: {}\", parent.display()))?;\n    }\n    let json = serde_json::to_string_pretty(config)?;\n    fs::write(\u0026path, json + \"\\n\")\n        .with_context(|| format!(\"could not write config file: {}\", path.display()))?;\n    Ok(())\n}\n\n/// Pretty-print the current configuration to the terminal.\npub(crate) fn print_pretty(config: \u0026BuonaConfig) -\u003e Result\u003c()\u003e {\n    let s = Styles::default();\n\n    let path = config_file_path()?;\n    let file_exists = path.exists();\n\n    println!();\n    println!(\"  {}\", s.bold.apply_to(\"Buona Configuration\"));\n    println!(\"  {}\", s.dim.apply_to(\"───────────────────\"));\n    println!(\n        \"  {}  {}\",\n        s.cyan.apply_to(\"Workspace Directory:\"),\n        config.workspace_dir\n    );\n    println!(\n        \"  {}  {}\",\n        s.cyan.apply_to(\"IDE:\"),\n        config.ide\n    );\n    println!();\n    println!(\"  {}\", s.bold.apply_to(\"Git Defaults\"));\n    println!(\"  {}\", s.dim.apply_to(\"───────────────────\"));\n    println!(\n        \"  {}  {}\",\n        s.cyan.apply_to(\"Host:\"),\n        config.git.host\n    );\n    println!(\n        \"  {}  {}\",\n        s.cyan.apply_to(\"Organization:\"),\n        if config.git.organization.is_empty() {\n            \"(not set)\".to_string()\n        } else {\n            config.git.organization.clone()\n        }\n    );\n    println!(\n        \"  {}  {}\",\n        s.cyan.apply_to(\"Protocol:\"),\n        config.git.protocol\n    );\n    println!();\n\n    if !file_exists {\n        println!(\n            \"  {}\",\n            s.dim.apply_to(format!(\n                \"No config file found. Showing defaults. Run {} to create one.\",\n                s.bold.apply_to(\"buona config setup\")\n            ))\n        );\n        println!();\n    } else {\n        println!(\n            \"  {}\",\n            s.dim.apply_to(format!(\"Config file: {}\", path.display()))\n        );\n        println!();\n    }\n\n    Ok(())\n}\n\n/// Print the configuration as JSON.\npub(crate) fn print_json(config: \u0026BuonaConfig) -\u003e Result\u003c()\u003e {\n    let json = serde_json::to_string_pretty(config)?;\n    println!(\"{json}\");\n    Ok(())\n}\n\n/// Run the interactive setup wizard.\npub(crate) fn run_setup() -\u003e Result\u003c()\u003e {\n    let current = load_config()?;\n    let s = Styles::default();\n\n    println!();\n    println!(\"  {} Buona Configuration Setup\", s.bold.apply_to(\"🔧\"));\n    println!(\"  {}\", s.dim.apply_to(\"───────────────────────────\"));\n    println!();\n\n    let workspace_dir: String = Input::new()\n        .with_prompt(format!(\"  {}\", s.bold.apply_to(\"Workspace directory\")))\n        .default(current.workspace_dir)\n        .interact_text()\n        .context(\"failed to read input\")?;\n\n    let ide_options: Vec\u003cString\u003e = Ide::ALL.iter().map(|ide| ide.to_string()).collect();\n    let ide_default = Ide::ALL\n        .iter()\n        .position(|\u0026i| i == current.ide)\n        .unwrap_or(0);\n\n    let ide_index = Select::new()\n        .with_prompt(format!(\"  {}\", s.bold.apply_to(\"Preferred IDE\")))\n        .items(\u0026ide_options)\n        .default(ide_default)\n        .interact()\n        .context(\"failed to read input\")?;\n\n    let ide = Ide::ALL[ide_index];\n\n    println!();\n    println!(\"  {} Git Defaults\", s.bold.apply_to(\"🔗\"));\n    println!(\"  {}\", s.dim.apply_to(\"───────────────────────────\"));\n    println!();\n\n    let git_host: String = Input::new()\n        .with_prompt(format!(\"  {}\", s.bold.apply_to(\"Git host\")))\n        .default(current.git.host)\n        .interact_text()\n        .context(\"failed to read input\")?;\n\n    let git_org: String = Input::new()\n        .with_prompt(format!(\"  {}\", s.bold.apply_to(\"Default organization\")))\n        .default(current.git.organization)\n        .allow_empty(true)\n        .interact_text()\n        .context(\"failed to read input\")?;\n\n    let protocol_options: Vec\u003cString\u003e = GitProtocol::ALL\n        .iter()\n        .map(|p| p.to_string())\n        .collect();\n    let protocol_default = GitProtocol::ALL\n        .iter()\n        .position(|\u0026p| p == current.git.protocol)\n        .unwrap_or(0);\n\n    let protocol_index = Select::new()\n        .with_prompt(format!(\"  {}\", s.bold.apply_to(\"Git protocol\")))\n        .items(\u0026protocol_options)\n        .default(protocol_default)\n        .interact()\n        .context(\"failed to read input\")?;\n\n    let git_protocol = GitProtocol::ALL[protocol_index];\n\n    let config = BuonaConfig {\n        workspace_dir,\n        ide,\n        git: GitConfig {\n            host: git_host,\n            organization: git_org,\n            protocol: git_protocol,\n        },\n    };\n\n    save_config(\u0026config)?;\n\n    println!();\n    println!(\n        \"  {} Configuration saved to {}\",\n        s.green.apply_to(\"✔\"),\n        s.dim.apply_to(config_file_path()?.display().to_string())\n    );\n    println!();\n\n    Ok(())\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn expand_tilde_with_subpath() {\n        let result = expand_tilde(\"~/foo\").unwrap();\n        let home = dirs::home_dir().unwrap();\n        assert_eq!(result, home.join(\"foo\"));\n    }\n\n    #[test]\n    fn expand_tilde_bare() {\n        let result = expand_tilde(\"~\").unwrap();\n        let home = dirs::home_dir().unwrap();\n        assert_eq!(result, home);\n    }\n\n    #[test]\n    fn expand_tilde_absolute_path_unchanged() {\n        let result = expand_tilde(\"/usr/local/bin\").unwrap();\n        assert_eq!(result, PathBuf::from(\"/usr/local/bin\"));\n    }\n\n    #[test]\n    fn expand_tilde_relative_path_unchanged() {\n        let result = expand_tilde(\"some/relative/path\").unwrap();\n        assert_eq!(result, PathBuf::from(\"some/relative/path\"));\n    }\n\n    #[test]\n    fn default_config_round_trips_through_serde() {\n        let config = BuonaConfig::default();\n        let json = serde_json::to_string(\u0026config).unwrap();\n        let deserialized: BuonaConfig = serde_json::from_str(\u0026json).unwrap();\n        assert_eq!(deserialized.workspace_dir, config.workspace_dir);\n        assert_eq!(deserialized.ide, config.ide);\n        assert_eq!(deserialized.git, config.git);\n    }\n\n    #[test]\n    fn default_ide_is_vscode() {\n        assert_eq!(Ide::default(), Ide::Vscode);\n    }\n\n    #[test]\n    fn ide_display_vscode() {\n        assert_eq!(Ide::Vscode.to_string(), \"VS Code\");\n    }\n\n    #[test]\n    fn ide_display_cursor() {\n        assert_eq!(Ide::Cursor.to_string(), \"Cursor\");\n    }\n\n    #[test]\n    fn ide_serializes_to_lowercase() {\n        assert_eq!(serde_json::to_string(\u0026Ide::Vscode).unwrap(), \"\\\"vscode\\\"\");\n        assert_eq!(serde_json::to_string(\u0026Ide::Cursor).unwrap(), \"\\\"cursor\\\"\");\n    }\n\n    #[test]\n    fn ide_deserializes_from_lowercase() {\n        let vscode: Ide = serde_json::from_str(\"\\\"vscode\\\"\").unwrap();\n        assert_eq!(vscode, Ide::Vscode);\n\n        let cursor: Ide = serde_json::from_str(\"\\\"cursor\\\"\").unwrap();\n        assert_eq!(cursor, Ide::Cursor);\n    }\n\n    #[test]\n    fn config_without_ide_field_defaults_to_vscode() {\n        let json = r#\"{\"workspace_dir\": \"~/workspace\"}\"#;\n        let config: BuonaConfig = serde_json::from_str(json).unwrap();\n        assert_eq!(config.ide, Ide::Vscode);\n    }\n\n    #[test]\n    fn config_with_ide_cursor_round_trips() {\n        let config = BuonaConfig {\n            workspace_dir: \"~/work\".to_string(),\n            ide: Ide::Cursor,\n            git: GitConfig::default(),\n        };\n        let json = serde_json::to_string(\u0026config).unwrap();\n        let deserialized: BuonaConfig = serde_json::from_str(\u0026json).unwrap();\n        assert_eq!(deserialized.ide, Ide::Cursor);\n    }\n\n    // ── GitProtocol tests ──────────────────────────────────────────\n\n    #[test]\n    fn default_git_protocol_is_ssh() {\n        assert_eq!(GitProtocol::default(), GitProtocol::Ssh);\n    }\n\n    #[test]\n    fn git_protocol_display_ssh() {\n        assert_eq!(GitProtocol::Ssh.to_string(), \"SSH\");\n    }\n\n    #[test]\n    fn git_protocol_display_https() {\n        assert_eq!(GitProtocol::Https.to_string(), \"HTTPS\");\n    }\n\n    #[test]\n    fn git_protocol_serializes_to_lowercase() {\n        assert_eq!(\n            serde_json::to_string(\u0026GitProtocol::Ssh).unwrap(),\n            \"\\\"ssh\\\"\"\n        );\n        assert_eq!(\n            serde_json::to_string(\u0026GitProtocol::Https).unwrap(),\n            \"\\\"https\\\"\"\n        );\n    }\n\n    #[test]\n    fn git_protocol_deserializes_from_lowercase() {\n        let ssh: GitProtocol = serde_json::from_str(\"\\\"ssh\\\"\").unwrap();\n        assert_eq!(ssh, GitProtocol::Ssh);\n\n        let https: GitProtocol = serde_json::from_str(\"\\\"https\\\"\").unwrap();\n        assert_eq!(https, GitProtocol::Https);\n    }\n\n    // ── GitConfig tests ────────────────────────────────────────────\n\n    #[test]\n    fn default_git_config_has_github_host() {\n        let git = GitConfig::default();\n        assert_eq!(git.host, \"github.com\");\n        assert_eq!(git.organization, \"\");\n        assert_eq!(git.protocol, GitProtocol::Ssh);\n    }\n\n    #[test]\n    fn git_config_round_trips_through_serde() {\n        let git = GitConfig {\n            host: \"git.example.com\".to_string(),\n            organization: \"my-org\".to_string(),\n            protocol: GitProtocol::Https,\n        };\n        let json = serde_json::to_string(\u0026git).unwrap();\n        let deserialized: GitConfig = serde_json::from_str(\u0026json).unwrap();\n        assert_eq!(deserialized, git);\n    }\n\n    #[test]\n    fn config_without_git_field_gets_defaults() {\n        let json = r#\"{\"workspace_dir\": \"~/workspace\"}\"#;\n        let config: BuonaConfig = serde_json::from_str(json).unwrap();\n        assert_eq!(config.git, GitConfig::default());\n    }\n\n    #[test]\n    fn config_with_partial_git_gets_defaults_for_missing() {\n        let json = r#\"{\"workspace_dir\": \"~/workspace\", \"git\": {\"host\": \"git.corp.com\"}}\"#;\n        let config: BuonaConfig = serde_json::from_str(json).unwrap();\n        assert_eq!(config.git.host, \"git.corp.com\");\n        assert_eq!(config.git.organization, \"\");\n        assert_eq!(config.git.protocol, GitProtocol::Ssh);\n    }\n\n    // ── Ide::command tests ────────────────────────────────────────\n\n    #[test]\n    fn ide_command_vscode() {\n        assert_eq!(Ide::Vscode.command(), \"code\");\n    }\n\n    #[test]\n    fn ide_command_cursor() {\n        assert_eq!(Ide::Cursor.command(), \"cursor\");\n    }\n\n    #[test]\n    fn config_with_full_git_round_trips() {\n        let config = BuonaConfig {\n            workspace_dir: \"~/work\".to_string(),\n            ide: Ide::Cursor,\n            git: GitConfig {\n                host: \"github.example.com\".to_string(),\n                organization: \"engineering\".to_string(),\n                protocol: GitProtocol::Https,\n            },\n        };\n        let json = serde_json::to_string(\u0026config).unwrap();\n        let deserialized: BuonaConfig = serde_json::from_str(\u0026json).unwrap();\n        assert_eq!(deserialized.git.host, \"github.example.com\");\n        assert_eq!(deserialized.git.organization, \"engineering\");\n        assert_eq!(deserialized.git.protocol, GitProtocol::Https);\n    }\n}\n","traces":[{"line":34,"address":[],"length":0,"stats":{"Line":2}},{"line":35,"address":[],"length":0,"stats":{"Line":2}},{"line":36,"address":[],"length":0,"stats":{"Line":1}},{"line":37,"address":[],"length":0,"stats":{"Line":1}},{"line":38,"address":[],"length":0,"stats":{"Line":0}},{"line":44,"address":[],"length":0,"stats":{"Line":2}},{"line":45,"address":[],"length":0,"stats":{"Line":2}},{"line":46,"address":[],"length":0,"stats":{"Line":2}},{"line":47,"address":[],"length":0,"stats":{"Line":2}},{"line":48,"address":[],"length":0,"stats":{"Line":0}},{"line":70,"address":[],"length":0,"stats" g_required_else_help = true)]\n    Config {\n        #[command(subcommand)]\n        command: ConfigCommands,\n    },\n\n    /// Manage workspaces\n    #[command(alias = \"ws\", arg_required_else_help = true)]\n    Workspace {\n        #[command(subcommand)]\n        command: WorkspaceCommands,\n    },\n\n    /// Print the auto-detected build system for the current package\n    Detect,\n\n    /// Run a command within the current package's build system\n    Run {\n        /// Force a specific build system (overrides auto-detection)\n        #[arg(long)]\n        system: Option\u003cString\u003e,\n\n        /// Show the resolved command but don't execute it\n        #[arg(long)]\n        dry_run: bool,\n\n        /// Print detailed resolution information\n        #[arg(short, long)]\n        verbose: bool,\n\n        /// The command to run (e.g. build, test, lint)\n        command: String,\n\n        /// Additional arguments passed through to the underlying tool (after --)\n        #[arg(last = true)]\n        args: Vec\u003cString\u003e,\n    },\n}\n\n#[derive(Subcommand)]\nenum ConfigCommands {\n    /// Display the current configuration\n    Show {\n        /// Print config as JSON\n        #[arg(long)]\n        json: bool,\n    },\n\n    /// Launch interactive setup wizard\n    Setup,\n}\n\n#[derive(Subcommand)]\nenum WorkspaceCommands {\n    /// List all workspaces in the configured directory\n    List,\n\n    /// Create a new workspace\n    Create {\n        /// Path for the new workspace (relative to the configured workspace directory, or absolute)\n        path: String,\n\n        /// Optional display name for the workspace (defaults to the directory name)\n        #[arg(short, long)]\n        name: Option\u003cString\u003e,\n\n        /// Package specifier(s) to add after creation: name, org/name, or a full git URL\n        #[arg(short = 'p', long = \"package\")]\n        packages: Option\u003cVec\u003cString\u003e\u003e,\n\n        /// Open the workspace in the configured editor after creation\n        #[arg(long)]\n        open: bool,\n    },\n\n    /// Delete a workspace\n    Delete {\n        /// Name or directory of the workspace to delete\n        workspace: String,\n\n        /// Skip the confirmation prompt\n        #[arg(short, long)]\n        force: bool,\n    },\n\n    /// Add packages to a workspace\n    Add {\n        /// Package specifier(s): name, org/name, or a full git URL\n        #[arg(short = 'p', long = \"package\", required = true)]\n        packages: Vec\u003cString\u003e,\n\n        /// Workspace name or directory (defaults to detecting from the current directory)\n        #[arg(short, long)]\n        workspace: Option\u003cString\u003e,\n    },\n\n    /// Remove packages from a workspace\n    Remove {\n        /// Package name(s) to remove\n        #[arg(short = 'p', long = \"package\", required = true)]\n        packages: Vec\u003cString\u003e,\n\n        /// Workspace name or directory (defaults to detecting from the current directory)\n        #[arg(short, long)]\n        workspace: Option\u003cString\u003e,\n\n        /// Skip the confirmation prompt\n        #[arg(short, long)]\n        force: bool,\n    },\n\n    /// Pull latest changes for all packages and sync the workspace file\n    Sync {\n        /// Package name(s) to sync (defaults to all packages)\n        #[arg(short = 'p', long = \"package\")]\n        packages: Vec\u003cString\u003e,\n\n        /// Workspace name or directory (defaults to detecting from the current directory)\n        #[arg(short, long)]\n        workspace: Option\u003cString\u003e,\n\n        /// Only fetch (don't merge) — equivalent to git fetch instead of git pull\n        #[arg(short, long)]\n        fetch: bool,\n    },\n\n    /// Open workspace in the configured editor\n    Open {\n        /// Workspace name or directory (defaults to detecting from the current directory)\n        #[arg(short, long)]\n        workspace: Option\u003cString\u003e,\n    },\n\n    /// Show detailed information about a workspace\n    Info {\n        /// Workspace name or directory (defaults to detecting from the current directory)\n        #[arg(short, long)]\n        workspace: Option\u003cString\u003e,\n\n        /// Print info as JSON\n        #[arg(long)]\n        json: bool,\n    },\n\n    /// Adopt an existing local directory into the workspace\n    Adopt {\n        /// Path to the directory to adopt\n        path: String,\n\n        /// Workspace name or directory (defaults to detecting from the current directory)\n        #[arg(short, long)]\n        workspace: Option\u003cString\u003e,\n\n        /// Copy the directory instead of moving it\n        #[arg(long)]\n        copy: bool,\n\n        /// Override the package name (defaults to the directory name)\n        #[arg(short, long)]\n        name: Option\u003cString\u003e,\n    },\n}\n\nfn main() -\u003e anyhow::Result\u003c()\u003e {\n    let cli = Cli::parse();\n\n    match cli.command {\n        Commands::Config { command } =\u003e match command {\n            ConfigCommands::Show { json } =\u003e {\n                let cfg = config::load_config()?;\n                if json {\n                    config::print_json(\u0026cfg)?;\n                } else {\n                    config::print_pretty(\u0026cfg)?;\n                }\n            }\n            ConfigCommands::Setup =\u003e {\n                config::run_setup()?;\n            }\n        },\n        Commands::Workspace { command } =\u003e match command {\n            WorkspaceCommands::List =\u003e {\n                workspace::list()?;\n            }\n            WorkspaceCommands::Create { path, name, packages, open } =\u003e {\n                workspace::create(Path::new(\u0026path), name.as_deref(), packages.as_deref(), open)?;\n            }\n            WorkspaceCommands::Delete { workspace, force } =\u003e {\n                workspace::delete(\u0026workspace, force)?;\n            }\n            WorkspaceCommands::Add {\n                packages,\n                workspace,\n            } =\u003e {\n                workspace::add(\u0026packages, workspace.as_deref())?;\n            }\n            WorkspaceCommands::Remove {\n                packages,\n                workspace,\n                force,\n            } =\u003e {\n                workspace::remove_packages(\u0026packages, workspace.as_deref(), force)?;\n            }\n            WorkspaceCommands::Sync {\n                packages,\n                workspace,\n                fetch,\n            } =\u003e {\n                workspace::sync(\u0026packages, workspace.as_deref(), fetch)?;\n            }\n            WorkspaceCommands::Open { workspace } =\u003e {\n                workspace::open(workspace.as_deref())?;\n            }\n            WorkspaceCommands::Info { workspace, json } =\u003e {\n                workspace::info(workspace.as_deref(), json)?;\n            }\n            WorkspaceCommands::Adopt {\n                path,\n                workspace,\n                copy,\n                name,\n            } =\u003e {\n                workspace::adopt(Path::new(\u0026path), workspace.as_deref(), copy, name.as_deref())?;\n            }\n        },\n        Commands::Detect =\u003e {\n            if let Err(e) = run::detect() {\n                if let Some(run_err) = e.downcast_ref::\u003crun::RunError\u003e() {\n                    run_err.exit();\n                }\n                eprintln!(\"error: {e:?}\");\n                std::process::exit(1);\n            }\n        }\n        Commands::Run {\n            system,\n            dry_run,\n            verbose,\n            command,\n            args,\n        } =\u003e {\n            let options = run::RunOptions {\n                system,\n                dry_run,\n                verbose,\n                command,\n                args,\n            };\n            if let Err(e) = run::execute(options) {\n                if let Some(run_err) ll exec override: replaces the entire argv.\n    #[serde(default)]\n    pub(super) exec: Option\u003cVec\u003cString\u003e\u003e,\n}\n\n/// Per-package configuration loaded from `buona.json`.\n///\n/// Example:\n/// ```json\n/// {\n///   \"system\": \"cargo\",\n///   \"commands\": {\n///     \"build\": { \"system\": \"make\" },\n///     \"test\": { \"exec\": [\"pnpm\", \"run\", \"custom-test\"] }\n///   }\n/// }\n/// ```\n#[derive(Debug, Clone, Deserialize)]\npub(super) struct BuonaRunConfig {\n    /// Global build system for this package (\"auto\" or a system name).\n    /// Defaults to \"auto\" if omitted.\n    #[serde(default = \"default_system_str\")]\n    pub(super) system: String,\n\n    /// Per-command overrides.\n    #[serde(default)]\n    pub(super) commands: HashMap\u003cString, CommandConfig\u003e,\n\n    /// Directory to scan for convention-based hook scripts.\n    /// Relative paths are resolved from the package root.\n    #[serde(default = \"default_hooks_dir\", rename = \"hooksDir\")]\n    pub(super) hooks_dir: String,\n\n    /// Explicit hook definitions. Keys are `pre\u003ccommand\u003e` or `post\u003ccommand\u003e`.\n    /// Values are either a recognized system name or a literal shell command.\n    #[serde(default)]\n    pub(super) hooks: HashMap\u003cString, String\u003e,\n}\n\nfn default_system_str() -\u003e String {\n    \"auto\".to_string()\n}\n\nfn default_hooks_dir() -\u003e String {\n    \".buona/hooks\".to_string()\n}\n\n/// The filename for per-package configuration.\npub(super) const PACKAGE_CONFIG_FILE: \u0026str = \"buona.json\";\n\n/// Load per-package config from a directory.\n///\n/// Returns `Ok(None)` if `buona.json` does not exist.\n/// Returns `Err` if it exists but is malformed.\npub(super) fn load_package_config(dir: \u0026Path) -\u003e Result\u003cOption\u003cBuonaRunConfig\u003e\u003e {\n    let path = dir.join(PACKAGE_CONFIG_FILE);\n    match fs::read_to_string(\u0026path) {\n        Ok(contents) =\u003e {\n            let config: BuonaRunConfig = serde_json::from_str(\u0026contents)\n                .with_context(|| format!(\"invalid {} in {}\", PACKAGE_CONFIG_FILE, dir.display()))?;\n            Ok(Some(config))\n        }\n        Err(e) if e.kind() == std::io::ErrorKind::NotFound =\u003e Ok(None),\n        Err(e) =\u003e Err(e).with_context(|| {\n            format!(\n                \"could not read {} in {}\",\n                PACKAGE_CONFIG_FILE,\n                dir.display()\n            )\n        }),\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use tempfile::TempDir;\n\n    #[test]\n    fn load_missing_config_returns_none() {\n        let dir = TempDir::new().unwrap();\n        let result = load_package_config(dir.path()).unwrap();\n        assert!(result.is_none());\n    }\n\n    #[test]\n    fn load_valid_config_with_system() {\n        let dir = TempDir::new().unwrap();\n        fs::write(\n            dir.path().join(PACKAGE_CONFIG_FILE),\n            r#\"{ \"system\": \"cargo\" }\"#,\n        )\n        .unwrap();\n\n        let config = load_package_config(dir.path()).unwrap().unwrap();\n        assert_eq!(config.system, \"cargo\");\n        assert!(config.commands.is_empty());\n    }\n\n    #[test]\n    fn load_valid_config_with_commands() {\n        let dir = TempDir::new().unwrap();\n        fs::write(\n            dir.path().join(PACKAGE_CONFIG_FILE),\n            r#\"{\n                \"system\": \"auto\",\n                \"commands\": {\n                    \"build\": { \"system\": \"make\" },\n                    \"test\": { \"exec\": [\"pnpm\", \"run\", \"custom-test\"] }\n                }\n            }\"#,\n        )\n        .unwrap();\n\n        let config = load_package_config(dir.path()).unwrap().unwrap();\n        assert_eq!(config.system, \"auto\");\n        assert_eq!(config.commands.len(), 2);\n\n        let build = \u0026config.commands[\"build\"];\n        assert_eq!(build.system, Some(BuildSystem::Make));\n        assert!(build.exec.is_none());\n\n        let test = \u0026config.commands[\"test\"];\n        assert!(test.system.is_none());\n        assert_eq!(\n            test.exec.as_ref().unwrap(),\n            \u0026[\"pnpm\", \"run\", \"custom-test\"]\n        );\n    }\n\n    #[test]\n    fn load_defaults_system_to_auto() {\n        let dir = TempDir::new().unwrap();\n        fs::write(dir.path().join(PACKAGE_CONFIG_FILE), r#\"{}\"#).unwrap();\n\n        let config = load_package_config(dir.path()).unwrap().unwrap();\n        assert_eq!(config.system, \"auto\");\n    }\n\n    #[test]\n    fn load_defaults_hooks_dir() {\n        let dir = TempDir::new().unwrap();\n        fs::write(dir.path().join(PACKAGE_CONFIG_FILE), r#\"{}\"#).unwrap();\n\n        let config = load_package_config(dir.path()).unwrap().unwrap();\n        assert_eq!(config.hooks_dir, \".buona/hooks\");\n        assert!(config.hooks.is_empty());\n    }\n\n    #[test]\n    fn load_config_with_hooks_dir() {\n        let dir = TempDir::new().unwrap();\n        fs::write(\n            dir.path().join(PACKAGE_CONFIG_FILE),\n            r#\"{ \"hooksDir\": \".custom/hooks\" }\"#,\n        )\n        .unwrap();\n\n        let config = load_package_config(dir.path()).unwrap().unwrap();\n        assert_eq!(config.hooks_dir, \".custom/hooks\");\n    }\n\n    #[test]\n    fn load_config_with_hooks() {\n        let dir = TempDir::new().unwrap();\n        fs::write(\n            dir.path().join(PACKAGE_CONFIG_FILE),\n            r#\"{\n                \"hooks\": {\n                    \"prebuild\": \"./scripts/gen.sh\",\n                    \"posttest\": \"docker compose down\"\n                }\n            }\"#,\n        )\n        .unwrap();\n\n        let config = load_package_config(dir.path()).unwrap().unwrap();\n        assert_eq!(config.hooks.len(), 2);\n        assert_eq!(config.hooks[\"prebuild\"], \"./scripts/gen.sh\");\n        assert_eq!(config.hooks[\"posttest\"], \"docker compose down\");\n    }\n\n    #[test]\n    fn existing_config_still_deserializes_with_new_fields() {\n        let dir = TempDir::new().unwrap();\n        fs::write(\n            dir.path().join(PACKAGE_CONFIG_FILE),\n            r#\"{ \"system\": \"cargo\", \"commands\": { \"build\": { \"system\": \"make\" } } }\"#,\n        )\n        .unwrap();\n\n        let config = load_package_config(dir.path()).unwrap().unwrap();\n        assert_eq!(config.system, \"cargo\");\n        assert_eq!(config.hooks_dir, \".buona/hooks\");\n        assert!(config.hooks.is_empty());\n    }\n\n    #[test]\n    fn load_malformed_config_returns_error() {\n        let dir = TempDir::new().unwrap();\n        fs::write(\n            dir.path().join(PACKAGE_CONFIG_FILE),\n            \"not valid json {{{\",\n        )\n        .unwrap();\n\n        let result = load_package_config(dir.path());\n        assert!(result.is_err());\n    }\n}\n","traces":[{"line":62,"address":[],"length":0,"stats":{"Line":4}},{"line":63,"address":[],"length":0,"stats":{"Line":8}},{"line":66,"address":[],"length":0,"stats":{"Line":6}},{"line":67,"address":[],"length":0,"stats":{"Line":12}},{"line":77,"address":[],"length":0,"stats":{"Line":9}},{"line":78,"address":[],"length":0,"stats":{"Line":27}},{"line":79,"address":[],"length":0,"stats":{"Line":18}},{"line":80,"address":[],"length":0,"stats":{"Line":8}},{"line":81,"address":[],"length":0,"stats":{"Line":30}},{"line":82,"address":[],"length":0,"stats":{"Line":12}},{"line":83,"address":[],"length":0,"stats":{"Line":7}},{"line":85,"address":[],"length":0,"stats":{"Line":4}},{"line":86,"address":[],"length":0,"stats":{"Line":0}},{"line":87,"address":[],"length":0,"stats":{"Line":0}},{"line":90,"address":[],"length":0,"stats":{"Line":0}}],"covered":12,"coverable":15},{"path":["/","Users","lpshanley","workplace","buona","src","buona","src","run","detect.rs"],"content":"//! Build system auto-detection by scanning for marker files.\n\nuse std::fs;\nuse std::path::Path;\n\nuse super::systems::{marker_files, refine_python_system};\nuse super::types::BuildSystem;\n\n/// A detected build system with the marker file that triggered it.\n#[derive(Debug, Clone, PartialEq, Eq)]\npub(crate) struct Detection {\n    pub(crate) system: BuildSystem,\n    pub(crate) marker: String,\n}\n\n/// Auto-detect the build system by scanning for marker files in the given directory.\n///\n/// Returns `None` if no known marker file is found. Marker files are checked in\n/// priority order (see [`marker_files()`]).\npub(super) fn detect_build_system(dir: \u0026Path) -\u003e Option\u003cBuildSystem\u003e {\n    for \u0026(marker, system) in marker_files() {\n        if dir.join(marker).exists() {\n            // pyproject.toml could be uv or poetry — refine by inspecting content\n            if marker == \"pyproject.toml\" {\n                if let Ok(content) = fs::read_to_string(dir.join(marker)) {\n                    return Some(refine_python_system(\u0026content));\n                }\n            }\n            return Some(system);\n        }\n    }\n    None\n}\n\n/// Scan for all matching marker files, returning every detection in priority order.\n///\n/// The first entry in the returned vec is the winner. Subsequent entries are\n/// lower-priority matches. Returns an empty vec if nothing is found.\npub(crate) fn detect_all_systems(dir: \u0026Path) -\u003e Vec\u003cDetection\u003e {\n    let mut results = Vec::new();\n    for \u0026(marker, system) in marker_files() {\n        if dir.join(marker).exists() {\n            let resolved = if marker == \"pyproject.toml\" {\n                if let Ok(content) = fs::read_to_string(dir.join(marker)) {\n                    refine_python_system(\u0026content)\n                } else {\n                    system\n                }\n            } else {\n                system\n            };\n            results.push(Detection {\n                system: resolved,\n                marker: marker.to_string(),\n            });\n        }\n    }\n    results\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use tempfile::TempDir;\n\n    #[test]\n    fn detects_cargo() {\n        let dir = TempDir::new().unwrap();\n        fs::write(dir.path().join(\"Cargo.toml\"), \"[package]\").unwrap();\n\n        assert_eq!(detect_build_system(dir.path()), Some(BuildSystem::Cargo));\n    }\n\n    #[test]\n    fn detects_go() {\n        let dir = TempDir::new().unwrap();\n        fs::write(dir.path().join(\"go.mod\"), \"module example\").unwrap();\n\n        assert_eq!(detect_build_system(dir.path()), Some(BuildSystem::Go));\n    }\n\n    #[test]\n    fn detects_npm_from_package_lock() {\n        let dir = TempDir::new().unwrap();\n        fs::write(dir.path().join(\"package.json\"), \"{}\").unwrap();\n        fs::write(dir.path().join(\"package-lock.json\"), \"{}\").unwrap();\n\n        assert_eq!(detect_build_system(dir.path()), Some(BuildSystem::Npm));\n    }\n\n    #[test]\n    fn detects_pnpm_over_npm() {\n        let dir = TempDir::new().unwrap();\n        fs::write(dir.path().join(\"package.json\"), \"{}\").unwrap();\n        fs::write(dir.path().join(\"pnpm-lock.yaml\"), \"\").unwrap();\n\n        // pnpm-lock.yaml has higher priority than package.json\n        assert_eq!(detect_build_system(dir.path()), Some(BuildSystem::Pnpm));\n    }\n\n    #[test]\n    fn detects_bun_from_lockfile() {\n        let dir = TempDir::new().unwrap();\n        fs::write(dir.path().join(\"package.json\"), \"{}\").unwrap();\n        fs::write(dir.path().join(\"bun.lock\"), \"\").unwrap();\n\n        assert_eq!(detect_build_system(dir.path()), Some(BuildSystem::Bun));\n    }\n\n    #[test]\n    fn detects_yarn_from_lockfile() {\n        let dir = TempDir::new().unwrap();\n        fs::write(dir.path().join(\"package.json\"), \"{}\").unwrap();\n        fs::write(dir.path().join(\"yarn.lock\"), \"\").unwrap();\n\n        assert_eq!(detect_build_system(dir.path()), Some(BuildSystem::Yarn));\n    }\n\n    #[test]\n    fn detects_npm_from_package_json_alone() {\n        let dir = TempDir::new().unwrap();\n        fs::write(dir.path().join(\"package.json\"), \"{}\").unwrap();\n\n        assert_eq!(detect_build_system(dir.path()), Some(BuildSystem::Npm));\n    }\n\n    #[test]\n    fn detects_uv_from_pyproject() {\n        let dir = TempDir::new().unwrap();\n        fs::write(\n            dir.path().join(\"pyproject.toml\"),\n            \"[project]\\nname = \\\"my-project\\\"\\n\",\n        )\n        .unwrap();\n\n        assert_eq!(detect_build_system(dir.path()), Some(BuildSystem::Uv));\n    }\n\n    #[test]\n    fn detects_poetry_from_pyproject() {\n        let dir = TempDir::new().unwrap();\n        fs::write(\n            dir.path().join(\"pyproject.toml\"),\n            \"[tool.poetry]\\nname = \\\"my-project\\\"\\n\",\n        )\n        .unwrap();\n\n        assert_eq!(detect_build_system(dir.path()), Some(BuildSystem::Poetry));\n    }\n\n    #[test]\n    fn detects_make() {\n        let dir = TempDir::new().unwrap();\n        fs::write(dir.path().join(\"Makefile\"), \"all:\\n\\techo hi\").unwrap();\n\n        assert_eq!(detect_build_system(dir.path()), Some(BuildSystem::Make));\n    }\n\n    #[test]\n    fn detects_gradle_from_build_gradle() {\n        let dir = TempDir::new().unwrap();\n        fs::write(dir.path().join(\"build.gradle\"), \"plugins {}\").unwrap();\n\n        assert_eq!(detect_build_system(dir.path()), Some(BuildSystem::Gradle));\n    }\n\n    #[test]\n    fn detects_gradle_from_build_gradle_kts() {\n        let dir = TempDir::new().unwrap();\n        fs::write(dir.path().join(\"build.gradle.kts\"), \"plugins {}\").unwrap();\n\n        assert_eq!(detect_build_system(dir.path()), Some(BuildSystem::Gradle));\n    }\n\n    #[test]\n    fn detects_maven_from_pom_xml() {\n        let dir = TempDir::new().unwrap();\n        fs::write(dir.path().join(\"pom.xml\"), \"\u003cproject\u003e\u003c/project\u003e\").unwrap();\n\n        assert_eq!(detect_build_system(dir.path()), Some(BuildSystem::Maven));\n    }\n\n    #[test]\n    fn returns_none_for_empty_dir() {\n        let dir = TempDir::new().unwrap();\n        assert_eq!(detect_build_system(dir.path()), None);\n    }\n\n    #[test]\n    fn cargo_takes_priority_over_makefile() {\n        let dir = TempDir::new().unwrap();\n        fs::write(dir.path().join(\"Cargo.toml\"), \"[package]\").unwrap();\n        fs::write(dir.path().join(\"Makefile\"), \"all:\").unwrap();\n\n        assert_eq!(detect_build_system(dir.path()), Some(BuildSystem::Cargo));\n    }\n\n    // ── detect_all_systems tests ───────────────────────────────\n\n    #[test]\n    fn detect_all_empty_dir() {\n        let dir = TempDir::new().unwrap();\n        assert!(detect_all_systems(dir.path()).is_empty());\n    }\n\n    #[test]\n    fn detect_all_single_system() {\n        let dir = TempDir::new().unwrap();\n        fs::write(dir.path().join(\"Cargo.toml\"), \"[package]\").unwrap();\n\n        let results = detect_all_systems(dir.path());\n        assert_eq!(results.len(), 1);\n        assert_eq!(results[0].system, BuildSystem::Cargo);\n        assert_eq!(results[0].marker, \"Cargo.toml\");\n    }\n\n    #[test]\n    fn detect_all_cargo_and_makefile() {\n        let dir = TempDir::new().unwrap();\n        fs::write(dir.path().join(\"Cargo.toml\"), \"[package]\").unwrap();\n        fs::write(dir.path().join(\"Makefile\"), \"all:\").unwrap();\n\n        let results = detect_all_systems(dir.path());\n        assert_eq!(results.len(), 2);\n        // Cargo has higher priority\n        assert_eq!(results[0].system, BuildSystem::Cargo);\n        assert_eq!(results[1].system, BuildSystem::Make);\n    }\n\n    #[test]\n    fn detect_all_pnpm_also_finds_package_json() {\n        let dir = TempDir::new().unwrap();\n        fs::write(dir.path().join(\"package.json\"), \"{}\").unwrap();\n        fs::write(dir.path().join(\"pnpm-lock.yaml\"), \"\").unwrap();\n\n        let results = detect_all_systems(dir.path());\n        // Should find pnpm-lock.yaml (Pnpm) and package.json (Npm)\n        assert!(results.len() \u003e= 2);\n        assert_eq!(results[0].system, BuildSystem::Pnpm);\n        // package.json also appears as a lower-priority Npm detection\n        assert!(results.iter().any(|d| d.system == BuildSystem::Npm));\n    }\n\n    #[test]\n    fn detect_all_preserves_priority_order() {\n        let dir = TempDir::new().unwrap();\n        fs::write(dir.path().join(\"go.mod\"), \"module example\").unwrap();\n        fs::write(dir.path().join(\"Makefile\"), \"all:\").unwrap();\n\n        let results = detect_all_systems(dir.path());\n        assert_eq!(results.len(), 2);\n        // go.mod has higher priority than Makefile\n        assert_eq!(results[0].system, BuildSystem::Go);\n        assert_eq!(results[1].system, BuildSystem::Make);\n    }\n\n    #[test]\n    fn detect_all_refines_pyproject_to_poetry() {\n        let dir = TempDir::new().unwrap();\n        fs::write(\n            dir.path().join(\"pyproject.toml\"),\n            \"[tool.poetry]\\nname = \\\"my-project\\\"\\n\",\n        )\n        .unwrap();\n\n        let results = detect_all_systems(dir.path());\n        assert_eq!(results.len(), 1);\n        assert_eq!(results[0].system, BuildSystem::Poetry);\n        assert_eq!(results[0].marker, \"pyproject.toml\");\n    }\n}\n","traces":[{"line":20,"address":[],"length":0,"stats":{"Line":22}},{"line":21,"address":[],"length":0,"stats":{"Line":314}},{"line":22,"address":[],"length":0,"stats":{"Line":292}},{"line":24,"address":[],"length":0,"stats":{"Line":20}},{"line":25,"address":[],"length":0,"stats":{"Line":8}},{"line":26,"address":[],"length":0,"stats":{"Line":2}},{"line":29,"address":[],"length":0,"stats":{"Line":18}},{"line":32,"address":[],"length":0,"stats":{"Line":2}},{"line":39,"address":[],"length":0,"stats":{"Line":6}},{"line":40,"address":[],"length":0,"stats":{"Line":12}},{"line":41,"address":[],"length":0,"stats":{"Line":162}},{"line":42,"address":[],"length":0,"stats":{"Line":156}},{"line":43,"address":[],"length":0,"stats":{"Line":16}},{"line":44,"address":[],"length":0,"stats":{"Line":4}},{"line":45,"address":[],"length":0,"stats":{"Line":2}},{"line":47,"address":[],"length":0,"stats":{"Line":0}},{"line":50,"address":[],"length":0,"stats":{"Line":7}},{"line":52,"address":[],"length":0,"stats":{"Line":24}},{"line":53,"address":[],"length":0,"stats":{"Line":16}},{"line":54,"address":[],"length":0,"stats":{"Line":8}},{"line":58,"address":[],"length":0,"stats":{"Line":6}}],"covered":20,"coverable":21},{"path":["/","Users","lpshanley","workplace","buona","src","buona","src","run","error.rs"],"content":"//! Structured errors for the `buona run` command with specific exit codes.\n\nuse std::fmt;\nuse std::process;\n\n/// Structured errors for the run command.\n///\n/// Each variant has a specific exit code to allow scripting and CI integration.\n#[derive(Debug)]\npub(crate) enum RunError {\n    /// Not inside a buona workspace (exit 64).\n    NotInWorkspace(String),\n    /// Could not determine which package the user is in (exit 65).\n    NoPackageResolved(String),\n    /// Unknown build system name (exit 66).\n    UnknownSystem(String),\n    /// Standard command has no mapping for this system (exit 67).\n    StandardNotMapped { command: String, system: String },\n    /// buona.json is malformed or has conflicting settings (exit 68).\n    ConfigError(String),\n    /// Ambiguous hook: multiple files in hooksDir match the same hook name (exit 69).\n    AmbiguousHook {\n        hook_name: String,\n        candidates: Vec\u003cString\u003e,\n    },\n    /// A hook process failed. Exit code is forwarded from the child process.\n    #[allow(dead_code)]\n    HookFailed { hook_name: String, exit_code: i32 },\n}\n\nimpl RunError {\n    /// Returns the exit code for this error.\n    pub(crate) fn exit_code(\u0026self) -\u003e i32 {\n        match self {\n            RunError::NotInWorkspace(_) =\u003e 64,\n            RunError::NoPackageResolved(_) =\u003e 65,\n            RunError::UnknownSystem(_) =\u003e 66,\n            RunError::StandardNotMapped { .. } =\u003e 67,\n            RunError::ConfigError(_) =\u003e 68,\n            RunError::AmbiguousHook { .. } =\u003e 69,\n            RunError::HookFailed { exit_code, .. } =\u003e *exit_code,\n        }\n    }\n\n    /// Print the error to stderr and exit with the appropriate code.\n    pub(crate) fn exit(\u0026self) -\u003e ! {\n        eprintln!(\"error: {self}\");\n        process::exit(self.exit_code());\n    }\n}\n\nimpl fmt::Display for RunError {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter\u003c'_\u003e) -\u003e fmt::Result {\n        match self {\n            RunError::NotInWorkspace(msg) =\u003e write!(f, \"{msg}\"),\n            RunError::NoPackageResolved(msg) =\u003e write!(f, \"{msg}\"),\n            RunError::UnknownSystem(name) =\u003e write!(f, \"unknown build system: \\\"{name}\\\"\"),\n            RunError::StandardNotMapped { command, system } =\u003e {\n                write!(\n                    f,\n                    \"command \\\"{command}\\\" has no mapping for system \\\"{system}\\\"\"\n                )\n            }\n            RunError::ConfigError(msg) =\u003e write!(f, \"config error: {msg}\"),\n            RunError::AmbiguousHook {\n                hook_name,\n                candidates,\n            } =\u003e {\n                write!(\n                    f,\n                    \"ambiguous hook \\\"{hook_name}\\\": multiple files match in hooks directory: {}\",\n                    candidates.join(\", \")\n                )\n            }\n            RunError::HookFailed {\n                hook_name,\n                exit_code,\n            } =\u003e {\n                write!(f, \"hook \\\"{hook_name}\\\" failed with exit code {exit_code}\")\n            }\n        }\n    }\n}\n\nimpl std::error::Error for RunError {}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn exit_codes_are_correct() {\n        assert_eq!(RunError::NotInWorkspace(String::new()).exit_code(), 64);\n        assert_eq!(RunError::NoPackageResolved(String::new()).exit_code(), 65);\n        assert_eq!(RunError::UnknownSystem(String::new()).exit_code(), 66);\n        assert_eq!(\n            RunError::StandardNotMapped {\n                command: String::new(),\n                system: String::new()\n            }\n            .exit_code(),\n            67\n        );\n        assert_eq!(RunError::ConfigError(String::new()).exit_code(), 68);\n    }\n\n    #[test]\n    fn display_unknown_system() {\n        let err = RunError::UnknownSystem(\"foobar\".to_string());\n        assert_eq!(err.to_string(), \"unknown build system: \\\"foobar\\\"\");\n    }\n\n    #[test]\n    fn display_standard_not_mapped() {\n        let err = RunError::StandardNotMapped {\n            command: \"bench\".to_string(),\n            system: \"make\".to_string(),\n        };\n        assert_eq!(\n            err.to_string(),\n            \"command \\\"bench\\\" has no mapping for system \\\"make\\\"\"\n        );\n    }\n\n    #[test]\n    fn display_config_error() {\n        let err = RunError::ConfigError(\"missing field\".to_string());\n        assert_eq!(err.to_string(), \"config error: missing field\");\n    }\n\n    #[test]\n    fn exit_code_ambiguous_hook() {\n        assert_eq!(\n            RunError::AmbiguousHook {\n                hook_name: String::new(),\n                candidates: vec![],\n            }\n            .exit_code(),\n            69\n        );\n    }\n\n    #[test]\n    fn exit_code_hook_failed_forwards_child_code() {\n        assert_eq!(\n            RunError::HookFailed {\n                hook_name: String::new(),\n                exit_code: 42,\n            }\n            .exit_code(),\n            42\n        );\n    }\n\n    #[test]\n    fn display_ambiguous_hook() {\n        let err = RunError::AmbiguousHook {\n            hook_name: \"prebuild\".to_string(),\n            candidates: vec![\"prebuild.sh\".to_string(), \"prebuild.py\".to_string()],\n        };\n        assert!(err.to_string().contains(\"ambiguous\"));\n        assert!(err.to_string().contains(\"prebuild.sh, prebuild.py\"));\n    }\n\n    #[test]\n    fn display_hook_failed() {\n        let err = RunError::HookFailed {\n            hook_name: \"prebuild\".to_string(),\n            exit_code: 1,\n        };\n        assert_eq!(\n            err.to_string(),\n            \"hook \\\"prebuild\\\" failed with exit code 1\"\n        );\n    }\n}\n","traces":[{"line":33,"address":[],"length":0,"stats":{"Line":7}},{"line":34,"address":[],"length":0,"stats":{"Line":7}},{"line":35,"address":[],"length":0,"stats":{"Line":1}},{"line":36,"address":[],"length":0,"stats":{"Line":1}},{"line":37,"address":[],"length":0,"stats":{"Line":1}},{"line":38,"address":[],"length":0,"stats":{"Line":1}},{"line":39,"address":[],"length":0,"stats":{"Line":1}},{"line":40,"address":[],"length":0,"stats":{"Line":1}},{"line":41,"address":[],"length":0,"stats":{"Line":2}},{"line":46,"address":[],"length":0,"stats":{"Line":0}},{"line":47,"address":[],"length":0,"stats":{"Line":0}},{"line":48,"address":[],"length":0,"stats":{"Line":0}},{"line":53,"address":[],"length":0,"stats":{"Line":6}},{"line":54,"address":[],"length":0,"stats":{"Line":6}},{"line":55,"address":[],"length":0,"stats":{"Line":0}},{"line":56,"address":[],"length":0,"stats":{"Line":0}},{"line":57,"address":[],"length":0,"stats":{"Line":3}},{"line":58,"address":[],"length":0,"stats":{"Line":2}},{"line":59,"address":[],"length":0,"stats":{"Line":1}},{"line":60,"address":[],"length":0,"stats":{"Line":1}},{"line":64,"address":[],"length":0,"stats":{"Line":3}},{"line":66,"address":[],"length":0,"stats":{"Line":2}},{"line":67,"address":[],"length":0,"stats":{"Line":2}},{"line":69,"address":[],"length":0,"stats":{"Line":2}},{"line":70,"address":[],"length":0,"stats":{"Line":2}},{"line":72,"address":[],"length":0,"stats":{"Line":4}},{"line":76,"address":[],"length":0,"stats":{"Line":1}},{"line":77,"address":[],"length":0,"stats":{"Line":1}},{"line":79,"address":[],"length":0,"stats":{"Line":2}}],"covered":24,"coverable":29},{"path":["/","Users","lpshanley","workplace","buona","src","buona","src","run","hooks.rs"],"content":"//! Hook resolution for the `buona run` command.\n//!\n//! Hooks are `pre\u003ccommand\u003e` and `post\u003ccommand\u003e` scripts that run around a\n//! standard command. They are resolved from two sources in priority order:\n//!\n//! 1. Explicit `hooks` map in `buona.json` (highest priority)\n//! 2. Convention-based files discovered in `hooksDir`\n//!\n//! The resolution logic is split into a pure layer (testable without I/O) and\n//! a filesystem layer (for scanning the hooks directory).\n\nuse std::collections::HashMap;\nuse std::path::{Path, PathBuf};\n\nuse super::error::RunError;\nuse super::systems::{proxy_command, standard_mapping};\nuse super::types::*;\n\n// ── Filesystem layer ────────────────────────────────────────────────\n\n/// A hook file discovered in the hooks directory.\n#[derive(Debug, Clone, PartialEq, Eq)]\npub(super) struct HookFile {\n    /// The hook name (filename stem, without extension), e.g. \"prebuild\".\n    pub(super) name: String,\n    /// Full path to the file.\n    pub(super) path: PathBuf,\n    /// Whether the file has the executable permission bit set.\n    pub(super) executable: bool,\n}\n\n/// Check if a file has any executable permission bit set.\n#[cfg(unix)]\nfn is_file_executable(path: \u0026Path) -\u003e bool {\n    use std::os::unix::fs::PermissionsExt;\n    if let Ok(metadata) = std::fs::metadata(path) {\n        metadata.permissions().mode() \u0026 0o111 != 0\n    } else {\n        false\n    }\n}\n\n#[cfg(not(unix))]\nfn is_file_executable(_path: \u0026Path) -\u003e bool {\n    true\n}\n\n/// Scan `hooks_dir` for files that could be hook scripts.\n///\n/// Returns all discovered hook files. The caller is responsible for filtering\n/// by name and checking for ambiguity. Returns an empty vec if the directory\n/// does not exist.\npub(super) fn scan_hooks_dir(hooks_dir: \u0026Path) -\u003e Vec\u003cHookFile\u003e {\n    let entries = match std::fs::read_dir(hooks_dir) {\n        Ok(entries) =\u003e entries,\n        Err(_) =\u003e return Vec::new(),\n    };\n\n    let mut results = Vec::new();\n    for entry in entries.flatten() {\n        let path = entry.path();\n        if !path.is_file() {\n            continue;\n        }\n        let stem = match path.file_stem() {\n            Some(s) =\u003e s.to_string_lossy().to_string(),\n            None =\u003e continue,\n        };\n        let executable = is_file_executable(\u0026path);\n        results.push(HookFile {\n            name: stem,\n            path,\n            executable,\n        });\n    }\n    results\n}\n\n// ── Pure resolution layer ───────────────────────────────────────────\n\n/// Inputs for hook resolution.\npub(super) struct HookResolveInput {\n    /// The standard command name (e.g. \"build\", \"test\").\n    pub(super) command: String,\n    /// The package directory (cwd for hook execution).\n    pub(super) package_dir: PathBuf,\n    /// Explicit hooks from `buona.json` (if present).\n    pub(super) explicit_hooks: HashMap\u003cString, String\u003e,\n    /// Hook files discovered from `hooksDir` scanning.\n    pub(super) convention_hooks: Vec\u003cHookFile\u003e,\n}\n\n/// A warning produced during hook resolution (e.g. non-executable file).\n#[derive(Debug, Clone)]\npub(super) struct HookWarning {\n    pub(super) hook_name: String,\n    pub(super) message: String,\n}\n\n/// Result of hook resolution: resolved hooks plus any warnings.\n#[derive(Debug)]\npub(super) struct HookResolution {\n    pub(super) pre_hook: Option\u003cResolvedHook\u003e,\n    pub(super) post_hook: Option\u003cResolvedHook\u003e,\n    pub(super) warnings: Vec\u003cHookWarning\u003e,\n}\n\n/// Resolve hooks for a given command.\n///\n/// This is the main entry point. It resolves pre and post hooks independently,\n/// collecting any warnings along the way.\npub(super) fn resolve_hooks(input: \u0026HookResolveInput) -\u003e Result\u003cHookResolution, RunError\u003e {\n    let pre_name = format!(\"pre{}\", input.command);\n    let post_name = format!(\"post{}\", input.command);\n\n    let mut warnings = Vec::new();\n\n    let pre_hook = resolve_single_hook(\n        \u0026pre_name,\n        HookPhase::Pre,\n        \u0026input.package_dir,\n        \u0026input.explicit_hooks,\n        \u0026input.convention_hooks,\n        \u0026mut warnings,\n    )?;\n\n    let post_hook = resolve_single_hook(\n        \u0026post_name,\n        HookPhase::Post,\n        \u0026input.package_dir,\n        \u0026input.explicit_hooks,\n        \u0026input.convention_hooks,\n        \u0026mut warnings,\n    )?;\n\n    Ok(HookResolution {\n        pre_hook,\n        post_hook,\n        warnings,\n    })\n}\n\nfn resolve_single_hook(\n    hook_name: \u0026str,\n    phase: HookPhase,\n    package_dir: \u0026Path,\n    explicit_hooks: \u0026HashMap\u003cString, String\u003e,\n    convention_hooks: \u0026[HookFile],\n    warnings: \u0026mut Vec\u003cHookWarning\u003e,\n) -\u003e Result\u003cOption\u003cResolvedHook\u003e, RunError\u003e {\n    // 1. Check explicit hooks map (highest priority)\n    if let Some(value) = explicit_hooks.get(hook_name) {\n        return Ok(Some(resolve_hook_value(\n            hook_name,\n            phase,\n            value,\n            package_dir,\n            HookSource::Explicit,\n        )));\n    }\n\n    // 2. Check convention-based hooks\n    let matches: Vec\u003c\u0026HookFile\u003e = convention_hooks\n        .iter()\n        .filter(|f| f.name == hook_name)\n        .collect();\n\n    match matches.len() {\n        0 =\u003e Ok(None),\n        1 =\u003e {\n            let hook_file = \u0026matches[0];\n            if !hook_file.executable {\n                warnings.push(HookWarning {\n                    hook_name: hook_name.to_string(),\n                    message: format!(\n                        \"file {} is not executable, skipping\",\n                        hook_file.path.display()\n                    ),\n                });\n                return Ok(None);\n            }\n            let path_str = hook_file.path.to_string_lossy().to_string();\n            Ok(Some(ResolvedHook {\n                phase,\n                name: hook_name.to_string(),\n                source: HookSource::Convention,\n                program: path_str.clone(),\n                args: vec![],\n                cwd: package_dir.to_path_buf(),\n                display: path_str,\n            }))\n        }\n        _ =\u003e {\n            let candidates = matches\n                .iter()\n                .map(|f| {\n                    f.path\n                        .file_name()\n                        .unwrap_or_default()\n                        .to_string_lossy()\n                        .to_string()\n                })\n                .collect();\n            Err(RunError::AmbiguousHook {\n                hook_name: hook_name.to_string(),\n                candidates,\n            })\n        }\n    }\n}\n\n/// Interpret a hook value string.\n///\n/// If the value is a recognized build system name, use that system's template\n/// for the command derived from the hook name. Otherwise, treat it as a\n/// verbatim shell command and run via `sh -c`.\nfn resolve_hook_value(\n    hook_name: \u0026str,\n    phase: HookPhase,\n    value: \u0026str,\n    package_dir: \u0026Path,\n    source: HookSource,\n) -\u003e ResolvedHook {\n    // Try parsing as a build system\n    if let Ok(system) = parse_as_build_system(value) {\n        let command = strip_hook_prefix(hook_name);\n\n        // Try standard mapping first\n        if let Some(std_cmd) = StandardCommand::parse(\u0026command) {\n            if let Some((program, args)) =\n                standard_mapping(system, std_cmd, \u0026[], Some(package_dir))\n            {\n                let display = format_display(\u0026program, \u0026args);\n                return ResolvedHook {\n                    phase,\n                    name: hook_name.to_string(),\n                    source,\n                    program,\n                    args,\n                    cwd: package_dir.to_path_buf(),\n                    display,\n                };\n            }\n        }\n\n        // Fall back to proxy command\n        let (program, args) = proxy_command(system, \u0026command, \u0026[], Some(package_dir));\n        let display = format_display(\u0026program, \u0026args);\n        return ResolvedHook {\n            phase,\n            name: hook_name.to_string(),\n            source,\n            program,\n            args,\n            cwd: package_dir.to_path_buf(),\n            display,\n        };\n    }\n\n    // Not a system name — treat as verbatim shell command\n    ResolvedHook {\n        phase,\n        name: hook_name.to_string(),\n        source,\n        program: \"sh\".to_string(),\n        args: vec![\"-c\".to_string(), value.to_string()],\n        cwd: package_dir.to_path_buf(),\n        display: value.to_string(),\n    }\n}\n\n/// Strip the \"pre\" or \"post\" prefix from a hook name to get the command name.\nfn strip_hook_prefix(hook_name: \u0026str) -\u003e String {\n    if let Some(rest) = hook_name.strip_prefix(\"pre\") {\n        rest.to_string()\n    } else if let Some(rest) = hook_name.strip_prefix(\"post\") {\n        rest.to_string()\n    } else {\n        hook_name.to_string()\n    }\n}\n\n/// Try to parse a string as a [`BuildSystem`].\nfn parse_as_build_system(name: \u0026str) -\u003e Result\u003cBuildSystem, ()\u003e {\n    serde_json::from_value::\u003cBuildSystem\u003e(serde_json::Value::String(name.to_string()))\n        .map_err(|_| ())\n}\n\n/// Format a display string from program and args.\nfn format_display(program: \u0026str, args: \u0026[String]) -\u003e String {\n    let mut parts = vec![program.to_string()];\n    parts.extend(args.iter().cloned());\n    parts.join(\" \")\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use tempfile::TempDir;\n\n    // ── strip_hook_prefix ───────────────────────────────────────────\n\n    #[test]\n    fn strip_pre_prefix() {\n        assert_eq!(strip_hook_prefix(\"prebuild\"), \"build\");\n        assert_eq!(strip_hook_prefix(\"pretest\"), \"test\");\n        assert_eq!(strip_hook_prefix(\"prelint\"), \"lint\");\n    }\n\n    #[test]\n    fn strip_post_prefix() {\n        assert_eq!(strip_hook_prefix(\"postbuild\"), \"build\");\n        assert_eq!(strip_hook_prefix(\"posttest\"), \"test\");\n    }\n\n    #[test]\n    fn strip_no_prefix() {\n        assert_eq!(strip_hook_prefix(\"build\"), \"build\");\n    }\n\n    // ── parse_as_build_system ───────────────────────────────────────\n\n    #[test]\n    fn parse_known_systems() {\n        assert!(parse_as_build_system(\"cargo\").is_ok());\n        assert!(parse_as_build_system(\"npm\").is_ok());\n        assert!(parse_as_build_system(\"go\").is_ok());\n        assert!(parse_as_build_system(\"make\").is_ok());\n    }\n\n    #[test]\n    fn parse_unknown_system() {\n        assert!(parse_as_build_system(\"docker compose up\").is_err());\n        assert!(parse_as_build_system(\"./scripts/gen.sh\").is_err());\n        assert!(parse_as_build_system(\"foobar\").is_err());\n    }\n\n    // ── resolve_hook_value ──────────────────────────────────────────\n\n    #[test]\n    fn hook_value_shell_command() {\n        let dir = TempDir::new().unwrap();\n        let hook = resolve_hook_value(\n            \"prebuild\",\n            HookPhase::Pre,\n            \"./scripts/gen.sh\",\n            dir.path(),\n            HookSource::Explicit,\n        );\n        assert_eq!(hook.program, \"sh\");\n        assert_eq!(hook.args, vec![\"-c\", \"./scripts/gen.sh\"]);\n        assert_eq!(hook.display, \"./scripts/gen.sh\");\n        assert_eq!(hook.source, HookSource::Explicit);\n    }\n\n    #[test]\n    fn hook_value_compound_shell_command() {\n        let dir = TempDir::new().unwrap();\n        let hook = resolve_hook_value(\n            \"pretest\",\n            HookPhase::Pre,\n            \"docker compose up -d postgres\",\n            dir.path(),\n            HookSource::Explicit,\n        );\n        assert_eq!(hook.program, \"sh\");\n        assert_eq!(hook.args, vec![\"-c\", \"docker compose up -d postgres\"]);\n    }\n\n    #[test]\n    fn hook_value_cargo_system_for_lint() {\n        let dir = TempDir::new().unwrap();\n        let hook = resolve_hook_value(\n            \"prelint\",\n            HookPhase::Pre,\n            \"cargo\",\n            dir.path(),\n            HookSource::Explicit,\n        );\n        // cargo's lint mapping is \"cargo clippy\"\n        assert_eq!(hook.program, \"cargo\");\n        assert_eq!(hook.args, vec![\"clippy\"]);\n    }\n\n    #[test]\n    fn hook_value_npm_system_for_build() {\n        let dir = TempDir::new().unwrap();\n        let hook = resolve_hook_value(\n            \"prebuild\",\n            HookPhase::Pre,\n            \"npm\",\n            dir.path(),\n            HookSource::Explicit,\n        );\n        // npm's build mapping is \"npm run build\"\n        assert_eq!(hook.program, \"npm\");\n        assert_eq!(hook.args, vec![\"run\", \"build\"]);\n    }\n\n    #[test]\n    fn hook_value_make_system_for_test() {\n        let dir = TempDir::new().unwrap();\n        let hook = resolve_hook_value(\n            \"pretest\",\n            HookPhase::Pre,\n            \"make\",\n            dir.path(),\n            HookSource::Explicit,\n        );\n        assert_eq!(hook.program, \"make\");\n        assert_eq!(hook.args, vec![\"test\"]);\n    }\n\n    // ── resolve_hooks (pure resolution) ─────────────────────────────\n\n    #[test]\n    fn no_hooks_returns_none() {\n        let dir = TempDir::new().unwrap();\n        let input = HookResolveInput {\n            command: \"build\".to_string(),\n            package_dir: dir.path().to_path_buf(),\n            explicit_hooks: HashMap::new(),\n            convention_hooks: vec![],\n        };\n        let res = resolve_hooks(\u0026input).unwrap();\n        assert!(res.pre_hook.is_none());\n        assert!(res.post_hook.is_none());\n        assert!(res.warnings.is_empty());\n    }\n\n    #[test]\n    fn explicit_pre_hook_resolved() {\n        let dir = TempDir::new().unwrap();\n        let mut explicit = HashMap::new();\n        explicit.insert(\"prebuild\".to_string(), \"./gen.sh\".to_string());\n\n        let input = HookResolveInput {\n            command: \"build\".to_string(),\n            package_dir: dir.path().to_path_buf(),\n            explicit_hooks: explicit,\n            convention_hooks: vec![],\n        };\n        let res = resolve_hooks(\u0026input).unwrap();\n        assert!(res.pre_hook.is_some());\n        assert!(res.post_hook.is_none());\n\n        let hook = res.pre_hook.unwrap();\n        assert_eq!(hook.phase, HookPhase::Pre);\n        assert_eq!(hook.name, \"prebuild\");\n        assert_eq!(hook.source, HookSource::Explicit);\n        assert_eq!(hook.program, \"sh\");\n    }\n\n    #[test]\n    fn explicit_post_hook_resolved() {\n        let dir = TempDir::new().unwrap();\n        let mut explicit = HashMap::new();\n        explicit.insert(\"posttest\".to_string(), \"docker compose down\".to_string());\n\n        let input = HookResolveInput {\n            command: \"test\".to_string(),\n            package_dir: dir.path().to_path_buf(),\n            explicit_hooks: explicit,\n            convention_hooks: vec![],\n        };\n        let res = resolve_hooks(\u0026input).unwrap();\n        assert!(res.pre_hook.is_none());\n        assert!(res.post_hook.is_some());\n\n        let hook = res.post_hook.unwrap();\n        assert_eq!(hook.phase, HookPhase::Post);\n        assert_eq!(hook.name, \"posttest\");\n    }\n\n    #[test]\n    fn both_pre_and_pos
