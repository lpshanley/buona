"make\"),\n            BuildSystem::Gradle =\u003e write!(f, \"gradle\"),\n            BuildSystem::Maven =\u003e write!(f, \"maven\"),\n        }\n    }\n}\n\n/// Standard commands that buona recognizes and maps to system-specific invocations.\n#[derive(Debug, Clone, Copy, PartialEq, Eq, Hash)]\npub(crate) enum StandardCommand {\n    Install,\n    Build,\n    Run,\n    Test,\n    Lint,\n    Fmt,\n    Clean,\n    Publish,\n    Bench,\n    Doc,\n    Dev,\n}\n\nimpl StandardCommand {\n    /// Try to parse a string into a standard command.\n    pub(crate) fn parse(s: \u0026str) -\u003e Option\u003cSelf\u003e {\n        match s {\n            \"install\" =\u003e Some(Self::Install),\n            \"build\" =\u003e Some(Self::Build),\n            \"run\" =\u003e Some(Self::Run),\n            \"test\" =\u003e Some(Self::Test),\n            \"lint\" =\u003e Some(Self::Lint),\n            \"fmt\" | \"format\" =\u003e Some(Self::Fmt),\n            \"clean\" =\u003e Some(Self::Clean),\n            \"publish\" =\u003e Some(Self::Publish),\n            \"bench\" =\u003e Some(Self::Bench),\n            \"doc\" | \"docs\" =\u003e Some(Self::Doc),\n            \"dev\" =\u003e Some(Self::Dev),\n            _ =\u003e None,\n        }\n    }\n}\n\n/// Describes how the execution plan was derived.\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub(crate) enum PlanKind {\n    /// A standard command with a known system mapping (e.g., \"test\" → \"cargo test\").\n    Standard,\n    /// An unrecognized command proxied through the build system (e.g., \"my-script\" → \"npm run my-script\").\n    Proxy,\n    /// An explicit exec override from buona.json (e.g., \"test\" → [\"pnpm\", \"run\", \"custom-test\"]).\n    ExecOverride,\n}\n\n/// The phase at which a hook runs relative to the main command.\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub(crate) enum HookPhase {\n    Pre,\n    Post,\n}\n\nimpl fmt::Display for HookPhase {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter\u003c'_\u003e) -\u003e fmt::Result {\n        match self {\n            HookPhase::Pre =\u003e write!(f, \"pre\"),\n            HookPhase::Post =\u003e write!(f, \"post\"),\n        }\n    }\n}\n\n/// How a hook was resolved.\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub(crate) enum HookSource {\n    /// Defined explicitly in the `hooks` map of buona.json.\n    Explicit,\n    /// Discovered as a file in `hooksDir`.\n    Convention,\n}\n\n/// A fully resolved hook, ready to execute.\n#[derive(Debug, Clone)]\n#[allow(dead_code)]\npub(crate) struct ResolvedHook {\n    /// Pre or post.\n    pub(crate) phase: HookPhase,\n    /// The hook name (e.g., \"prebuild\", \"posttest\").\n    pub(crate) name: String,\n    /// How this hook was found.\n    pub(crate) source: HookSource,\n    /// The program to execute.\n    pub(crate) program: String,\n    /// Arguments to the program.\n    pub(crate) args: Vec\u003cString\u003e,\n    /// Working directory.\n    pub(crate) cwd: PathBuf,\n    /// Human-readable display string.\n    pub(crate) display: String,\n}\n\n/// The fully resolved execution plan. Contains everything needed to spawn the process.\n#[derive(Debug, Clone)]\npub(crate) struct ExecutionPlan {\n    /// Working directory for the command.\n    pub(crate) cwd: PathBuf,\n    /// The resolved build system.\n    pub(crate) system: BuildSystem,\n    /// How this plan was derived.\n    pub(crate) kind: PlanKind,\n    /// The program to execute (e.g., \"cargo\", \"npm\").\n    pub(crate) program: String,\n    /// Arguments to pass to the program.\n    pub(crate) args: Vec\u003cString\u003e,\n    /// Human-readable display string for output (e.g., \"cargo test -- --nocapture\").\n    pub(crate) display: String,\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn build_system_display() {\n        assert_eq!(BuildSystem::Cargo.to_string(), \"cargo\");\n        assert_eq!(BuildSystem::Npm.to_string(), \"npm\");\n        assert_eq!(BuildSystem::Gradle.to_string(), \"gradle\");\n        assert_eq!(BuildSystem::Maven.to_string(), \"maven\");\n    }\n\n    #[test]\n    fn build_system_serde_round_trips() {\n        for \u0026system in BuildSystem::ALL {\n            let json = serde_json::to_string(\u0026system).unwrap();\n            let deserialized: BuildSystem = serde_json::from_str(\u0026json).unwrap();\n            assert_eq!(deserialized, system);\n        }\n    }\n\n    #[test]\n    fn build_system_serializes_to_lowercase() {\n        assert_eq!(serde_json::to_string(\u0026BuildSystem::Cargo).unwrap(), \"\\\"cargo\\\"\");\n        assert_eq!(serde_json::to_string(\u0026BuildSystem::Gradle).unwrap(), \"\\\"gradle\\\"\");\n    }\n\n    #[test]\n    fn standard_command_parse_known() {\n        assert_eq!(StandardCommand::parse(\"install\"), Some(StandardCommand::Install));\n        assert_eq!(StandardCommand::parse(\"build\"), Some(StandardCommand::Build));\n        assert_eq!(StandardCommand::parse(\"run\"), Some(StandardCommand::Run));\n        assert_eq!(StandardCommand::parse(\"test\"), Some(StandardCommand::Test));\n        assert_eq!(StandardCommand::parse(\"lint\"), Some(StandardCommand::Lint));\n        assert_eq!(StandardCommand::parse(\"fmt\"), Some(StandardCommand::Fmt));\n        assert_eq!(StandardCommand::parse(\"format\"), Some(StandardCommand::Fmt));\n        assert_eq!(StandardCommand::parse(\"clean\"), Some(StandardCommand::Clean));\n        assert_eq!(StandardCommand::parse(\"publish\"), Some(StandardCommand::Publish));\n        assert_eq!(StandardCommand::parse(\"bench\"), Some(StandardCommand::Bench));\n        assert_eq!(StandardCommand::parse(\"doc\"), Some(StandardCommand::Doc));\n        assert_eq!(StandardCommand::parse(\"docs\"), Some(StandardCommand::Doc));\n        assert_eq!(StandardCommand::parse(\"dev\"), Some(StandardCommand::Dev));\n    }\n\n    #[test]\n    fn standard_command_parse_unknown() {\n        assert_eq!(StandardCommand::parse(\"my-script\"), None);\n        assert_eq!(StandardCommand::parse(\"custom\"), None);\n        assert_eq!(StandardCommand::parse(\"\"), None);\n    }\n\n    #[test]\n    fn hook_phase_display() {\n        assert_eq!(HookPhase::Pre.to_string(), \"pre\");\n        assert_eq!(HookPhase::Post.to_string(), \"post\");\n    }\n}\n","traces":[{"line":43,"address":[],"length":0,"stats":{"Line":5}},{"line":44,"address":[],"length":0,"stats":{"Line":5}},{"line":45,"address":[],"length":0,"stats":{"Line":4}},{"line":46,"address":[],"length":0,"stats":{"Line":0}},{"line":47,"address":[],"length":0,"stats":{"Line":2}},{"line":48,"address":[],"length":0,"stats":{"Line":0}},{"line":49,"address":[],"length":0,"stats":{"Line":0}},{"line":50,"address":[],"length":0,"stats":{"Line":0}},{"line":51,"address":[],"length":0,"stats":{"Line":0}},{"line":52,"address":[],"length":0,"stats":{"Line":0}},{"line":53,"address":[],"length":0,"stats":{"Line":0}},{"line":54,"address":[],"length":0,"stats":{"Line":2}},{"line":55,"address":[],"length":0,"stats":{"Line":2}},{"line":78,"address":[],"length":0,"stats":{"Line":31}},{"line":79,"address":[],"length":0,"stats":{"Line":31}},{"line":80,"address":[],"length":0,"stats":{"Line":32}},{"line":81,"address":[],"length":0,"stats":{"Line":35}},{"line":82,"address":[],"length":0,"stats":{"Line":26}},{"line":83,"address":[],"length":0,"stats":{"Line":32}},{"line":84,"address":[],"length":0,"stats":{"Line":18}},{"line":85,"address":[],"length":0,"stats":{"Line":29}},{"line":86,"address":[],"length":0,"stats":{"Line":13}},{"line":87,"address":[],"length":0,"stats":{"Line":12}},{"line":88,"address":[],"length":0,"stats":{"Line":11}},{"line":89,"address":[],"length":0,"stats":{"Line":19}},{"line":90,"address":[],"length":0,"stats":{"Line":9}},{"line":91,"address":[],"length":0,"stats":{"Line":5}},{"line":115,"address":[],"length":0,"stats":{"Line":2}},{"line":116,"address":[],"length":0,"stats":{"Line":2}},{"line":117,"address":[],"length":0,"stats":{"Line":2}},{"line":118,"address":[],"length":0,"stats":{"Line":2}}],"covered":24,"coverable":31},{"path":["/","Users","lpshanley","workplace","buona","src","buona","src","styles.rs"],"content":"//! Terminal styling utilities for consistent output formatting.\n\nuse console::Style;\n\n#[derive(Debug)]\npub(crate) struct Styles {\n    pub(crate) bold: Style,\n    pub(crate) dim: Style,\n    pub(crate) cyan: Style,\n    pub(crate) green: Style,\n    pub(crate) red: Style,\n    pub(crate) yellow: Style,\n}\n\nimpl Default for Styles {\n    fn default() -\u003e Self {\n        Self {\n            bold: Style::new().bold(),\n            dim: Style::new().dim(),\n            cyan: Style::new().cyan().bold(),\n            green: Style::new().green().bold(),\n            red: Style::new().red().bold(),\n            yellow: Style::new().yellow().bold(),\n        }\n    }\n}\n","traces":[{"line":16,"address":[],"length":0,"stats":{"Line":2}},{"line":18,"address":[],"length":0,"stats":{"Line":6}},{"line":19,"address":[],"length":0,"stats":{"Line":6}},{"line":20,"address":[],"length":0,"stats":{"Line":8}},{"line":21,"address":[],"length":0,"stats":{"Line":8}},{"line":22,"address":[],"length":0,"stats":{"Line":8}},{"line":23,"address":[],"length":0,"stats":{"Line":4}}],"covered":7,"coverable":7},{"path":["/","Users","lpshanley","workplace","buona","src","buona","src","workspace","git.rs"],"content":"//! Git URL resolution and package specifier parsing.\n\nuse anyhow::{Result, bail};\n\nuse crate::config;\nuse crate::config::GitProtocol;\n\n/// Resolved package information: the git clone URL and the local directory name.\npub(super) struct ResolvedPackage {\n    pub(super) url: String,\n    pub(super) name: String,\n}\n\n/// Build a git clone URL from components.\nfn build_clone_url(host: \u0026str, org: \u0026str, package: \u0026str, protocol: GitProtocol) -\u003e String {\n    match protocol {\n        GitProtocol::Ssh =\u003e format!(\"git@{host}:{org}/{package}.git\"),\n        GitProtocol::Https =\u003e format!(\"https://{host}/{org}/{package}.git\"),\n    }\n}\n\n/// Extract the package name from a URL or path.\n/// Takes the last path segment and strips any `.git` suffix.\nfn extract_package_name(url: \u0026str) -\u003e String {\n    // Split by '/' to get the last segment\n    let segment = url.rsplit('/').next().unwrap_or(url);\n    // For SSH URLs like git@host:repo.git (no slash after colon), also split by ':'\n    let segment = if segment.contains(':') {\n        segment.rsplit(':').next().unwrap_or(segment)\n    } else {\n        segment\n    };\n    segment.strip_suffix(\".git\").unwrap_or(segment).to_string()\n}\n\n/// Parse a package specifier into a resolved git URL and package name.\n///\n/// Supports three patterns:\n/// 1. Fully qualified URL (contains `://` or starts with `git@`)\n/// 2. Org/Package (contains exactly one `/`)\n/// 3. Direct package name (no `/`)\npub(super) fn resolve_package_spec(\n    spec: \u0026str,\n    git: \u0026config::GitConfig,\n) -\u003e Result\u003cResolvedPackage\u003e {\n    let url = if spec.contains(\"://\") || spec.starts_with(\"git@\") {\n        // Fully qualified URL — use as-is\n        spec.to_string()\n    } else if spec.contains('/') {\n        // Org/Package pattern\n        let (org, package) = spec.split_once('/').expect(\"already checked contains '/'\");\n        build_clone_url(\u0026git.host, org, package, git.protocol)\n    } else {\n        // Direct package name — requires organization in config\n        if git.organization.is_empty() {\n            bail!(\n                \"cannot resolve package \\\"{spec}\\\" without a configured git organization.\\n  \\\n                 Run `buona config setup` to set one, or use the org/package format.\"\n            );\n        }\n        build_clone_url(\u0026git.host, \u0026git.organization, spec, git.protocol)\n    };\n\n    let name = extract_package_name(\u0026url);\n    Ok(ResolvedPackage { url, name })\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    // ── extract_package_name tests ───────────────────────────────────\n\n    #[test]\n    fn extract_name_from_https_url() {\n        assert_eq!(\n            extract_package_name(\"https://github.com/acme/toolkit.git\"),\n            \"toolkit\"\n        );\n    }\n\n    #[test]\n    fn extract_name_from_https_url_no_dot_git() {\n        assert_eq!(\n            extract_package_name(\"https://github.com/acme/toolkit\"),\n            \"toolkit\"\n        );\n    }\n\n    #[test]\n    fn extract_name_from_ssh_url() {\n        assert_eq!(\n            extract_package_name(\"git@github.com:acme/toolkit.git\"),\n            \"toolkit\"\n        );\n    }\n\n    #[test]\n    fn extract_name_from_ssh_url_no_slash() {\n        assert_eq!(\n            extract_package_name(\"git@github.com:toolkit.git\"),\n            \"toolkit\"\n        );\n    }\n\n    #[test]\n    fn extract_name_from_plain_name() {\n        assert_eq!(extract_package_name(\"toolkit\"), \"toolkit\");\n    }\n\n    // ── build_clone_url tests ────────────────────────────────────────\n\n    #[test]\n    fn build_clone_url_ssh() {\n        assert_eq!(\n            build_clone_url(\"github.com\", \"acme\", \"toolkit\", GitProtocol::Ssh),\n            \"git@github.com:acme/toolkit.git\"\n        );\n    }\n\n    #[test]\n    fn build_clone_url_https() {\n        assert_eq!(\n            build_clone_url(\"github.com\", \"acme\", \"toolkit\", GitProtocol::Https),\n            \"https://github.com/acme/toolkit.git\"\n        );\n    }\n\n    // ── resolve_package_spec tests ───────────────────────────────────\n\n    fn test_git_config() -\u003e config::GitConfig {\n        config::GitConfig {\n            host: \"github.com\".to_string(),\n            organization: \"myorg\".to_string(),\n            protocol: GitProtocol::Ssh,\n        }\n    }\n\n    #[test]\n    fn resolve_direct_package_name_ssh() {\n        let git = test_git_config();\n        let result = resolve_package_spec(\"toolkit\", \u0026git).unwrap();\n        assert_eq!(result.url, \"git@github.com:myorg/toolkit.git\");\n        assert_eq!(result.name, \"toolkit\");\n    }\n\n    #[test]\n    fn resolve_direct_package_name_https() {\n        let mut git = test_git_config();\n        git.protocol = GitProtocol::Https;\n        let result = resolve_package_spec(\"toolkit\", \u0026git).unwrap();\n        assert_eq!(result.url, \"https://github.com/myorg/toolkit.git\");\n        assert_eq!(result.name, \"toolkit\");\n    }\n\n    #[test]\n    fn resolve_direct_package_name_fails_without_org() {\n        let mut git = test_git_config();\n        git.organization = String::new();\n        let result = resolve_package_spec(\"toolkit\", \u0026git);\n        assert!(result.is_err());\n    }\n\n    #[test]\n    fn resolve_org_package_ssh() {\n        let git = test_git_config();\n        let result = resolve_package_spec(\"acme/toolkit\", \u0026git).unwrap();\n        assert_eq!(result.url, \"git@github.com:acme/toolkit.git\");\n        assert_eq!(result.name, \"toolkit\");\n    }\n\n    #[test]\n    fn resolve_org_package_https() {\n        let mut git = test_git_config();\n        git.protocol = GitProtocol::Https;\n        let result = resolve_package_spec(\"acme/toolkit\", \u0026git).unwrap();\n        assert_eq!(result.url, \"https://github.com/acme/toolkit.git\");\n        assert_eq!(result.name, \"toolkit\");\n    }\n\n    #[test]\n    fn resolve_full_https_url() {\n        let git = test_git_config();\n        let result =\n            resolve_package_spec(\"https://github.com/other/repo.git\", \u0026git).unwrap();\n        assert_eq!(result.url, \"https://github.com/other/repo.git\");\n        assert_eq!(result.name, \"repo\");\n    }\n\n    #[test]\n    fn resolve_full_ssh_url() {\n        let git = test_git_config();\n        let result =\n            resolve_package_spec(\"git@github.com:other/repo.git\", \u0026git).unwrap();\n        assert_eq!(result.url, \"git@github.com:other/repo.git\");\n        assert_eq!(result.name, \"repo\");\n    }\n\n    #[test]\n    fn resolve_full_url_ignores_config_org() {\n        let mut git = test_git_config();\n        git.organization = String::new(); // no org configured\n        let result =\n            resolve_package_spec(\"https://github.com/other/repo.git\", \u0026git).unwrap();\n        assert_eq!(result.url, \"https://github.com/other/repo.git\");\n        assert_eq!(result.name, \"repo\");\n    }\n}\n","traces":[{"line":15,"address":[],"length":0,"stats":{"Line":6}},{"line":16,"address":[],"length":0,"stats":{"Line":6}},{"line":17,"address":[],"length":0,"stats":{"Line":3}},{"line":18,"address":[],"length":0,"stats":{"Line":3}},{"line":24,"address":[],"length":0,"stats":{"Line":14}},{"line":26,"address":[],"length":0,"stats":{"Line":70}},{"line":28,"address":[],"length":0,"stats":{"Line":42}},{"line":29,"address":[],"length":0,"stats":{"Line":4}},{"line":31,"address":[],"length":0,"stats":{"Line":13}},{"line":33,"address":[],"length":0,"stats":{"Line":56}},{"line":42,"address":[],"length":0,"stats":{"Line":10}},{"line":46,"address":[],"length":0,"stats":{"Line":41}},{"line":48,"address":[],"length":0,"stats":{"Line":10}},{"line":49,"address":[],"length":0,"stats":{"Line":10}},{"line":51,"address":[],"length":0,"stats":{"Line":10}},{"line":52,"address":[],"length":0,"stats":{"Line":10}},{"line":55,"address":[],"length":0,"stats":{"Line":6}},{"line":56,"address":[],"length":0,"stats":{"Line":1}},{"line":61,"address":[],"length":0,"stats":{"Line":10}},{"line":64,"address":[],"length":0,"stats":{"Line":27}},{"line":65,"address":[],"length":0,"stats":{"Line":9}}],"covered":21,"coverable":21},{"path":["/","Users","lpshanley","workplace","buona","src","buona","src","workspace","mod.rs"],"content":"//! Workspace management — creating, listing, deleting workspaces and adding/removing packages.\n\nmod git;\nmod ops;\nmod types;\nmod vscode;\n\npub(crate) use ops::{add, adopt, create, delete, find_workspace_root, info, list, open, remove_packages, sync};\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","lpshanley","workplace","buona","src","buona","src","workspace","ops.rs"],"content":"//! Workspace operations — list, create, delete, add, remove, sync, adopt, and open.\n\nuse std::env;\nuse std::fs;\nuse std::path::{Path, PathBuf};\nuse std::process::Command;\n\nuse anyhow::{Context, Result, bail};\nuse dialoguer::Confirm;\n\nuse crate::config;\nuse crate::styles::Styles;\n\nuse super::git::resolve_package_spec;\nuse super::types::{WorkspaceMeta, WORKSPACE_FILE, read_meta, write_meta};\nuse super::vscode::{VscodeWorkspace, VscodeWorkspaceFolder, sanitize_name};\n\n/// Find a workspace by name or directory name. Returns the resolved path.\nfn find_workspace(query: \u0026str) -\u003e Result\u003cPathBuf\u003e {\n    let workspace_dir = config::workspace_dir()?;\n\n    // First, try as a direct directory name\n    let direct = workspace_dir.join(query);\n    if direct.is_dir() \u0026\u0026 read_meta(\u0026direct)?.is_some() {\n        return Ok(direct);\n    }\n\n    // Otherwise, search by workspace name in metadata\n    let entries = fs::read_dir(\u0026workspace_dir).with_context(|| {\n        format!(\n            \"could not read workspace directory: {}\",\n            workspace_dir.display()\n        )\n    })?;\n\n    for entry in entries {\n        let entry = entry?;\n        if entry.file_type()?.is_dir() {\n            let path = entry.path();\n            if let Some(meta) = read_meta(\u0026path)?\n                \u0026\u0026 meta.name == query\n            {\n                return Ok(path);\n            }\n        }\n    }\n\n    bail!(\"no workspace found matching \\\"{query}\\\"\")\n}\n\n/// Walk up from the given directory looking for a `buona.workspace.json` file.\n/// Returns the directory containing the workspace file.\npub(crate) fn find_workspace_root(start: \u0026Path) -\u003e Result\u003cPathBuf\u003e {\n    let mut dir = start.to_path_buf();\n    loop {\n        if dir.join(WORKSPACE_FILE).exists() {\n            return Ok(dir);\n        }\n        if !dir.pop() {\n            bail!(\n                \"not inside a workspace (no {} found in any parent directory)\\n  \\\n                 Either cd into a workspace or use --workspace to specify one.\",\n                WORKSPACE_FILE\n            );\n        }\n    }\n}\n\n/// Find the workspace root from the current working directory.\nfn find_workspace_from_cwd() -\u003e Result\u003cPathBuf\u003e {\n    let cwd = env::current_dir().context(\"could not determine current directory\")?;\n    find_workspace_root(\u0026cwd)\n}\n\n/// Scan the `src/` directory of a workspace and return sorted package names.\n///\n/// Each subdirectory of `src/` is treated as a package. Returns an empty vec\n/// if the `src/` directory does not exist.\nfn list_packages(ws_root: \u0026Path) -\u003e Result\u003cVec\u003cString\u003e\u003e {\n    let src_dir = ws_root.join(\"src\");\n    if !src_dir.exists() {\n        return Ok(Vec::new());\n    }\n    let mut names: Vec\u003cString\u003e = Vec::new();\n    for entry in fs::read_dir(\u0026src_dir)\n        .with_context(|| format!(\"could not read src directory: {}\", src_dir.display()))?\n    {\n        let entry = entry?;\n        if entry.file_type()?.is_dir() {\n            names.push(entry.file_name().to_string_lossy().into_owned());\n        }\n    }\n    names.sort();\n    Ok(names)\n}\n\n/// Detect the git remote origin URL for a directory, if it is a git repo.\n///\n/// Returns the URL string on success, or an empty string if the directory is\n/// not a git repo or has no `origin` remote.\nfn detect_git_remote_url(dir: \u0026Path) -\u003e String {\n    Command::new(\"git\")\n        .args([\"-C\", \u0026dir.to_string_lossy(), \"remote\", \"get-url\", \"origin\"])\n        .output()\n        .ok()\n        .filter(|o| o.status.success())\n        .and_then(|o| {\n            let url = String::from_utf8_lossy(\u0026o.stdout).trim().to_string();\n            if url.is_empty() { None } else { Some(url) }\n        })\n        .unwrap_or_default()\n}\n\n/// Detect the current git branch for a directory.\n///\n/// Returns the branch name on success, or an empty string if the directory is\n/// not a git repo or HEAD is detached.\nfn detect_git_branch(dir: \u0026Path) -\u003e String {\n    Command::new(\"git\")\n        .args([\"-C\", \u0026dir.to_string_lossy(), \"rev-parse\", \"--abbrev-ref\", \"HEAD\"])\n        .output()\n        .ok()\n        .filter(|o| o.status.success())\n        .and_then(|o| {\n            let branch = String::from_utf8_lossy(\u0026o.stdout).trim().to_string();\n            // \"HEAD\" is returned when in detached state\n            if branch.is_empty() || branch == \"HEAD\" { None } else { Some(branch) }\n        })\n        .unwrap_or_default()\n}\n\n/// List all workspaces (directories) found in the configured workspace directory.\npub(crate) fn list() -\u003e Result\u003c()\u003e {\n    let workspace_dir = config::workspace_dir()?;\n    let s = Styles::default();\n\n    println!();\n    println!(\"  {}\", s.bold.apply_to(\"Workspaces\"));\n    println!(\"  {}\", s.dim.apply_to(\"──────────\"));\n\n    if !workspace_dir.exists() {\n        bail!(\n            \"workspace directory does not exist: {}\\n  Run {} to configure it.\",\n            workspace_dir.display(),\n            \"buona config setup\",\n        );\n    }\n\n    let entries = fs::read_dir(\u0026workspace_dir).with_context(|| {\n        format!(\n            \"could not read workspace directory: {}\",\n            workspace_dir.display()\n        )\n    })?;\n\n    let mut workspaces: Vec\u003c(String, WorkspaceMeta)\u003e = Vec::new();\n    for entry in entries {\n        let entry = entry?;\n        if entry.file_type()?.is_dir() {\n            let dir_name = entry.file_name().to_string_lossy().into_owned();\n            if let Some(meta) = read_meta(\u0026entry.path())? {\n                workspaces.push((dir_name, meta));\n            }\n        }\n    }\n\n    workspaces.sort_by(|a, b| a.0.cmp(\u0026b.0));\n\n    if workspaces.is_empty() {\n        println!(\n            \"  {}\",\n            s.dim.apply_to(format!(\n                \"No workspaces found in {}\",\n                workspace_dir.display()\n            ))\n        );\n    } else {\n        println!(\n            \"  {}  {}\",\n            s.dim.apply_to(\"Directory:\"),\n            workspace_dir.display()\n        );\n        println!();\n        for (dir_name, meta) in \u0026workspaces {\n            if meta.name != *dir_name {\n                println!(\n                    \"  {}  {} {}\",\n                    s.cyan.apply_to(\"•\"),\n                    meta.name,\n                    s.dim.apply_to(format!(\"({dir_name})\"))\n                );\n            } else {\n                println!(\"  {}  {dir_name}\", s.cyan.apply_to(\"•\"));\n            }\n        }\n    }\n\n    println!();\n    Ok(())\n}\n\n/// Create a new workspace directory. Writes a `buona.workspace.json` marker\n/// file with the workspace name. If `name` is not provided, the directory name\n/// is used.\n///\n/// After creation, if `packages` is provided, they are cloned into the workspace.\n/// If `open_ws` is true, the workspace is opened in the configured editor.\npub(crate) fn create(\n    path: \u0026Path,\n    name: Option\u003c\u0026str\u003e,\n    packages: Option\u003c\u0026[String]\u003e,\n    open_ws: bool,\n) -\u003e Result\u003c()\u003e {\n    let s = Styles::default();\n\n    // Resolve the target directory\n    let target: PathBuf = if path.is_absolute() {\n        path.to_path_buf()\n    } else {\n        config::workspace_dir()?.join(path)\n    };\n\n    // Derive the workspace name\n    let ws_name = match name {\n        Some(n) =\u003e n.to_string(),\n        None =\u003e target\n            .file_name()\n            .context(\"could not determine directory name from path\")?\n            .to_string_lossy()\n            .into_owned(),\n    };\n\n    if target.exists() {\n        bail!(\"directory already exists: {}\", target.display());\n    }\n\n    // Create the workspace directory (and any parent directories)\n    fs::create_dir_all(\u0026target)\n        .with_context(|| format!(\"could not create workspace directory: {}\", target.display()))?;\n\n    // Create the src/ directory for packages\n    fs::create_dir_all(target.join(\"src\")).with_context(|| {\n        format!(\n            \"could not create src directory: {}\",\n            target.join(\"src\").display()\n        )\n    })?;\n\n    // Write the workspace metadata file\n    let meta = WorkspaceMeta { name: ws_name };\n    write_meta(\u0026target, \u0026meta)?;\n\n    // Auto-sync the .code-workspace file\n    sync_workspace_file(\u0026target, \u0026meta)?;\n\n    println!();\n    println!(\n        \"  {} Created workspace {}\",\n        s.green.apply_to(\"✔\"),\n        s.bold.apply_to(\u0026meta.name)\n    );\n    println!(\"  {}  {}\", s.dim.apply_to(\"Location:\"), target.display());\n\n    // Add packages if specified\n    if let Some(pkgs) = packages\n        \u0026\u0026 !pkgs.is_empty()\n    {\n        add_packages_to_workspace(\u0026target, pkgs)?;\n    }\n\n    // Open workspace in editor if requested\n    if open_ws {\n        open_workspace_at(\u0026target)?;\n    }\n\n    println!();\n    Ok(())\n}\n\n/// Delete a workspace by name or directory name. Prompts for confirmation\n/// unless `force` is true.\npub(crate) fn delete(query: \u0026str, force: bool) -\u003e Result\u003c()\u003e {\n    let s = Styles::default();\n\n    let target = find_workspace(query)?;\n\n    let meta = read_meta(\u0026target)?;\n    let display_name = meta.as_ref().map(|m| m.name.as_str()).unwrap_or(query);\n\n    if !force {\n        println!();\n        let confirmed = Confirm::new()\n            .with_prompt(format!(\n                \"  Delete workspace {} at {}?\",\n                s.bold.apply_to(display_name),\n                s.dim.apply_to(target.display().to_string())\n            ))\n            .default(false)\n            .interact()\n            .context(\"failed to read input\")?;\n\n        if !confirmed {\n            println!(\"  Aborted.\");\n            println!();\n            return Ok(());\n        }\n    }\n\n    fs::remove_dir_all(\u0026target)\n        .with_context(|| format!(\"could not delete workspace directory: {}\", target.display()))?;\n\n    println!();\n    println!(\n        \"  {} Deleted workspace {}\",\n        s.green.apply_to(\"✔\"),\n        s.bold.apply_to(display_name)\n    );\n    println!();\n\n    Ok(())\n}\n\n/// Add packages to a specific workspace root.\n///\n/// Internal helper that adds packages to `src/` without resolving workspace by name.\nfn add_packages_to_workspace(ws_root: \u0026Path, packages: \u0026[String]) -\u003e Result\u003c()\u003e {\n    let s = Styles::default();\n    let cfg = config::load_config()?;\n\n    let meta = read_meta(ws_root)?\n        .context(\"could not read workspace metadata — is this a valid buona workspace?\")?;\n\n    let src_dir = ws_root.join(\"src\");\n\n    println!();\n    println!(\n        \"  {} Adding packages to {}\",\n        s.bold.apply_to(\"📦\"),\n        s.bold.apply_to(\u0026meta.name)\n    );\n    println!(\"  {}\", s.dim.apply_to(\"───────────────────────────\"));\n\n    let mut successes: Vec\u003cString\u003e = Vec::new();\n    let mut failures: Vec\u003c(String, String)\u003e = Vec::new();\n\n    for spec in packages {\n        let resolved = match resolve_package_spec(spec, \u0026cfg.git) {\n            Ok(r) =\u003e r,\n            Err(e) =\u003e {\n                failures.push((spec.clone(), format!(\"{e}\")));\n                println!(\"  {} {} — {}\", s.red.apply_to(\"✘\"), spec, e);\n                continue;\n            }\n        };\n\n        let dest = src_dir.join(\u0026resolved.name);\n        if dest.exists() {\n            let msg = format!(\"directory already exists: {}\", dest.display());\n            failures.push((spec.clone(), msg.clone()));\n            println!(\"  {} {} — {}\", s.red.apply_to(\"✘\"), spec, msg);\n            continue;\n        }\n\n        // Ensure src/ directory exists\n        fs::create_dir_all(\u0026src_dir)\n            .with_context(|| format!(\"could not create src directory: {}\", src_dir.display()))?;\n\n        println!(\n            \"  {} Cloning {} ...\",\n            s.dim.apply_to(\"→\"),\n            s.cyan.apply_to(\u0026resolved.name)\n        );\n\n        let output = Command::new(\"git\")\n            .arg(\"clone\")\n            .arg(\u0026resolved.url)\n            .arg(\u0026dest)\n            .output()\n            .context(\"failed to execute git clone — is git installed?\")?;\n\n        if output.status.success() {\n            println!(\n                \"  {} {}\",\n                s.green.apply_to(\"✔\"),\n                s.bold.apply_to(\u0026resolved.name)\n            );\n            successes.push(resolved.name);\n        } else {\n            let stderr = String::from_utf8_lossy(\u0026output.stderr);\n            let msg = stderr.trim().to_string();\n            failures.push((spec.clone(), msg.clone()));\n            println!(\"  {} {} — {}\", s.red.apply_to(\"✘\"), spec, msg);\n        }\n    }\n\n    // Re-sync the .code-workspace file (picks up newly cloned directories)\n    if !successes.is_empty() {\n        sync_workspace_file(ws_root, \u0026meta)?;\n    }\n\n    // Print summary\n    println!();\n    if !failures.is_empty() {\n        println!(\"  {} added, {} failed\", successes.len(), failures.len());\n    } else {\n        println!(\n            \"  {} {} package{} added\",\n            s.green.apply_to(\"✔\"),\n            successes.len(),\n            if successes.len() == 1 { \"\" } else { \"s\" }\n        );\n    }\n    println!();\n\n    if !failures.is_empty() \u0026\u0026 successes.is_empty() {\n        bail!(\"all packages failed to add\");\n    }\n\n    Ok(())\n}\n\n/// Open a workspace at a specific root in the configured editor.\n///\n/// Internal helper that opens the workspace without resolving by name.\nfn open_workspace_at(ws_root: \u0026Path) -\u003e Result\u003c()\u003e {\n    let s = Styles::default();\n    let cfg = config::load_config()?;\n\n    let meta = read_meta(ws_root)?\n        .context(\"could not read workspace metadata — is this a valid buona workspace?\")?;\n\n    let ws_file_path = sync_workspace_file(ws_root, \u0026meta)?;\n\n    let ide_cmd = cfg.ide.command();\n\n    println!(\n        \"  {} Opening in {} ...\",\n        s.dim.apply_to(\"→\"),\n        s.bold.apply_to(cfg.ide.to_string())\n    );\n\n    let status = Command::new(ide_cmd)\n        .arg(\u0026ws_file_path)\n        .status()\n        .with_context(|| {\n            format!(\n                \"failed to launch {ide_cmd} — is {} installed and on your PATH?\",\n                cfg.ide\n            )\n        })?;\n\n    if !status.success() {\n        bail!(\"{ide_cmd} exited with {status}\");\n    }\n\n    println!(\n        \"  {} Opened {}\",\n        s.green.apply_to(\"✔\"),\n        s.bold.apply_to(\n            ws_file_path\n                .file_name()\n                .unwrap_or_default()\n                .to_string_lossy()\n        )\n    );\n    println!();\n\n    Ok(())\n}\n\n/// Add one or more packages to a workspace by cloning them into `src/`.\n///\n/// If `workspace` is provided, it is looked up by name or directory.\n/// Otherwise, the workspace is detected from the current working directory.\npub(crate) fn add(packages: \u0026[String], workspace: Option\u003c\u0026str\u003e) -\u003e Result\u003c()\u003e {\n    // Resolve the workspace root\n    let ws_root = match workspace {\n        Some(name) =\u003e find_workspace(name)?,\n        None =\u003e find_workspace_from_cwd()?,\n    };\n\n    add_packages_to_workspace(\u0026ws_root, packages)\n}\n\n/// Remove one or more packages from a workspace.\n///\n/// Deletes the corresponding directories under `src/` and re-syncs the\n/// `.code-workspace` file. Prompts for confirmation unless `force` is true.\n///\n/// If `workspace` is provided, it is looked up by name or directory.\n/// Otherwise, the workspace is detected from the current working directory.\npub(crate) fn remove_packages(packages: \u0026[String], workspace: Option\u003c\u0026str\u003e, force: bool) -\u003e Result\u003c()\u003e {\n    let s = Styles::default();\n\n    // Resolve the workspace root\n    let ws_root = match workspace {\n        Some(name) =\u003e find_workspace(name)?,\n        None =\u003e find_workspace_from_cwd()?,\n    };\n\n    let meta = read_meta(\u0026ws_root)?\n        .context(\"could not read workspace metadata — is this a valid buona workspace?\")?;\n\n    let src_dir = ws_root.join(\"src\");\n    let known_packages = list_packages(\u0026ws_root)?;\n\n    // Partition packages into found and not-found\n    let mut to_remove: Vec\u003c\u0026str\u003e = Vec::new();\n    let mut not_found: Vec\u003c\u0026str\u003e = Vec::new();\n\n    for name in packages {\n        if known_packages.iter().any(|p| p == name) {\n            // Avoid duplicates if the user passes the same name twice\n            if !to_remove.contains(\u0026name.as_str()) {\n                to_remove.push(name);\n            }\n        } else {\n            not_found.push(name);\n        }\n    }\n\n    // Report not-found packages upfront\n    if !not_found.is_empty() {\n        println!();\n        for name in \u0026not_found {\n            println!(\n                \"  {} Package {} not found in workspace {}\",\n                s.red.apply_to(\"✘\"),\n                s.bold.apply_to(name),\n                s.bold.apply_to(\u0026meta.name),\n            );\n        }\n    }\n\n    if to_remove.is_empty() {\n        if not_found.is_empty() {\n            println!();\n            println!(\"  {} No packages specified\", s.dim.apply_to(\"—\"));\n        }\n        println!();\n        bail!(\"no matching packages to remove\");\n    }\n\n    // Show what will be removed and confirm\n    println!();\n    println!(\n        \"  {} Removing from {}\",\n        s.bold.apply_to(\"📦\"),\n        s.bold.apply_to(\u0026meta.name)\n    );\n    println!(\"  {}\", s.dim.apply_to(\"───────────────────────────\"));\n    for name in \u0026to_remove {\n        println!(\"  {}  {}\", s.red.apply_to(\"−\"), name);\n    }\n    println!();\n\n    if !force {\n        let prompt_msg = if to_remove.len() == 1 {\n            format!(\n                \"  Remove {} from {}?\",\n                s.bold.apply_to(to_remove[0]),\n                s.bold.apply_to(\u0026meta.name)\n            )\n        } else {\n            format!(\n                \"  Remove {} packages from {}?\",\n                to_remove.len(),\n                s.bold.apply_to(\u0026meta.name)\n            )\n        };\n\n        let confirmed = Confirm::new()\n            .with_prompt(prompt_msg)\n            .default(false)\n            .interact()\n            .context(\"failed to read input\")?;\n\n        if !confirmed {\n            println!(\"  Aborted.\");\n            println!();\n            return Ok(());\n        }\n    }\n\n    // Remove directories and collect results\n    let mut removed: Vec\u003cString\u003e = Vec::new();\n    let mut dir_errors: Vec\u003c(String, String)\u003e = Vec::new();\n\n    for \u0026name in \u0026to_remove {\n        let pkg_dir = src_dir.join(name);\n\n        if pkg_dir.exists() {\n            if let Err(e) = fs::remove_dir_all(\u0026pkg_dir) {\n                dir_errors.push((name.to_string(), format!(\"{e}\")));\n                println!(\n                    \"  {} {} — could not remove directory: {}\",\n                    s.red.apply_to(\"✘\"),\n                    name,\n                    e\n                );\n                continue;\n            }\n        }\n\n        removed.push(name.to_string());\n    }\n\n    // Re-sync the .code-workspace file\n    if !removed.is_empty() {\n        sync_workspace_file(\u0026ws_root, \u0026meta)?;\n    }\n\n    // Print summary\n    println!();\n    for name in \u0026removed {\n        println!(\n            \"  {} Removed {}\",\n            s.green.apply_to(\"✔\"),\n            s.bold.apply_to(name)\n        );\n    }\n\n    if !dir_errors.is_empty() {\n        println!(\n            \"  {} removed, {} failed\",\n            removed.len(),\n            dir_errors.len()\n        );\n    } else {\n        println!();\n        println!(\n            \"  {} {} package{} removed\",\n            s.green.apply_to(\"✔\"),\n            removed.len(),\n            if removed.len() == 1 { \"\" } else { \"s\" }\n        );\n    }\n    println!();\n\n    if !dir_errors.is_empty() \u0026\u0026 removed.is_empty() {\n        bail!(\"all packages failed to remove\");\n    }\n\n    Ok(())\n}\n\n/// Generate a `.code-workspace` file from the workspace root.\n///\n/// Derives the folder list by scanning `src/` for subdirectories. Uses\n/// `meta.name` to produce the workspace filename. Returns the path to the\n/// generated file.\nfn sync_workspace_file(ws_root: \u0026Path, meta: \u0026WorkspaceMeta) -\u003e Result\u003cPathBuf\u003e {\n    let sanitized = sanitize_name(\u0026meta.name);\n    if sanitized.is_empty() {\n        bail!(\n            \"workspace name \\\"{}\\\" produces an empty filename after sanitization\",\n            meta.name\n        );\n    }\n\n    let filename = format!(\"{sanitized}.code-workspace\");\n    let ws_file_path = ws_root.join(\u0026filename);\n\n    // Build folder entries from directories in src/\n    let pkg_names = list_packages(ws_root)?;\n    let folders: Vec\u003cVscodeWorkspaceFolder\u003e = pkg_names\n        .iter()\n        .map(|name| VscodeWorkspaceFolder {\n            path: format!(\"src/{name}\"),\n            name: name.clone(),\n        })\n        .collect();\n\n    let vscode_ws = VscodeWorkspace {\n        folders,\n        settings: serde_json::json!({}),\n    };\n\n    let json = serde_json::to_string_pretty(\u0026vscode_ws)?;\n    fs::write(\u0026ws_file_path, json + \"\\n\")\n        .with_context(|| format!(\"could not write workspace file: {}\", ws_file_path.display()))?;\n\n    Ok(ws_file_path)\n}\n\n/// Pull (or fetch) the latest changes for tracked packages and re-sync the\n/// `.code-workspace` file.\n///\n/// When `packages` is empty, all packages in `src/` are synced. Otherwise, only\n/// the named packages are synced. Runs `git pull` (or `git fetch` when\n/// `fetch_only` is true) in each package directory, reports results, and\n/// regenerates the workspace file. Returns the path to the generated\n/// `.code-workspace` file.\n///\n/// If `workspace` is provided, it is looked up by name or directory.\n/// Otherwise, the workspace is detected from the current working directory.\npub(crate) fn sync(packages: \u0026[String], workspace: Option\u003c\u0026str\u003e, fetch_only: bool) -\u003e Result\u003cPathBuf\u003e {\n    let s = Styles::default();\n\n    // Resolve the workspace root\n    let ws_root = match workspace {\n        Some(name) =\u003e find_workspace(name)?,\n        None =\u003e find_workspace_from_cwd()?,\n    };\n\n    let meta = read_meta(\u0026ws_root)?\n        .context(\"could not read workspace metadata — is this a valid buona workspace?\")?;\n\n    let src_dir = ws_root.join(\"src\");\n    let known_packages = list_packages(\u0026ws_root)?;\n\n    // Determine which packages to sync\n    let targets: Vec\u003c\u0026str\u003e = if packages.is_empty() {\n        known_packages.iter().map(|s| s.as_str()).collect()\n    } else {\n        let mut matched: Vec\u003c\u0026str\u003e = Vec::new();\n        for name in packages {\n            if known_packages.iter().any(|p| p == name) {\n                matched.push(name);\n            } else {\n                bail!(\"package \\\"{name}\\\" not found in workspace {}\", meta.name);\n            }\n        }\n        matched\n    };\n\n    println!();\n    println!(\n        \"  {} Syncing {}\",\n        s.bold.apply_to(\"🔄\"),\n        s.bold.apply_to(\u0026meta.name)\n    );\n    println!(\"  {}\", s.dim.apply_to(\"───────────────────────────\"));\n\n    if targets.is_empty() {\n        println!(\"  {}  No packages to sync\", s.dim.apply_to(\"—\"));\n    }\n\n    let mut pulled: Vec\u003cString\u003e = Vec::new();\n    let mut failures: Vec\u003c(String, String)\u003e = Vec::new();\n\n    for \u0026pkg_name in \u0026targets {\n        let pkg_dir = src_dir.join(pkg_name);\n\n        if !pkg_dir.exists() {\n            let msg = format!(\"directory not found: {}\", pkg_dir.display());\n            failures.push((pkg_name.to_string(), msg.clone()));\n            println!(\"  {} {} — {}\", s.red.apply_to(\"✘\"), pkg_name, msg);\n            continue;\n        }\n\n        let git_op = if fetch_only { \"Fetching\" } else { \"Pulling\" };\n        println!(\n            \"  {} {} {} ...\",\n            s.dim.apply_to(\"→\"),\n            git_op,\n            s.cyan.apply_to(pkg_name)\n        );\n\n        let git_arg = if fetch_only { \"fetch\" } else { \"pull\" };\n        let output = Command::new(\"git\")\n            .arg(git_arg)\n            .current_dir(\u0026pkg_dir)\n            .output()\n            .with_context(|| format!(\"failed to execute git {git_arg} — is git installed?\"))?;\n\n        if output.status.success() {\n            let stdout = String::from_utf8_lossy(\u0026output.stdout);\n            let fallback = if fetch_only { \"done\" } else { \"up to date\" };\n            let summary = stdout.lines().next().unwrap_or(fallback).trim();\n            let summary = if summary.is_empty() { fallback } else { summary };\n            println!(\n                \"  {} {} — {}\",\n                s.green.apply_to(\"✔\"),\n                s.bold.apply_to(pkg_name),\n                s.dim.apply_to(summary)\n            );\n            pulled.push(pkg_name.to_string());\n        } else {\n            let stderr = String::from_utf8_lossy(\u0026output.stderr);\n            let msg = stderr.trim().to_string();\n            failures.push((pkg_name.to_string(), msg.clone()));\n            println!(\"  {} {} — {}\", s.red.apply_to(\"✘\"), pkg_name, msg);\n        }\n    }\n\n    // Re-sync the .code-workspace file\n    let ws_file_path = sync_workspace_file(\u0026ws_root, \u0026meta)?;\n\n    // Print summary\n    let verb = if fetch_only { \"fetched\" } else { \"pulled\" };\n    println!();\n    if !failures.is_empty() {\n        println!(\"  {} {verb}, {} failed\", pulled.len(), failures.len());\n    } else if !targets.is_empty() {\n        println!(\n            \"  {} {} package{} synced\",\n            s.green.apply_to(\"✔\"),\n            pulled.len(),\n            if pulled.len() == 1 { \"\" } else { \"s\" }\n        );\n    }\n\n    let filename = ws_file_path\n        .file_name()\n        .unwrap_or_default()\n        .to_string_lossy();\n    println!(\n        \"  {} Workspace file {}\",\n        s.green.apply_to(\"✔\"),\n        s.bold.apply_to(filename.as_ref())\n    );\n    println!();\n\n    Ok(ws_file_path)\n}\n\n/// Pretty-print detailed information about a workspace.\n///\n/// Shows workspace name, directory location, packages (discovered from `src/`),\n/// their git remote URLs, and the `.code-workspace` file path.\n///\n/// If `workspace` is provided, it is looked up by name or directory.\n/// Otherwise, the workspace is detected from the current working directory.\npub(crate) fn info(workspace: Option\u003c\u0026str\u003e, json: bool) -\u003e Result\u003c()\u003e {\n    let s = Styles::default();\n\n    // Resolve the workspace root\n    let ws_root = match workspace {\n        Some(name) =\u003e find_workspace(name)?,\n        None =\u003e find_workspace_from_cwd()?,\n    };\n\n    let meta = read_meta(\u0026ws_root)?\n        .context(\"could not read workspace metadata — is this a valid buona workspace?\")?;\n\n    let src_dir = ws_root.join(\"src\");\n    let pkg_names = list_packages(\u0026ws_root)?;\n\n    if json {\n        // Build a JSON representation with packages derived from disk\n        let packages_json: Vec\u003cserde_json::Value\u003e = pkg_names\n            .iter()\n            .map(|name| {\n                let pkg_dir = src_dir.join(name);\n                let url = detect_git_remote_url(\u0026pkg_dir);\n                let branch = detect_git_branch(\u0026pkg_dir);\n                serde_json::json!({\n                    \"name\": name,\n                    \"url\": if url.is_empty() { serde_json::Value::Null } else { serde_json::Value::String(url) },\n                    \"branch\": if branch.is_empty() { serde_json::Value::Null } else { serde_json::Value::String(branch) },\n                    \"dir\": pkg_dir.display().to_string(),\n                })\n            })\n            .collect();\n\n        let output = serde_json::json!({\n            \"name\": meta.name,\n            \"packages\": packages_json,\n        });\n        println!(\"{}\", serde_json::to_string_pretty(\u0026output)?);\n        return Ok(());\n    }\n\n    // Derive the .code-workspace filename\n    let sanitized = sanitize_name(\u0026meta.name);\n    let ws_file = format!(\"{sanitized}.code-workspace\");\n    let ws_file_path = ws_root.join(\u0026ws_file);\n\n    println!();\n    println!(\"  {}\", s.bold.apply_to(\"Workspace Info\"));\n    println!(\"  {}\", s.dim.apply_to(\"──────────────\"));\n    println!(\n        \"  {}  {}\",\n        s.cyan.apply_to(\"Name:\"),\n        s.bold.apply_to(\u0026meta.name)\n    );\n    println!(\n        \"  {}  {}\",\n        s.cyan.apply_to(\"Directory:\"),\n        ws_root.display()\n    );\n    println!(\n        \"  {}  {} {}\",\n        s.cyan.apply_to(\"Workspace file:\"),\n        ws_file,\n        if ws_file_path.exists() {\n            s.green.apply_to(\"(exists)\").to_string()\n        } else {\n            s.dim.apply_to(\"(not generated)\").to_string()\n        }\n    );\n    println!(\n        \"  {}  {}\",\n        s.cyan.apply_to(\"Packages:\"),\n        pkg_names.len()\n    );\n\n    if !pkg_names.is_empty() {\n        println!();\n        println!(\"  {}\", s.bold.apply_to(\"Packages\"));\n        println!(\"  {}\", s.dim.apply_to(\"──────────────\"));\n\n        for name in \u0026pkg_names {\n            let pkg_dir = src_dir.join(name);\n            let url = detect_git_remote_url(\u0026pkg_dir);\n            let branch = detect_git_branch(\u0026pkg_dir);\n\n            println!(\n                \"  {}  {}\",\n                s.cyan.apply_to(\"•\"),\n                s.bold.apply_to(name),\n            );\n            if !url.is_empty() {\n                println!(\n                    \"     {}  {}\",\n                    s.dim.apply_to(\"url:\"),\n                    s.dim.apply_to(\u0026url)\n                );\n            }\n            if !branch.is_empty() {\n                println!(\n                    \"     {}  {}\",\n                    s.dim.apply_to(\"branch:\"),\n                    s.dim.apply_to(\u0026branch)\n                );\n            }\n            println!(\n                \"     {}  {}\",\n                s.dim.apply_to(\"dir:\"),\n                s.dim.apply_to(pkg_dir.display().to_string())\n            );\n        }\n    }\n\n    println!();\n    Ok(())\n}\n\n/// Open a workspace in the configured editor.\n///\n/// Regenerates the `.code-workspace` file and then launches the editor.\n///\n/// If `workspace` is provided, it is looked up by name or directory.\n/// Otherwise, the workspace is detected from the current working directory.\npub(crate) fn open(workspace: Option\u003c\u0026str\u003e) -\u003e Result\u003c()\u003e {\n    // Resolve the workspace root\n    let ws_root = match workspace {\n        Some(name) =\u003e find_workspace(name)?,\n        None =\u003e find_workspace_from_cwd()?,\n    };\n\n    open_workspace_at(\u0026ws_root)\n}\n\n/// Adopt an existing local directory into the workspace.\n///\n/// Moves (or copies with `--copy`) the directory into `src/` if it is not\n/// already there, then syncs the `.code-workspace` file. The directory's\n/// presence in `src/` is all the registration needed.\n///\n/// If `workspace` is provided, it is looked up by name or directory.\n/// Otherwise, the workspace is detected from the current working directory.\npub(crate) fn adopt(\n    path: \u0026Path,\n    workspace: Option\u003c\u0026str\u003e,\n    copy: bool,\n    name_override: Option\u003c\u0026str\u003e,\n) -\u003e Result\u003c()\u003e {\n    let s = Styles::default();\n\n    // Resolve the workspace root\n    let ws_root = match workspace {\n        Some(name) =\u003e find_workspace(name)?,\n        None =\u003e find_workspace_from_cwd()?,\n    };\n\n    let meta = read_meta(\u0026ws_root)?\n        .context(\"could not read workspace metadata — is this a valid buona workspace?\")?;\n\n    // Resolve and validate the source path\n    let source = if path.is_absolute() {\n        path.to_path_buf()\n    } else {\n        env::current_dir()\n            .context(\"could not determine current directory\")?\n            .join(path)\n    };\n\n    if !source.exists() {\n        bail!(\"path does not exist: {}\", source.display());\n    }\n    if !source.is_dir() {\n        bail!(\n            \"path is not a directory: {}\\n  The adopt command requires a directory path.\",\n            source.display()\n        );\n    }\n\n    let source = source\n        .canonicalize()\n        .with_context(|| format!(\"could not resolve path: {}\", source.display()))?;\n\n    // Derive the package name\n    let pkg_name = match name_override {\n        Some(n) =\u003e n.to_string(),\n        None =\u003e source\n            .file_name()\n            .context(\"could not determine directory name from path\")?\n            .to_string_lossy()\n            .into_owned(),\n    };\n\n    let src_dir = ws_root.join(\"src\");\n    let dest = src_dir.join(\u0026pkg_name);\n\n    // Check if the directory is already at the correct location\n    let already_in_place = dest.exists()\n        \u0026\u0026 dest\n            .canonicalize()\n            .ok()\n            .map(|d| d == source)\n            .unwrap_or(false);\n\n    if already_in_place {\n        println!();\n        println!(\n            \"  {} Directory already at {}\",\n            s.dim.apply_to(\"→\"),\n            s.dim.apply_to(dest.display().to_string())\n        );\n    } else {\n        // Ensure src/ exists\n        fs::create_dir_all(\u0026src_dir)\n            .with_context(|| format!(\"could not create src directory: {}\", src_dir.display()))?;\n\n        if dest.exists() {\n            bail!(\n                \"destination already exists: {}\\n  \\\n                 A directory with the name \\\"{}\\\" is already in src/. \\\n                 Use --name to specify a different name.\",\n                dest.display(),\n                pkg_name\n            );\n        }\n\n        if copy {\n            println!(\n                \"  {} Copying {} to {} ...\",\n                s.dim.apply_to(\"→\"),\n                s.cyan.apply_to(\u0026pkg_name),\n                s.dim.apply_to(dest.display().to_string())\n            );\n\n            let status = Command::new(\"cp\")\n                .args([\"-a\"])\n                .arg(\u0026source)\n                .arg(\u0026dest)\n                .status()\n                .context(\"failed to execute cp — is it available on your system?\")?;\n\n            if !status.success() {\n                bail!(\"cp failed with {status}\");\n            }\n        } else {\n            println!(\n                \"  {} Moving {} to {} ...\",\n                s.dim.apply_to(\"→\"),\n                s.cyan.apply_to(\u0026pkg_name),\n                s.dim.apply_to(dest.display().to_string())\n            );\n\n            // Try fs::rename first (fast, same-filesystem only)\n            if fs::rename(\u0026source, \u0026dest).is_err() {\n                // Fall back to copy + delete for cross-device moves\n                let status = Command::new(\"cp\")\n                    .args([\"-a\"])\n                    .arg(\u0026source)\n                    .arg(\u0026dest)\n                    .status()\n                    .context(\"failed to execute cp — is it available on your system?\")?;\n\n                if !status.success() {\n                    bail!(\"cp failed with {status}\");\n                }\n\n                fs::remove_dir_all(\u0026source).with_context(|| {\n                    format!(\n                        \"copied to destination but could not remove original: {}\",\n                        source.display()\n                    )\n                })?;\n            }\n        }\n    }\n\n    // Sync the .code-workspace file (picks up the new directory in src/)\n    sync_workspace_file(\u0026ws_root, \u0026meta)?;\n\n    println!();\n    println!(\n        \"  {} Adopted {}\",\n        s.green.apply_to(\"✔\"),\n        s.bold.apply_to(\u0026pkg_name)\n    );\n    println!(\n        \"  {}  {}\",\n        s.dim.apply_to(\"Location:\"),\n        dest.display()\n    );\n    println!();\n\n    Ok(())\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use tempfile::TempDir;\n\n    /// Helper: create a workspace directory with metadata and a `src/` dir.\n    fn setup_workspace(dir: \u0026Path, name: \u0026str) {\n        fs::create_dir_all(dir.join(\"src\")).unwrap();\n        let meta = WorkspaceMeta {\n            name: name.to_string(),\n        };\n        write_meta(dir, \u0026meta).unwrap();\n    }\n\n    // ── find_workspace_root tests ────────────────────────────────────\n\n    #[test]\n    fn find_workspace_root_in_workspace_dir() {\n        let dir = TempDir::new().unwrap();\n        setup_workspace(dir.path(), \"test\");\n\n        let result = find_workspace_root(dir.path()).unwrap();\n        assert_eq!(result, dir.path());\n    }\n\n    #[test]\n    fn find_workspace_root_in_child_dir() {\n        let dir = TempDir::new().unwrap();\n        setup_workspace(dir.path(), \"test\");\n\n        // Create a child directory and search from there\n        let child = dir.path().join(\"src\").join(\"deep\");\n        fs::create_dir_all(\u0026child).unwrap();\n\n        let result = find_workspace_root(\u0026child).unwrap();\n        assert_eq!(result, dir.path());\n    }\n\n    #[test]\n    fn find_workspace_root_fails_when_not_in_workspace() {\n        let dir = TempDir::new().unwrap();\n        let result = find_workspace_root(dir.path());\n        assert!(result.is_err());\n    }\n\n    // ── list_packages tests ─────────────────────────────────────────\n\n    #[test]\n    fn list_packages_returns_sorted_directory_names() {\n        let dir = TempDir::new().unwrap();\n        setup_workspace(dir.path(), \"test\");\n\n        let src = dir.path().join(\"src\");\n        fs::create_dir_all(src.join(\"gamma\")).unwrap();\n        fs::create_dir_all(src.join(\"alpha\")).unwrap();\n        fs::create_dir_all(src.join(\"beta\")).unwrap();\n\n        let names = list_packages(dir.path()).unwrap();\n        assert_eq!(names, vec![\"alpha\", \"beta\", \"gamma\"]);\n    }\n\n    #[test]\n    fn list_packages_ignores_files_in_src() {\n        let dir = TempDir::new().unwrap();\n        setup_workspace(dir.path(), \"test\");\n\n        let src = dir.path().join(\"src\");\n        fs::create_dir_all(src.join(\"real-pkg\")).unwrap();\n        fs::write(src.join(\"not-a-package.txt\"), \"hello\").unwrap();\n\n        let names = list_packages(dir.path()).unwrap();\n        assert_eq!(names, vec![\"real-pkg\"]);\n    }\n\n    #[test]\n    fn list_packages_returns_empty_when_no_src() {\n        let dir = TempDir::new().unwrap();\n        // No src/ directory at all\n        let meta = WorkspaceMeta {\n            name: \"test\".to_string(),\n        };\n        write_meta(dir.path(), \u0026meta).unwrap();\n\n        let names = list_packages(dir.path()).unwrap();\n        assert!(names.is_empty());\n    }\n\n    #[test]\n    fn list_packages_returns_empty_when_src_is_empty() {\n        let dir = TempDir::new().unwrap();\n        setup_workspace(dir.path(), \"test\");\n\n        let names = list_packages(dir.path()).unwrap();\n        assert!(names.is_empty());\n    }\n\n    // ── detect_git_remote_url tests ─────────────────────────────────\n\n    #[test]\n    fn detect_git_remote_url_finds_origin() {\n        let dir = TempDir::new().unwrap();\n        let repo = dir.path().join(\"git-repo\");\n        fs::create_dir_all(\u0026repo).unwrap();\n\n        std::process::Command::new(\"git\")\n            .args([\"init\"])\n            .current_dir(\u0026repo)\n            .output()\n            .unwrap();\n        std::process::Command::new(\"git\")\n            .args([\"remote\", \"add\", \"origin\", \"git@github.com:acme/test.git\"])\n            .current_dir(\u0026repo)\n            .output()\n            .unwrap();\n\n        let url = detect_git_remote_url(\u0026repo);\n        assert_eq!(url, \"git@github.com:acme/test.git\");\n    }\n\n    #[test]\n    fn detect_git_remote_url_returns_empty_for_non_git_dir() {\n        let dir = TempDir::new().unwrap();\n        let plain = dir.path().join(\"plain-dir\");\n        fs::create_dir_all(\u0026plain).unwrap();\n\n        let url = detect_git_remote_url(\u0026plain);\n        assert!(url.is_empty());\n    }\n\n    // ── detect_git_branch tests ─────────────────────────────────────\n\n    #[test]\n    fn detect_git_branch_finds_current_branch() {\n        let dir = TempDir::new().unwrap();\n        let repo = dir.path().join(\"git-repo\");\n        fs::create_dir_all(\u0026repo).unwrap();\n\n        std::process::Command::new(\"git\")\n            .args([\"init\", \"-b\", \"main\"])\n            .current_dir(\u0026repo)\n            .output()\n            .unwrap();\n\n        // HEAD requires at least one commit to resolve\n        fs::write(repo.join(\"README.md\"), \"hello\").unwrap();\n        std::process::Command::new(\"git\")\n            .args([\"add\", \".\"])\n            .current_dir(\u0026repo)\n            .output()\n            .unwrap();\n        std::process::Command::new(\"git\")\n            .args([\"-c\", \"user.name=Test\", \"-c\", \"user.email=test@test.com\", \"commit\", \"-m\", \"init\"])\n            .current_dir(\u0026repo)\n            .output()\n            .unwrap();\n\n        let branch = detect_git_branch(\u0026repo);\n        assert_eq!(branch, \"main\");\n    }\n\n    #[test]\n    fn detect_git_branch_returns_empty_for_non_git_dir() {\n        let dir = TempDir::new().unwrap();\n        let plain = dir.path().join(\"plain-dir\");\n        fs::create_dir_all(\u0026plain).unwrap();\n\n        let branch = detect_git_branch(\u0026plain);\n        assert!(branch.is_empty());\n    }\n\n    // ── remove_packages tests ───────────────────────────────────────\n\n    #[test]\n    fn remove_deletes_directory_from_src() {\n        let dir = TempDir::new().unwrap();\n        setup_workspace(dir.path(), \"test\");\n\n        let src = dir.path().join(\"src\");\n        fs::create_dir_all(src.join(\"alpha\")).unwrap();\n        fs::create_dir_all(src.join(\"beta\")).unwrap();\n        fs::create_dir_all(src.join(\"gamma\")).unwrap();\n\n        // Simulate removing \"beta\": delete its directory\n        let pkg_dir = src.join(\"beta\");\n        fs::remove_dir_all(\u0026pkg_dir).unwrap();\n\n        assert!(!pkg_dir.exists());\n        let remaining = list_packages(dir.path()).unwrap();\n        assert_eq!(remaining, vec![\"alpha\", \"gamma\"]);\n    }\n\n    #[test]\n    fn remove_multiple_directories_from_src() {\n        let dir = TempDir::new().unwrap();\n        setup_workspace(dir.path(), \"test\");\n\n        let src = dir.path().join(\"src\");\n        fs::create_dir_all(src.join(\"alpha\")).unwrap();\n        fs::create_dir_all(src.join(\"beta\")).unwrap();\n        fs::create_dir_all(src.join(\"gamma\")).unwrap();\n\n        // Remove \"alpha\" and \"gamma\"\n        fs::remove_dir_all(src.join(\"alpha\")).unwrap();\n        fs::remove_dir_all(src.join(\"gamma\")).unwrap();\n\n        let remaining = list_packages(dir.path()).unwrap();\n        assert_eq!(remaining, vec![\"beta\"]);\n    }\n\n    // ── sync_workspace_file tests ───────────────────────────────────\n\n    #[test]\n    fn sync_workspace_file_derives_folders_from_src() {\n        let dir = TempDir::new().unwrap();\n        setup_workspace(dir.path(), \"my-project\");\n\n        let src = dir.path().join(\"src\");\n        fs::create_dir_all(src.join(\"toolkit\")).unwrap();\n        fs::create_dir_all(src.join(\"utils\")).unwrap();\n\n        let meta = read_meta(dir.path()).unwrap().unwrap();\n        let ws_file_path = sync_workspace_file(dir.path(), \u0026meta).unwrap();\n\n        assert!(ws_file_path.exists());\n\n        let contents = fs::read_to_string(\u0026ws_file_path).unwrap();\n        let parsed: serde_json::Value = serde_json::from_str(\u0026contents).unwrap();\n        assert_eq!(parsed[\"folders\"][0][\"path\"], \"src/toolkit\");\n        assert_eq!(parsed[\"folders\"][0][\"name\"], \"toolkit\");\n        assert_eq!(parsed[\"folders\"][1][\"path\"], \"src/utils\");\n        assert_eq!(parsed[\"folders\"][1][\"name\"], \"utils\");\n    }\n\n    #[test]\n    fn sync_workspace_file_empty_src() {\n        let dir = TempDir::new().unwrap();\n        setup_workspace(dir.path(), \"empty-ws\");\n\n        let meta = read_meta(dir.path()).unwrap().unwrap();\n        let ws_file_path = sync_workspace_file(dir.path(), \u0026meta).unwrap();\n\n        let contents = fs::read_to_string(\u0026ws_file_path).unwrap();\n        let parsed: serde_json::Value = serde_json::from_str(\u0026contents).unwrap();\n        assert_eq!(parsed[\"folders\"].as_array().unwrap().len(), 0);\n    }\n\n    // ── adopt tests ─────────────────────────────────────────────────\n\n    #[test]\n    fn adopt_moves_directory_into_src() {\n        let ws_dir = TempDir::new().unwrap();\n        setup_workspace(ws_dir.path(), \"test-ws\");\n\n        // Create a source directory outside the workspace\n        let outside = TempDir::new().unwrap();\n        let source = outside.path().join(\"my-pkg\");\n        fs::create_dir_all(\u0026source).unwrap();\n        fs::write(source.join(\"hello.txt\"), \"world\").unwrap();\n\n        let source_canonical = source.canonicalize().unwrap();\n\n        let src_dir = ws_dir.path().join(\"src\");\n        let dest = src_dir.join(\"my-pkg\");\n        assert!(!dest.exists());\n\n        // Simulate the adopt logic: move source into ws/src/my-pkg\n        if fs::rename(\u0026source_canonical, \u0026dest).is_err() {\n            std::process::Command::new(\"cp\")\n                .args([\"-a\"])\n                .arg(\u0026source_canonical)\n                .arg(\u0026dest)\n                .status()\n                .unwrap();\n            fs::remove_dir_all(\u0026source_canonical).unwrap();\n        }\n\n        // Verify the directory moved\n        assert!(dest.join(\"hello.txt\").exists());\n        assert_eq!(fs::read_to_string(dest.join(\"hello.txt\")).unwrap(), \"world\");\n        assert!(!source.exists(), \"original should be gone after move\");\n\n        // Package is discovered from filesystem\n        let pkgs = list_packages(ws_dir.path()).unwrap();\n        assert_eq!(pkgs, vec![\"my-pkg\"]);\n    }\n\n    #[test]\n    fn adopt_copies_when_flag_set() {\n        let ws_dir = TempDir::new().unwrap();\n        setup_workspace(ws_dir.path(), \"test-ws\");\n\n        let outside = TempDir::new().unwrap();\n        let source = outside.path().join(\"copy-pkg\");\n        fs::create_dir_all(\u0026source).unwrap();\n        fs::write(source.join(\"data.txt\"), \"keep me\").unwrap();\n\n        let dest = ws_dir.path().join(\"src\").join(\"copy-pkg\");\n\n        // Copy instead of move\n        let status = std::process::Command::new(\"cp\")\n            .args([\"-a\"])\n            .arg(\u0026source)\n            .arg(\u0026dest)\n            .status()\n            .unwrap();\n        assert!(status.success());\n\n        // Verify destination has the file\n        assert!(dest.join(\"data.txt\").exists());\n        assert_eq!(\n            fs::read_to_string(dest.join(\"data.txt\")).unwrap(),\n            \"keep me\"\n        );\n        // Original still exists\n        assert!(source.exists(), \"original should still exist after copy\");\n\n        // Package is discovered from filesystem\n        let pkgs = list_packages(ws_dir.path()).unwrap();\n        assert_eq!(pkgs, vec![\"copy-pkg\"]);\n    }\n\n    #[test]\n    fn adopt_registers_already_in_src() {\n        let ws_dir = TempDir::new().unwrap();\n        setup_workspace(ws_dir.path(), \"test-ws\");\n\n        // Place a directory directly in src/\n        let pkg_dir = ws_dir.path().join(\"src\").join(\"existing-pkg\");\n        fs::create_dir_all(\u0026pkg_dir).unwrap();\n        fs::write(pkg_dir.join(\"marker.txt\"), \"I was here\").unwrap();\n\n        // The package is already discoverable — no move/copy needed\n        let pkgs = list_packages(ws_dir.path()).unwrap();\n        assert_eq!(pkgs, vec![\"existing-pkg\"]);\n\n        // File is still intact\n        assert_eq!(\n            fs::read_to_string(pkg_dir.join(\"marker.txt\")).unwrap(),\n            \"I was here\"\n        );\n    }\n\n    #[test]\n    fn adopt_detects_existing_directory_as_conflict() {\n        let ws_dir = TempDir::new().unwrap();\n        setup_workspace(ws_dir.path(), \"test-ws\");\n\n        // Place a directory in src/ with the name \"taken\"\n        fs::create_dir_all(ws_dir.path().join(\"src\").join(\"taken\")).unwrap();\n\n        // The package already exists on disk — adopt should detect the conflict\n        let pkgs = list_packages(ws_dir.path()).unwrap();\n        assert!(pkgs.contains(\u0026\"taken\".to_string()));\n    }\n\n    #[test]\n    fn adopt_errors_on_nonexistent_path() {\n        let dir = TempDir::new().unwrap();\n        let bogus = dir.path().join(\"does-not-exist\");\n        assert!(!bogus.exists());\n    }\n\n    #[test]\n    fn adopt_errors_on_file_path() {\n        let dir = TempDir::new().unwrap();\n        let file = dir.path().join(\"not-a-dir.txt\");\n        fs::write(\u0026file, \"hello\").unwrap();\n        assert!(file.exists());\n        assert!(!file.is_dir(), \"files should be rejected by adopt\");\n    }\n\n    // ── add_packages_to_workspace tests ──────────────────────────────\n\n    #[test]\n    fn add_packages_to_workspace_clones_git_repo() {\n        let ws_dir = TempDir::new().unwrap();\n        setup_workspace(ws_dir.path(), \"test-ws\");\n\n        // Create a mock \"remote\" git repo\n        let remote_dir = TempDir::new().unwrap();\n        let remote_repo = remote_dir.path().join(\"test-pkg\");\n        fs::create_dir_all(\u0026remote_repo).unwrap();\n        fs::write(remote_repo.join(\"README.md\"), \"test\").unwrap();\n\n        // Init git repo and commit the file\n        std::process::Command::new(\"git\")\n            .args([\"init\"])\n            .current_dir(\u0026remote_repo)\n            .output()\n            .unwrap();\n        std::process::Command::new(\"git\")\n            .args([\"config\", \"user.email\", \"test@test.com\"])\n            .current_dir(\u0026remote_repo)\n            .output()\n            .unwrap();\n        std::process::Command::new(\"git\")\n            .args([\"config\", \"user.name\", \"Test\"])\n            .current_dir(\u0026remote_repo)\n            .output()\n            .unwrap();\n        std::process::Command::new(\"git\")\n            .args([\"add\", \".\"])\n            .current_dir(\u0026remote_repo)\n            .output()\n            .unwrap();\n        std::process::Command::new(\"git\")\n            .args([\"commit\", \"-m\", \"init\"])\n            .current_dir(\u0026remote_repo)\n            .output()\n            .unwrap();\n\n        // Clone using full file:// URL\n        let url = format!(\"file://{}\", remote_repo.canonicalize().unwrap().display());\n        let result = add_packages_to_workspace(ws_dir.path(), \u0026[url]);\n\n        // The clone should succeed\n        assert!(result.is_ok());\n\n        // Verify the package was cloned into src/\n        let pkg_dir = ws_dir.path().join(\"src\").join(\"test-pkg\");\n        assert!(pkg_dir.exists());\n        assert!(pkg_dir.join(\"README.md\").exists());\n\n        // Verify it's discoverable\n        let pkgs = list_packages(ws_dir.path()).unwrap();\n        assert!(pkgs.contains(\u0026\"test-pkg\".to_string()));\n    }\n\n    #[test]\n    fn add_packages_to_workspace_errors_when_all_fail() {\n        let ws_dir = TempDir::new().unwrap();\n        setup_workspace(ws_dir.path(), \"test-ws\");\n\n        // Pre-create a package directory\n        let pkg_dir = ws_dir.path().join(\"src\").join(\"existing-pkg\");\n        fs::create_dir_all(\u0026pkg_dir).unwrap();\n        fs::write(pkg_dir.join(\"marker.txt\"), \"original\").unwrap();\n\n        // Try to add the same package - should fail with \"already exists\"\n        let remote_dir = TempDir::new().unwrap();\n        let remote_repo = remote_dir.path().join(\"existing-pkg\");\n        fs::create_dir_all(\u0026remote_repo).unwrap();\n        std::process::Command::new(\"git\")\n            .args([\"init\"])\n            .current_dir(\u0026remote_repo)\n            .output()\n            .unwrap();\n\n        let url = format!(\"file://{}\", remote_repo.canonicalize().unwrap().display());\n        let result = add_packages_to_workspace(ws_dir.path(), \u0026[url]);\n\n        // Should return an error when all packages fail\n        assert!(result.is_err());\n\n        // Original file should still be there\n        assert_eq!(\n            fs::read_to_string(pkg_dir.join(\"marker.txt },{"line":1111,"address":[],"length":0,"stats":{"Line":0}},{"line":1113,"address":[],"length":0,"stats":{"Line":0}}],"covered":95,"coverable":549},{"path":["/","Users","lpshanley","workplace","buona","src","buona","src","workspace","types.rs"],"content":"//! Domain types for workspace metadata.\n\nuse std::fs;\nuse std::path::Path;\n\nuse anyhow::{Context, Result};\nuse serde::{Deserialize, Serialize};\n\npub(super) const WORKSPACE_FILE: \u0026str = \"buona.workspace.json\";\n\n#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]\npub(crate) struct WorkspaceMeta {\n    pub(crate) name: String,\n}\n\n/// Read workspace metadata from a directory, if a `buona.workspace.json` exists.\n///\n/// Returns `Ok(None)` when the file is simply absent, and `Err` when the file\n/// exists but cannot be read or parsed.\npub(crate) fn read_meta(dir: \u0026Path) -\u003e Result\u003cOption\u003cWorkspaceMeta\u003e\u003e {\n    let path = dir.join(WORKSPACE_FILE);\n    match fs::read_to_string(\u0026path) {\n        Ok(contents) =\u003e {\n            let meta = serde_json::from_str(\u0026contents)\n                .with_context(|| format!(\"invalid {WORKSPACE_FILE} in {}\", dir.display()))?;\n            Ok(Some(meta))\n        }\n        Err(e) if e.kind() == std::io::ErrorKind::NotFound =\u003e Ok(None),\n        Err(e) =\u003e Err(e)\n            .with_context(|| format!(\"could not read {WORKSPACE_FILE} in {}\", dir.display())),\n    }\n}\n\n/// Write workspace metadata to the given directory.\npub(super) fn write_meta(dir: \u0026Path, meta: \u0026WorkspaceMeta) -\u003e Result\u003c()\u003e {\n    let meta_path = dir.join(WORKSPACE_FILE);\n    let json = serde_json::to_string_pretty(meta)?;\n    fs::write(\u0026meta_path, json + \"\\n\")\n        .with_context(|| format!(\"could not write {WORKSPACE_FILE}\"))?;\n    Ok(())\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use tempfile::TempDir;\n\n    #[test]\n    fn workspace_meta_round_trips_through_serde() {\n        let meta = WorkspaceMeta {\n            name: \"my-project\".to_string(),\n        };\n        let json = serde_json::to_string(\u0026meta).unwrap();\n        let deserialized: WorkspaceMeta = serde_json::from_str(\u0026json).unwrap();\n        assert_eq!(deserialized.name, \"my-project\");\n    }\n\n    #[test]\n    fn workspace_meta_ignores_legacy_packages_field() {\n        // Old metadata files may contain a \"packages\" array — serde should\n        // silently ignore it.\n        let json = r#\"{\"name\": \"old-workspace\", \"packages\": [{\"name\": \"pkg\", \"url\": \"x\"}]}\"#;\n        let meta: WorkspaceMeta = serde_json::from_str(json).unwrap();\n        assert_eq!(meta.name, \"old-workspace\");\n    }\n\n    #[test]\n    fn read_meta_returns_some_for_valid_workspace() {\n        let dir = TempDir::new().unwrap();\n        let meta = WorkspaceMeta {\n            name: \"test-workspace\".to_string(),\n        };\n        let json = serde_json::to_string_pretty(\u0026meta).unwrap();\n        fs::write(dir.path().join(WORKSPACE_FILE), json).unwrap();\n\n        let result = read_meta(dir.path()).unwrap();\n        assert!(result.is_some());\n        assert_eq!(result.unwrap().name, \"test-workspace\");\n    }\n\n    #[test]\n    fn read_meta_returns_none_for_missing_file() {\n        let dir = TempDir::new().unwrap();\n        let result = read_meta(dir.path()).unwrap();\n        assert!(result.is_none());\n    }\n\n    #[test]\n    fn write_meta_creates_file() {\n        let dir = TempDir::new().unwrap();\n        let meta = WorkspaceMeta {\n            name: \"test\".to_string(),\n        };\n        write_meta(dir.path(), \u0026meta).unwrap();\n\n        let result = read_meta(dir.path()).unwrap().unwrap();\n        assert_eq!(result.name, \"test\");\n    }\n}\n","traces":[{"line":20,"address":[],"length":0,"stats":{"Line":8}},{"line":21,"address":[],"length":0,"stats":{"Line":24}},{"line":22,"address":[],"length":0,"stats":{"Line":16}},{"line":23,
